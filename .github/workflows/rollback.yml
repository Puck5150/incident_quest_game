name: Rollback

# Redeploys an earlier tag or commit to GitHub Pages without touching `main`.
# Run it from the Actions tab (Run workflow) with a release tag such as v0.3.
# Afterwards, revert the bad change on `main` through a pull request so the
# next normal deploy does not bring it back.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to redeploy (for example v0.3)'
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
