# yaml-language-server: $schema=../../schemas/incident.json
id: aws-sqs-visibility-timeout
track: aws
difficulty: 2
title: "Customers are getting their invoices two or three times"
par_minutes: 10

ticket:
  from: "Customer support"
  severity: SEV3
  body: |
    Since yesterday's release, customers receive the same invoice email two
    or three times. A few have asked whether they were charged twice (they
    weren't). The invoice workers look healthy and the queue isn't backing up.

environment: |
  When an order ships, the shop sends a message to the SQS standard queue
  invoice-jobs. Four invoice-worker containers poll the queue, build the
  invoice and email it, then delete the message. Yesterday's release (v3.0)
  added a PDF attachment to every invoice.

diagram:
  nodes:
    - { id: shop, label: "shop (order shipped)", col: 0, row: 0, status: ok }
    - { id: sqs, label: "SQS: invoice-jobs", col: 1, row: 0, status: ok }
    - { id: workers, label: "invoice-worker x4", col: 2, row: 0, status: ok }
    - { id: email, label: "email provider", col: 3, row: 0, status: ok }
  edges:
    - { from: shop, to: sqs }
    - { from: sqs, to: workers }
    - { from: workers, to: email }

metrics:
  - name: "invoice-jobs: messages sent vs received (per 5 min)"
    unit: messages
    evidence: received-vs-sent
    series:
      - label: "NumberOfMessagesSent"
        points: [["day -1 09:00", 120], ["day -1 12:00", 118], ["release", 121], ["today 09:00", 119], ["today 12:00", 122]]
      - label: "NumberOfMessagesReceived"
        points: [["day -1 09:00", 121], ["day -1 12:00", 119], ["release", 266], ["today 09:00", 281], ["today 12:00", 290]]
  - name: "invoice-worker: time to process one job (p95)"
    unit: seconds
    evidence: processing-time
    threshold: { value: 30, label: "queue visibility timeout: 30 s" }
    series:
      - label: "p95"
        points: [["day -1 09:00", 4], ["day -1 12:00", 5], ["release", 44], ["today 09:00", 47], ["today 12:00", 46]]

logs:
  - name: "invoice-worker logs (one message)"
    evidence: same-message-twice
    lines: |
      10:02:11 worker-2 received msg 9a41... (order 88213) ApproximateReceiveCount=1
      10:02:41 worker-4 received msg 9a41... (order 88213) ApproximateReceiveCount=2
      10:02:57 worker-2 sent invoice INV-88213 to customer, deleted msg 9a41...
      10:03:11 worker-1 received msg 9a41... (order 88213) ApproximateReceiveCount=3
      10:03:26 worker-4 sent invoice INV-88213 to customer
      10:03:58 worker-1 sent invoice INV-88213 to customer
  - name: "release notes v3.0"
    lines: |
      invoice-worker: attach a PDF invoice (rendered with headless Chrome, 30-50 s per invoice)

terminal:
  prompt: "you@laptop:~$"
  commands:
    - match: "aws sqs get-queue-attributes --queue-url https://sqs.us-east-1.amazonaws.com/111122223333/invoice-jobs --attribute-names VisibilityTimeout"
      when_actions: [raise-timeout]
      output: |
        {
            "Attributes": {
                "VisibilityTimeout": "180"
            }
        }
    - match: "aws sqs get-queue-attributes --queue-url https://sqs.us-east-1.amazonaws.com/111122223333/invoice-jobs --attribute-names VisibilityTimeout"
      evidence: timeout-30
      output: |
        {
            "Attributes": {
                "VisibilityTimeout": "30"
            }
        }

hypotheses:
  - id: visibility-timeout
    text: "Jobs now take longer than the queue's 30-second visibility timeout, so each message becomes visible again and another worker processes it too."
    correct: true
  - id: shop-sends-twice
    text: "The shop is sending each message two or three times."
    feedback: "Messages sent didn't change (about 120 per 5 minutes); messages received more than doubled. The same message is being received several times, as its ApproximateReceiveCount shows."
  - id: email-retries
    text: "The email provider is retrying deliveries."
    feedback: "The worker logs show three different workers each sending the invoice for the same message. The duplicates come from your side."
  - id: worker-crash
    text: "Workers crash before deleting messages."
    feedback: "No crashes: each worker finishes and sends the invoice. The first one even deletes the message. The others got it because it reappeared at 30 seconds, while the first was still working."

actions:
  - id: timeout-too-low
    label: "aws sqs set-queue-attributes ... --attributes VisibilityTimeout=<under 90> (for example 31 or 45)"
    kind: wrong
    match_regex: "^aws sqs set-queue-attributes --queue-url https://sqs\\.us-east-1\\.amazonaws\\.com/111122223333/invoice-jobs --attributes VisibilityTimeout=(\\d|[1-8]\\d)$"
    feedback: "Jobs take 44 to 50 seconds at p95 and a busy worker can be slower, so a timeout under about 90 seconds still lets messages reappear mid-job and the duplicates continue. Set it from measured processing time with real headroom."
  - id: timeout-too-high
    label: "aws sqs set-queue-attributes ... --attributes VisibilityTimeout=<over 600> (for example 43200)"
    kind: wrong
    match_regex: "^aws sqs set-queue-attributes --queue-url https://sqs\\.us-east-1\\.amazonaws\\.com/111122223333/invoice-jobs --attributes VisibilityTimeout=(60[1-9]|6[1-9]\\d|[7-9]\\d{2}|\\d{4,})$"
    feedback: "A very long timeout hides a message for that whole time whenever a worker crashes or is redeployed mid-job: one failure delays that invoice for hours. Pick a few multiples of the real job time (180 to 300 seconds here) and extend it for long jobs with ChangeMessageVisibility."
  - id: raise-timeout
    label: "aws sqs set-queue-attributes --queue-url https://sqs.us-east-1.amazonaws.com/111122223333/invoice-jobs --attributes VisibilityTimeout=180"
    kind: fix
    match_regex: "^aws sqs set-queue-attributes --queue-url https://sqs\\.us-east-1\\.amazonaws\\.com/111122223333/invoice-jobs --attributes VisibilityTimeout=(9\\d|[1-5]\\d{2}|600)$"
    feedback: "Messages now stay invisible well past the slowest job (180 seconds, about four times the p95), so only one worker handles each invoice. Received drops back to match sent. If jobs ever run longer, extend the timeout from the worker (ChangeMessageVisibility) instead of raising it for everyone."
  - id: idempotent
    label: "Make invoice-worker idempotent atomically: claim INV-<order> with a conditional write (unique key, fails if already claimed), send, then mark it sent; an expired claim can be retaken after a crash"
    kind: fix
    feedback: "SQS standard queues deliver at least once, so a message can still arrive twice occasionally, and a worker can still crash mid-job. Because the claim is a single atomic conditional write, two workers can never both pass it, and a crash leaves an expired claim that a retry can take, so the invoice is neither duplicated nor lost."
  - id: check-then-send
    label: "Make invoice-worker idempotent by reading first: if INV-<order> is not in the sent table, send, then record it"
    kind: wrong
    feedback: "Check-then-send is a race: two workers can both read 'not sent' before either records it, and both send. Idempotency needs an atomic claim (a conditional write or a unique constraint), not a separate read and write."
  - id: dlq
    label: "Give invoice-jobs a dead-letter queue with a redrive policy (maxReceiveCount 5) and alarm on the DLQ depth"
    kind: fix
    feedback: "A message that keeps failing or timing out is now parked with its receive count intact instead of cycling forever, and an alarm tells someone. Duplicates like this one would also have shown up as rising ApproximateReceiveCount."
  - id: more-workers
    label: "Scale invoice-worker from 4 to 10 containers"
    kind: wrong
    feedback: "Every job still takes 45 seconds and still reappears at 30. More workers just pick up the reappearing messages faster."
  - id: retention
    label: "Increase the queue's message retention period"
    kind: wrong
    feedback: "Retention is how long unprocessed messages are kept (days). The problem is that messages come back after 30 seconds."
  - id: delete-first
    label: "Change the worker to delete each message as soon as it receives it, then build the invoice"
    kind: destructive
    feedback: "No more duplicates, and any worker that crashes or is redeployed mid-job loses that invoice for good: the message is gone and nothing will retry it."

solution_paths:
  - [raise-timeout, idempotent, dlq]

key_evidence: [same-message-twice, processing-time, timeout-30, received-vs-sent]

evidence_labels:
  same-message-twice: "The same message is received by three workers, 30 seconds apart"
  processing-time: "Since v3.0, a job takes about 45 seconds"
  timeout-30: "The queue's visibility timeout is the default 30 seconds"
  received-vs-sent: "Messages received more than doubled while messages sent stayed flat"

hints:
  nudge: "The same message reaches three workers about 30 seconds apart. What happens to a message 30 seconds after it's received?"
  direction: "Compare how long a job takes now with the queue's visibility timeout."
  answer: "Since the PDF change, jobs take ~45 s but the visibility timeout is 30 s, so each message reappears and another worker takes it. Raise the visibility timeout to a few times the slowest job (not 31, not hours), make the worker claim each invoice with an atomic conditional write (check-then-send is racy), and add a dead-letter queue."

analogy:
  title: "The task on the shared board"
  text: |
    Workers take a card from the board, and the card's slot stays covered
    for 30 seconds. Jobs used to take 5 seconds. Now each takes 45, so after
    30 seconds the slot looks free again, a second worker takes a copy of the
    same card, then a third. Give each card a longer cover, and have workers
    claim the card on the "done" list in one step (not look, then write,
    which two workers can do at once).

debrief:
  root_cause: |
    When a worker receives a message from SQS, the message stays in the
    queue but is hidden for the visibility timeout (30 seconds by default).
    If it isn't deleted by then, it becomes visible again. Release v3.0 added
    PDF rendering, so each invoice now takes about 45 seconds. Every message
    reappeared after 30 seconds and was picked up by another worker, and
    sometimes a third, each of which built and emailed the same invoice.
  ideal_path:
    - "Spot the pattern: messages received more than doubled while messages sent stayed the same."
    - "Follow one message: three workers, 30 seconds apart, rising receive count."
    - "Compare: jobs take ~45 s since v3.0; the queue's visibility timeout is 30 s."
    - "Raise the visibility timeout well above the slowest job but not absurdly (here 180 s), or extend it from the worker for long jobs."
    - "Make the worker idempotent with an atomic claim (conditional write on a unique key), because standard queues can deliver a message more than once anyway. Check-then-send is racy."
    - "Add a dead-letter queue with a redrive policy and an alarm, so repeated failures are parked and noticed."
  real_world: |
    Duplicate processing after a change that makes jobs slower is a classic
    SQS incident. Set the visibility timeout from measured processing time
    with headroom (AWS recommends six times the function timeout for Lambda
    consumers), extend it for long jobs, and design consumers so that
    processing a message twice does no harm.

concepts:
  - term: "SQS queue"
    text: "A managed message queue: producers send messages, and consumers poll for them, process them and delete them."
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html"
  - term: "Visibility timeout"
    text: "After a consumer receives a message, it's hidden from others for this long (30 seconds by default). If it isn't deleted in time, it reappears for someone else."
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html"
  - term: "At-least-once delivery"
    text: "Standard queues may deliver a message more than once, so consumers should be able to handle repeats safely."
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html"
  - term: "Idempotent"
    text: "Doing the same operation twice has the same effect as doing it once, like checking \"already sent?\" before sending."
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html"

sources:
