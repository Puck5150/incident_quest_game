    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html"
    retrieved: 2026-10-01
  - title: "Amazon SQS API: SetQueueAttributes (VisibilityTimeout, default 30)"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html"
    retrieved: 2026-10-01
  - title: "Amazon SQS: Available CloudWatch metrics (NumberOfMessagesSent, NumberOfMessagesReceived)"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html"
    retrieved: 2026-10-01
  - title: "AWS Lambda: Configuring an SQS event source (visibility timeout six times the function timeout)"
    url: "https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html"
    retrieved: 2026-10-01
  - title: "Amazon SQS: At-least-once delivery"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html"
    retrieved: 2026-10-01
