    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-how-route-53-chooses-records.html"
    retrieved: 2026-10-01
  - title: "Route 53: How Amazon Route 53 averts failover problems (mode of last resort)"
    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-problems.html"
    retrieved: 2026-10-01
  - title: "Route 53: How Amazon Route 53 determines whether a health check is healthy (18% rule)"
    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-determining-health-of-endpoints.html"
    retrieved: 2026-10-01
