    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-values-failover.html"
    retrieved: 2026-10-01
  - title: "Route 53: How Amazon Route 53 chooses records when health checking is configured (both unhealthy returns the primary; records without health checks are always healthy)"
    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-how-route-53-chooses-records.html"
    retrieved: 2026-10-01
  - title: "Route 53: How Amazon Route 53 averts failover problems (mode of last resort)"
    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-problems.html"
    retrieved: 2026-10-01
  - title: "Route 53: How Amazon Route 53 determines whether a health check is healthy (18% rule)"
    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-determining-health-of-endpoints.html"
    retrieved: 2026-10-01
  - title: "Route 53: IP address ranges of Amazon Route 53 servers (ROUTE53_HEALTHCHECKS)"
    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/route-53-ip-addresses.html"
    retrieved: 2026-10-01
  - title: "Route 53: Values that you specify when you create or update health checks (failure threshold)"
    url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html"
    retrieved: 2026-10-01
command_notes:
  "dig api.shop.example.com": "The CNAME's target shows which region clients are sent to, and the TTL how long they keep that answer."
