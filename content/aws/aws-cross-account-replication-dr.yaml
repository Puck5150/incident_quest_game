            points: [["09-29", 393971], ["09-30", 393971], ["10-01", 393971], ["10-02", 393971]]
    hypotheses:
      - id: needs-batch
        text: "Live replication only handles new writes. Objects that FAILED aren't retried, and objects from before the rule were never in scope: both need S3 Batch Replication."
        correct: true
      - id: retries
        text: "S3 will retry the failed objects now that permissions are fixed."
        feedback: "Failures from permissions go to FAILED, and a FAILED object isn't retried: you re-upload it or use Batch Replication. Only temporary failures stay PENDING and resume."
      - id: only-failed
        text: "Only the 18,406 failed objects are missing."
        feedback: "INV-71230 from August has no replication status at all: it predates the rule, so live replication never considered it. That's about 394,000 more."
    actions:
      - id: batch-none-failed
        label: "Create an S3 Batch Replication job on acme-orders-docs with an S3-generated manifest, filtered to ObjectReplicationStatuses NONE and FAILED (aws s3control create-job ...)"
        kind: fix
        match_regex: "^aws s3control create-job .*S3ReplicateObject.*$"
        feedback: "Batch Replication works through every object that was never replicated or failed, using the same rule (and now-working permissions). Check the job's completion report."
      - id: batch-failed-only
        label: "Create a Batch Replication job filtered to FAILED only"
        kind: wrong
        feedback: "That catches the 18,406 since Monday, but not the ~394,000 objects from before the rule existed (status NONE). The auditor asked for every document."
      - id: s3-sync
        label: "aws s3 sync s3://acme-orders-docs s3://acme-dr-orders-docs from a laptop"
        kind: wrong
        feedback: "That makes ordinary copies, not replicas: the source objects stay FAILED (and S3 Lifecycle blocks expiring or transitioning FAILED objects), and you've made new versions on your own credentials. Batch Replication fixes the status too."
      - id: recreate-bucket
        label: "Delete and recreate the DR bucket to restart replication from scratch"
        kind: destructive
        feedback: "Recreating the destination doesn't start replication of anything, and you'd destroy the replicas made today."
