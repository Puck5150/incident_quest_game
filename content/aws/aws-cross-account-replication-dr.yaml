    debrief:
      root_cause: |
        Live replication copies new writes. Objects that failed for
        permission reasons are marked FAILED and never retried, and objects
        that existed before the rule have no replication status at all. So
        after both fixes the DR bucket was still missing 18,406 documents
        from this week and about 394,000 older ones. S3 Batch Replication
        replicates both, filtered on NONE and FAILED, and leaves their
        status COMPLETED.
      ideal_path:
        - "Check a document from this week: still FAILED."
        - "Check an older one: no replication status."
        - "Size the gap from the failure metrics."
        - "Run Batch Replication for NONE and FAILED, then confirm the job and the statuses."
