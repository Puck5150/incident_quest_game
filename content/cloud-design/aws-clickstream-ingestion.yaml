    url: "https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html"
    retrieved: 2026-10-01
  - title: "Amazon Kinesis Data Streams: Choose the data stream capacity mode (on-demand and provisioned)"
    url: "https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html"
    retrieved: 2026-10-01
  - title: "Amazon Kinesis Data Streams: Change the data retention period (24 hours by default)"
    url: "https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html"
    retrieved: 2026-10-01
  - title: "Amazon Kinesis Data Streams: Develop enhanced fan-out consumers"
    url: "https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html"
    retrieved: 2026-10-01
  - title: "Amazon Data Firehose: What is Amazon Data Firehose?"
    url: "https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html"
    retrieved: 2026-10-01
  - title: "Amazon SQS: Basic architecture (consumers receive, process and delete messages)"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-basic-architecture.html"
    retrieved: 2026-10-01
