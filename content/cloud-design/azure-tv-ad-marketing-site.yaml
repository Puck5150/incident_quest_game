  - title: "What is Azure Application Gateway"
    url: "https://learn.microsoft.com/en-us/azure/application-gateway/overview"
    retrieved: 2026-09-30
  - title: "Reliability in Azure App Service (multiple instances, zone redundancy, regions)"
    url: "https://learn.microsoft.com/en-us/azure/reliability/reliability-app-service"
    retrieved: 2026-09-30
  - title: "Azure App Service: Scale up (scale-out instance limits per tier)"
    url: "https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up"
    retrieved: 2026-09-30
