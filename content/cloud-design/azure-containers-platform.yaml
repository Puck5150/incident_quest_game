    retrieved: 2026-10-01
  - title: "Azure Container Apps: Manage secrets (Key Vault references)"
    url: "https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets"
    retrieved: 2026-10-01
  - title: "Reliability in Azure Container Apps (zone redundancy)"
    url: "https://learn.microsoft.com/en-us/azure/reliability/reliability-azure-container-apps"
    retrieved: 2026-10-01
  - title: "Azure Kubernetes Service: Manage system node pools"
