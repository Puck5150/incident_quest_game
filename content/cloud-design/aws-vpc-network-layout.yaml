    url: "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html"
    retrieved: 2026-10-01
  - title: "Elastic Load Balancing: How it works (internet-facing load balancers route to private IP addresses)"
    url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html"
    retrieved: 2026-10-01
  - title: "Amazon RDS: Working with a DB instance in a VPC (Public access)"
    url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html"
    retrieved: 2026-10-01
  - title: "Amazon VPC: NAT gateway basics (one per Availability Zone for resiliency)"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html"
    retrieved: 2026-10-01
  - title: "Amazon VPC: Pricing for NAT gateways"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html"
    retrieved: 2026-10-01
  - title: "AWS PrivateLink: Gateway endpoints"
    url: "https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html"
    retrieved: 2026-10-01
