    retrieved: 2026-10-01
  - title: "Amazon EKS: What is Amazon EKS?"
    url: "https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html"
    retrieved: 2026-10-01
  - title: "Amazon EKS: Simplify node lifecycle with managed node groups"
    url: "https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html"
    retrieved: 2026-10-01
  - title: "Amazon EKS: Pricing (per-cluster hourly charge)"
