    url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html"
    retrieved: 2026-10-01
  - title: "Amazon ElastiCache: Minimizing downtime with Multi-AZ (automatic failover, replicas)"
    url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoFailover.html"
    retrieved: 2026-10-01
  - title: "Amazon ElastiCache: What is Amazon ElastiCache? (serverless and node-based caches)"
    url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html"
    retrieved: 2026-10-01
  - title: "Amazon DynamoDB: In-memory acceleration with DynamoDB Accelerator (DAX)"
    url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html"
    retrieved: 2026-10-01
  - title: "Amazon RDS: Multi-AZ DB instance deployments (standby doesn't serve reads)"
    url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html"
    retrieved: 2026-10-01
