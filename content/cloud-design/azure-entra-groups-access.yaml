    url: "https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership"
    retrieved: 2026-10-01
  - title: "Azure RBAC: Best practices (assign roles to groups, not users)"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/best-practices"
    retrieved: 2026-10-01
  - title: "Microsoft Entra ID: Best practices for Microsoft Entra roles (least privilege, fewer than five Global Administrators)"
    url: "https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices"
    retrieved: 2026-10-01
  - title: "Microsoft Entra ID: Built-in roles (Helpdesk Administrator)"
    url: "https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference"
    retrieved: 2026-10-01
  - title: "Microsoft Entra ID: Security defaults"
    url: "https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults"
    retrieved: 2026-10-01
  - title: "Microsoft Entra Conditional Access: Require MFA for all users"
    url: "https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-all-users-mfa-strength"
    retrieved: 2026-10-01
