# yaml-language-server: $schema=../../schemas/incident.json
id: gcp-service-account-no-role
track: gcp
difficulty: 1
title: "Invoices broke right after the security clean-up"
par_minutes: 8

ticket:
  from: "Finance tools team"
  severity: SEV3
  body: |
    Since this morning's deploy, invoice-renderer fails every request with a
    403 when it loads its templates from Cloud Storage. The deploy didn't
    touch the code: it only did what the security review asked, "stop using
    the default service account". Can we just switch back?

environment: |
  invoice-renderer is a Cloud Run service in the project shop-prod. It reads
  HTML templates from the bucket shop-invoice-templates. Until today it ran
  as the default Compute Engine service account, which in this project has
  the Editor role on the whole project. This morning it was redeployed with
  a new, dedicated service account:
  invoice-renderer@shop-prod.iam.gserviceaccount.com.

diagram:
  nodes:
    - { id: run, label: "Cloud Run invoice-renderer", col: 0, row: 0, status: down }
    - { id: sa, label: "service account invoice-renderer@", col: 1, row: 0, status: ok }
    - { id: bucket, label: "gs://shop-invoice-templates", col: 2, row: 0, status: ok }
  edges:
    - { from: run, to: sa }
    - { from: sa, to: bucket }

logs:
  - name: "Cloud Run logs: invoice-renderer"
    evidence: denied
    lines: |
      09:41:07 ERROR loading template invoice.html: 403 Forbidden:
        invoice-renderer@shop-prod.iam.gserviceaccount.com doesn't have storage.objects.get access to the Google Cloud Storage object.
  - name: "deploy notes, 09:30"
    evidence: sa-switched
    lines: |
      invoice-renderer: run as dedicated service account invoice-renderer@ instead of the default compute service account (security review SR-112). No code changes.

terminal:
  prompt: "you@cloudshell:~ (shop-prod)$"
  commands:
    - match: "gcloud run services describe invoice-renderer --region us-central1 --format='value(spec.template.spec.serviceAccountName)'"
      output: |
        invoice-renderer@shop-prod.iam.gserviceaccount.com
    - match: "gcloud storage buckets get-iam-policy gs://shop-invoice-templates"
      when_actions: [grant-viewer]
      output: |
        bindings:
        - members:
          - projectEditor:shop-prod
          - projectOwner:shop-prod
          role: roles/storage.legacyBucketOwner
        - members:
          - serviceAccount:invoice-renderer@shop-prod.iam.gserviceaccount.com
          role: roles/storage.objectViewer
    - match: "gcloud storage buckets get-iam-policy gs://shop-invoice-templates"
      evidence: no-binding
      output: |
        bindings:
        - members:
          - projectEditor:shop-prod
          - projectOwner:shop-prod
          role: roles/storage.legacyBucketOwner

hypotheses:
  - id: new-sa-no-role
    text: "The new service account has no role that lets it read objects in the bucket. The old one only worked because of its project-wide Editor role."
    correct: true
  - id: bucket-missing
    text: "The templates bucket or file was deleted."
    feedback: "Nothing in the bucket changed, and the error is about permission (\"doesn't have storage.objects.get access\"), not a missing object."
  - id: code-bug
    text: "The deploy introduced a bug in how templates are loaded."
    feedback: "No code changed. Only the identity the service runs as changed, and the error names that identity."
  - id: needs-key
    text: "The new service account needs a key file in the container."
    feedback: "Cloud Run gives the service its account's credentials automatically. It's authenticated fine: the error names the account. It just isn't authorized."

actions:
  - id: grant-viewer
    label: "gcloud storage buckets add-iam-policy-binding gs://shop-invoice-templates --member=serviceAccount:invoice-renderer@shop-prod.iam.gserviceaccount.com --role=roles/storage.objectViewer"
    kind: fix
    match_regex: "^gcloud storage buckets add-iam-policy-binding gs://shop-invoice-templates --member[ =]serviceAccount:invoice-renderer@shop-prod\\.iam\\.gserviceaccount\\.com --role[ =]roles/storage\\.objectViewer$"
    feedback: "Storage Object Viewer lets it view and list objects in this one bucket, and nothing else in the project. Templates load again, and the security review's goal is met."
  - id: switch-back
    label: "Redeploy with the default compute service account again"
    kind: wrong
    feedback: "It works because that account has Editor on the whole project: invoice-renderer could change almost anything. That's exactly what the security review asked you to stop."
  - id: project-editor
    label: "Grant the new service account the Editor role on the project"
    kind: wrong
    feedback: "Same problem with a new name. The service needs to read objects in one bucket; grant that, on that bucket."
  - id: public-bucket
    label: "Grant roles/storage.objectViewer to allUsers on the bucket"
    kind: destructive
    feedback: "That makes every template readable by anyone on the internet, and every file anyone adds to the bucket later. One binding for the service account was enough."

solution_paths:
  - [grant-viewer]

key_evidence: [denied, sa-switched, no-binding]

evidence_labels:
  denied: "The new service account is refused storage.objects.get on the template"
  sa-switched: "This morning the service moved from the default service account to a new dedicated one"
  no-binding: "The bucket's IAM policy has no binding for the new service account"

hints:
  nudge: "The code didn't change. What did, and what could the old identity do that the new one can't?"
  direction: "Look at which account the error names, and at the bucket's IAM policy."
  answer: "The new service account has no role on the bucket; the old default account worked only through its project Editor role. Grant roles/storage.objectViewer on gs://shop-invoice-templates to the new account."

analogy:
  title: "The new badge with no doors on it"
  text: |
    The night cleaner used to borrow the manager's master key, so every door
    opened. Security rightly took the master key away and issued the cleaner
    their own badge, but nobody added any doors to it. Don't hand back the
    master key; add the two rooms the cleaner actually cleans.

debrief:
  root_cause: |
    Google Cloud workloads act as service accounts, and a service account
    can only do what IAM role bindings allow. invoice-renderer used to run
    as the default Compute Engine service account, which in this project has
    the broad Editor role, so reading the bucket worked without anyone
    granting it. The security review rightly moved it to a dedicated service
    account, but nobody granted that account access to the templates bucket,
    so every read was refused.
  ideal_path:
    - "Read the error: which account was refused, and which permission (storage.objects.get)."
    - "Connect it to the change: the service now runs as a new dedicated account."
    - "Check the bucket's IAM policy: no binding for the new account."
    - "Grant roles/storage.objectViewer on that bucket to that account."
    - "Leave the default account behind, and review what else relied on its Editor role."
  real_world: |
    Moving workloads off default service accounts is good security practice,
    and it reliably exposes permissions nobody knew they depended on. Before
    switching, list what the workload touches and grant narrow predefined
    roles on those resources, then switch.

concepts:
  - term: "Service account"
    text: "An identity for a workload rather than a person. A Cloud Run service or VM runs as a service account and gets its credentials automatically."
    url: "https://docs.cloud.google.com/iam/docs/service-account-overview"
  - term: "Role binding"
    text: "IAM access is granted by binding a principal (like a service account) to a role on a resource, such as one bucket or a whole project."
    url: "https://docs.cloud.google.com/storage/docs/access-control/iam-roles"
  - term: "Predefined role"
    text: "A ready-made set of permissions for a job, like Storage Object Viewer (view and list objects). Much narrower than the basic Editor role."
    url: "https://docs.cloud.google.com/storage/docs/access-control/iam-roles"
  - term: "Default service account"
    text: "An account Google Cloud creates for some services. Depending on settings it may have the Editor role on the project, which is why Google recommends dedicated accounts instead."
    url: "https://docs.cloud.google.com/iam/docs/service-account-types"

sources:
  - title: "Cloud Storage: Troubleshooting (403: does not have storage.objects.get access)"
    url: "https://docs.cloud.google.com/storage/docs/troubleshooting"
    retrieved: 2026-10-01
  - title: "Cloud Storage: IAM roles (Storage Object Viewer)"
    url: "https://docs.cloud.google.com/storage/docs/access-control/iam-roles"
    retrieved: 2026-10-01
  - title: "IAM: Service account types (default service accounts and the Editor role)"
    url: "https://docs.cloud.google.com/iam/docs/service-account-types"
    retrieved: 2026-10-01
  - title: "IAM: Service accounts overview"
    url: "https://docs.cloud.google.com/iam/docs/service-account-overview"
    retrieved: 2026-10-01
