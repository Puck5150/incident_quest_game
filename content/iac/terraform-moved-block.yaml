# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-moved-block
track: iac
difficulty: 3
title: "A \"no-op refactor\" wants to delete the orders database"
par_minutes: 12

ticket:
  from: "Platform reviewer"
  severity: SEV2
  body: |
    PR #318 "refactor: move orders DB into a module" is described as a no-op,
    but the plan CI posted says "1 to destroy". Merging to main applies
    automatically. The author says the plan is just noisy and wants it in
    before the 16:00 change freeze; "we have snapshots anyway". Can someone
    check before this merges?

environment: |
  The infra-prod repository holds Terraform (v1.9) for production on AWS.
  On every pull request, CI runs terraform plan and posts it. On merge to
  main, CI runs terraform apply with the same configuration. State is
  stored remotely. The orders database is an Amazon RDS instance,
  orders-prod, holding every customer order.

diagram:
  nodes:
    - { id: pr, label: "PR #318", col: 0, row: 0, status: degraded }
    - { id: ci, label: "CI: plan / apply", col: 1, row: 0, status: ok }
    - { id: db, label: "RDS orders-prod", col: 2, row: 0, status: ok }
  edges:
    - { from: pr, to: ci }
    - { from: ci, to: db }

pipeline:
  name: "terraform · PR #318 plan"
  trigger: "pull_request · refactor/orders-db-module · Jordan"
  stages:
    - name: "terraform init"
      status: success
      duration_s: 9
    - name: "terraform validate"
      status: success
      duration_s: 2
      log: |
        Success! The configuration is valid.
    - name: "terraform plan"
      status: success
      duration_s: 14
      evidence: plan-destroy
      log: |
        Terraform used the selected providers to generate the following execution
        plan. Resource actions are indicated with the following symbols:
          + create
          - destroy

        Terraform will perform the following actions:

          # aws_db_instance.orders will be destroyed
          # (because aws_db_instance.orders is not in configuration)
          - resource "aws_db_instance" "orders" {
              - arn                 = "arn:aws:rds:us-east-1:123456789012:db:orders-prod" -> null
              - engine              = "postgres" -> null
              - id                  = "db-ORDERSPROD7Q2X" -> null
              - identifier          = "orders-prod" -> null
              - instance_class      = "db.r6g.large" -> null
              - skip_final_snapshot = false -> null
            }

          # module.database.aws_db_instance.orders will be created
          + resource "aws_db_instance" "orders" {
              + engine              = "postgres"
              + id                  = (known after apply)
              + identifier          = "orders-prod"
              + instance_class      = "db.r6g.large"
              + skip_final_snapshot = false
              # (8 more attributes known after apply)
            }

        Plan: 1 to add, 0 to change, 1 to destroy.
    - name: "post plan to PR"
      status: success
      duration_s: 1

terminal:
  prompt: "you@laptop:~/infra-prod (refactor/orders-db-module)$"
  commands:
    - match_regex: "^git diff (main|origin/main)( --stat)?$"
      example: "git diff main"
      evidence: refactor-diff
      output: |2
         main.tf                   | 24 +-----------------------
         modules/database/main.tf  | 22 ++++++++++++++++++++++
         2 files changed, 26 insertions(+), 23 deletions(-)

        -resource "aws_db_instance" "orders" {
        -  identifier     = "orders-prod"
        -  engine         = "postgres"
        -  instance_class = "db.r6g.large"
        -  ...
        -}
        +module "database" {
        +  source = "./modules/database"
        +}

terraform:
  dir: "~/infra-prod"
  files:
    - path: main.tf
      content: |
        terraform {
          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = "~> 5.0"
            }
          }
        }

        provider "aws" {
          region = "us-east-1"
        }

        module "database" {
          source = "./modules/database"
        }

        resource "aws_vpc" "main" {
          cidr_block = "10.40.0.0/16"
        }
    - path: modules/database/main.tf
      content: |
        resource "aws_db_instance" "orders" {
          identifier     = "orders-prod"
          engine         = "postgres"
          instance_class = "db.r6g.large"
        }
  modules:
    installed:
      - { key: database, source: ./modules/database, dir: modules/database }
  state:
    - type: aws_db_instance
      name: orders
      attrs:
        id: db-ORDERSPROD7Q2X
        arn: "arn:aws:rds:us-east-1:123456789012:db:orders-prod"
        identifier: orders-prod
        engine: postgres
        instance_class: db.r6g.large
        skip_final_snapshot: false
    - type: aws_vpc
      name: main
      attrs:
        id: vpc-0a1b2c3d4e5f60718
        arn: "arn:aws:ec2:us-east-1:123456789012:vpc/vpc-0a1b2c3d4e5f60718"
        cidr_block: 10.40.0.0/16
        enable_dns_support: true
        enable_dns_hostnames: false
        default_security_group_id: sg-0d2b4f6a8c1e39507
  evidence:
    - evidence: state-address
      command: state list
      contains: "aws_db_instance.orders"

files:
  - path: "main.tf (on the PR branch)"
    language: hcl
    content: |
      terraform {
        required_version = ">= 1.9"
      }

      module "database" {
        source = "./modules/database"
      }

      resource "aws_vpc" "main" {
        cidr_block = "10.40.0.0/16"
      }
  - path: "modules/database/main.tf (new on the PR branch)"
    language: hcl
    evidence: same-settings
    content: |
      resource "aws_db_instance" "orders" {
        identifier     = "orders-prod"
        engine         = "postgres"
        instance_class = "db.r6g.large"
        # ... identical settings, moved from main.tf
      }

logs:
  - name: "PR #318 conversation"
    lines: |
      Jordan: Pure refactor, the settings are copy-pasted exactly. The plan is noisy, Terraform does that.
      Jordan: We have nightly snapshots if anything goes wrong.
      Ana (reviewer): "will be destroyed" is not noise on a database.

hypotheses:
  - id: address-changed
    text: "The resource's address changed (from aws_db_instance.orders to module.database.aws_db_instance.orders), and nothing tells Terraform it's the same database."
    correct: true
  - id: forces-replacement
    text: "One of the copied settings differs and forces the database to be replaced."
    feedback: "A forced replacement shows one address with \"must be replaced\" and a \"forces replacement\" marker on the changed attribute. Here there are two different addresses: the old one is destroyed because it is \"not in configuration\", and a new one is created."
  - id: drift
    text: "Someone deleted or changed the database in the AWS console, so Terraform wants to recreate it."
    feedback: "If the database were gone, the plan would only create it. It wants to destroy aws_db_instance.orders, which means the state still tracks it at that address, and the state list confirms it."
  - id: noisy-plan
    text: "Nothing: Terraform reshuffles resources in plans when code moves, and apply will sort it out."
    feedback: "Terraform does exactly what the plan says. By default it treats a new address as an instruction to destroy the object at the old address and create one at the new address."

actions:
  - id: moved-block
    label: "Add a moved block (from = aws_db_instance.orders, to = module.database.aws_db_instance.orders) to the PR's main.tf and re-plan: it must show \"has moved to\" and nothing to destroy"
    kind: fix
    done_when:
      all:
        - file_contains: { path: /home/you/infra-prod/main.tf, matches: 'moved\s*\{[^}]*from\s*=\s*aws_db_instance\.orders(?![\w.\[-])[^}]*to\s*=\s*module\.database\.aws_db_instance\.orders(?![\w.\[-])' }
        - plan_has: { no_destroy: [aws_db_instance.orders, module.database.aws_db_instance.orders] }
        - not: { applied: { op: delete, address: aws_db_instance.orders } }
    feedback: "Before planning, Terraform finds the existing object at the from address and records it at the to address, so the plan shows \"has moved to\" and 0 to destroy. The move is declarative and reviewed in the PR, it is applied by the same merge that changes the code, and it travels to every workspace and environment that uses this code, each moving its own state the first time it applies."
  - id: state-mv
    label: "Fix prod state by hand: terraform state mv aws_db_instance.orders module.database.aws_db_instance.orders (or state rm the old address and import it at the new one)"
    kind: wrong
    done_when:
      all:
        - state_has: module.database.aws_db_instance.orders
        - state_lacks: aws_db_instance.orders
        - not: { file_contains: { path: /home/you/infra-prod/main.tf, matches: 'moved\s*\{' } }
        - not: { applied: { op: delete, address: aws_db_instance.orders } }
    feedback: "It does avoid the destroy in this one state (so does state rm plus import, with a gap where Terraform is not tracking the database), but it is one-off, imperative state surgery that is not in the PR: nobody reviews it, and it does not travel to staging, DR or any other workspace that applies this code, where the plan still destroys the database. It also changes production state before the code is merged, so until #318 merges, main's code still says aws_db_instance.orders and any plan from main wants to destroy the module address and create the old one. The durable fix is a moved block in the code (Terraform v1.1 and later), which keeps the move reviewable and repeatable."
  - id: prevent-destroy
    label: "Add lifecycle { prevent_destroy = true } to the resource in the new module"
    kind: wrong
    done_when:
      file_contains: { path: /home/you/infra-prod/modules/database/main.tf, matches: 'prevent_destroy\s*=\s*true' }
    feedback: "Worth having on a database, but it doesn't stop this: prevent_destroy doesn't prevent Terraform from destroying a resource if you remove its configuration, and the object being destroyed is the old address, which has no configuration at all now."
  - id: merge-with-snapshot
    label: "Merge it: take a final snapshot first, then restore it into the new instance"
    kind: destructive
    done_when: { applied: { op: delete, address: aws_db_instance.orders } }
    feedback: "The apply deletes orders-prod and creates an empty database with the same name. Every order placed between the snapshot and the end of the restore is lost, and checkout is down for the whole restore. A one-line moved block avoids all of it."

solution_paths:
  - [moved-block]

key_evidence: [plan-destroy, state-address, refactor-diff]
evidence_labels:
  plan-destroy: "The plan destroys aws_db_instance.orders because it's \"not in configuration\""
  state-address: "State tracks the database at the old address"
  refactor-diff: "The PR moved the resource into a module without a moved block"

hints:
  nudge: "Read the destroy line's second comment. Why does Terraform think the database is not in configuration?"
  direction: "Compare the address in state (terraform state list) with the address in the PR's code. How do you tell Terraform they're the same thing?"
  answer: "The PR moved the resource into a module, so its address changed. Add moved { from = aws_db_instance.orders, to = module.database.aws_db_instance.orders } to the PR and re-plan: it shows \"has moved to\" and nothing to destroy. terraform state mv would avoid the destroy in this one state, but it is not in the code and does not reach other environments."

analogy:
  title: "Moving the filing cabinet"
  text: |
    The office manager keeps a list of every cabinet and the room it's in.
    You carry the orders cabinet from Room 1 to the new Records room without
    telling them. At the next check, the list says "orders cabinet, Room 1":
    missing, so it gets written off, and a brand-new, empty one is ordered
    for Records. One note saying "moved from Room 1 to Records" would have
    kept the real cabinet, and everything in it.

debrief:
  root_cause: |
    PR #318 moved the aws_db_instance resource from the root module into
    modules/database without changing any settings. Terraform tracks objects
    by address, and the address changed from aws_db_instance.orders to
    module.database.aws_db_instance.orders. By default Terraform treats a new
    address as an instruction to destroy the existing resource and create a
    new one, so the plan would have deleted orders-prod and created an empty
    database. prevent_destroy wouldn't have stopped it, because it doesn't
    apply once a resource's configuration is removed. A moved block tells
    Terraform that the object at the old address now lives at the new one.
  ideal_path:
    - "Take \"will be destroyed\" on a database seriously, whatever the PR description says."
    - "Read why: \"aws_db_instance.orders is not in configuration\" next to a create at a new module address."
    - "Confirm with terraform state list: state tracks the database at the old address."
    - "Add a moved block from the old address to the new one, in the same PR (not a one-off terraform state mv, which no reviewer sees and other environments never get)."
    - "Re-plan: \"has moved to\" and Plan: 0 to add, 0 to change, 0 to destroy."
  real_world: |
    Refactors that move resources into modules are one of the most common
    ways teams nearly delete production data. Make CI fail or require
    explicit approval when a plan destroys stateful resources, keep moved
    blocks in the code for as long as anyone might apply an older version,
    and never accept "the plan is noisy" as a review comment.

sources:
  - title: "Terraform: Refactor modules (moved blocks)"
    url: "https://developer.hashicorp.com/terraform/language/modules/develop/refactoring"
    retrieved: 2026-10-01
  - title: "Terraform: moved block reference"
    url: "https://developer.hashicorp.com/terraform/language/block/moved"
    retrieved: 2026-10-01
  - title: "Terraform: lifecycle meta-argument (prevent_destroy)"
    url: "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"
    retrieved: 2026-10-01
  - title: "Terraform CLI: terraform state mv"
    url: "https://developer.hashicorp.com/terraform/cli/commands/state/mv"
    retrieved: 2026-10-01
command_notes:
  "git diff main": "The resource moved into a module with no moved block, so Terraform sees a destroy at the old address and a create at the new one."
