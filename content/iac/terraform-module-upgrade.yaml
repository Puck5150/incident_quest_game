# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-module-upgrade
published: false
track: iac
difficulty: 3
title: "Nobody touched the Terraform, and the plan wants to replace the production database"
par_minutes: 12

ticket:
  from: "Orders team"
  severity: SEV3
  body: |
    Our terraform plan in ~/infra now wants to replace the orders database
    and then stops with "Instance cannot be destroyed". I haven't changed
    any Terraform: git says the tree is clean and main is what was last
    applied. The only thing I did this morning was run terraform init
    -upgrade to pick up a provider fix. I need a clean plan before the
    afternoon deploy. Can I just take prevent_destroy out for today?

environment: |
  The orders database is an RDS for PostgreSQL instance (orders-db) in
  account 123456789012, us-east-1, created through the platform team's
  shared acme/database/aws module from the Terraform registry. It holds
  production data and applications connect through its endpoint. The
  Terraform that calls the module is in ~/infra.

terminal:
  prompt: "you@laptop:~/infra$"
  commands:
    - match: "git status"
      evidence: config-unchanged
      output: |
        On branch main
        Your branch is up to date with 'origin/main'.

        nothing to commit, working tree clean
    - match: "git log --oneline"
      output: |
        86a8f1f db: take the password from a variable
        624a113 adopt acme/database/aws for the orders database
        d0f319a initial provider setup
    - match: "git log -p -- main.tf"
      evidence: floating-constraint
      output: |
        commit 86a8f1f4031117bf9807574e1c2bdbdf591f4b81
        Author: Dana Whitfield <dana@example.com>
        Date:   Tue Sep 8 10:12:41 2026 -0500

            db: take the password from a variable

        diff --git a/main.tf b/main.tf
        index 906aa6d..933a40c 100644
        --- a/main.tf
        +++ b/main.tf
        @@ -11,9 +11,15 @@ provider "aws" {
           region = "us-east-1"
         }
         
        +variable "db_password" {
        +  type      = string
        +  sensitive = true
        +}
        +
         module "db" {
           source  = "acme/database/aws"
           version = "~> 2.0"
         
           identifier = "orders-db"
        +  password   = var.db_password
         }

        commit 624a113ab2dffad73e695b10c32d3d045208f53a
        Author: Dana Whitfield <dana@example.com>
        Date:   Wed Aug 12 15:40:03 2026 -0500

            adopt acme/database/aws for the orders database

        diff --git a/main.tf b/main.tf
        index 61b6b4e..906aa6d 100644
        --- a/main.tf
        +++ b/main.tf
        @@ -10,3 +10,10 @@ terraform {
         provider "aws" {
           region = "us-east-1"
         }
        +
        +module "db" {
        +  source  = "acme/database/aws"
        +  version = "~> 2.0"
        +
        +  identifier = "orders-db"
        +}

        commit d0f319ad819cff89146ea00b78517c2a9b625fec
        Author: Dana Whitfield <dana@example.com>
        Date:   Tue Jul 21 09:00:00 2026 -0500

            initial provider setup

        diff --git a/main.tf b/main.tf
        new file mode 100644
        index 0000000..61b6b4e
        --- /dev/null
        +++ b/main.tf
        @@ -0,0 +1,12 @@
        +terraform {
        +  required_providers {
        +    aws = {
        +      source  = "hashicorp/aws"
        +      version = "~> 5.0"
        +    }
        +  }
        +}
        +
        +provider "aws" {
        +  region = "us-east-1"
        +}
    - match: "cat .terraform/modules/modules.json"
      evidence: module-2-1-0-installed
      output: |
        {"Modules":[{"Key":"","Source":"","Dir":"."},{"Key":"db","Source":"registry.terraform.io/acme/database/aws","Version":"2.1.0","Dir":".terraform/modules/db"}]}
    - match: "cat .terraform/modules/db/main.tf"
      evidence: module-sets-encryption
      output: &module210 |
        variable "identifier" {
          type = string
        }

        variable "password" {
          type      = string
          sensitive = true
        }

        variable "storage_encrypted" {
          type    = bool
          default = true
        }

        resource "aws_db_instance" "main" {
          identifier          = var.identifier
          engine              = "postgres"
          engine_version      = "15.4"
          instance_class      = "db.r6g.large"
          allocated_storage   = 100
          db_name             = "orders"
          username            = "orders_admin"
          password            = var.password
          multi_az            = true
          storage_encrypted   = var.storage_encrypted
          skip_final_snapshot = false

          lifecycle {
            prevent_destroy = true
          }
        }

        output "endpoint" {
          value = aws_db_instance.main.endpoint
        }

terraform:
  dir: "~/infra"
  files:
    - path: main.tf
      content: |
        terraform {
          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = "~> 5.0"
            }
          }
        }

        provider "aws" {
          region = "us-east-1"
        }

        variable "db_password" {
          type      = string
          sensitive = true
        }

        module "db" {
          source  = "acme/database/aws"
          version = "~> 2.0"

          identifier = "orders-db"
          password   = var.db_password
        }
  vars:
    db_password: "orders-admin-secret"
  modules:
    registry:
      - source: acme/database/aws
        versions:
          - version: 2.0.1
            files:
              - path: main.tf
                content: |
                  variable "identifier" {
                    type = string
                  }

                  variable "password" {
                    type      = string
                    sensitive = true
                  }

                  resource "aws_db_instance" "main" {
                    identifier          = var.identifier
                    engine              = "postgres"
                    engine_version      = "15.4"
                    instance_class      = "db.r6g.large"
                    allocated_storage   = 100
                    db_name             = "orders"
                    username            = "orders_admin"
                    password            = var.password
                    multi_az            = true
                    skip_final_snapshot = false

                    lifecycle {
                      prevent_destroy = true
                    }
                  }

                  output "endpoint" {
                    value = aws_db_instance.main.endpoint
                  }
          - version: 2.1.0
            files:
              - path: main.tf
                content: *module210
    installed:
      - { key: db, source: acme/database/aws, version: 2.1.0 }
  state:
    - module: module.db
      type: aws_db_instance
      name: main
      attrs:
        id: orders-db
        arn: "arn:aws:rds:us-east-1:123456789012:db:orders-db"
        identifier: orders-db
        engine: postgres
        engine_version: "15.4"
        instance_class: db.r6g.large
        allocated_storage: 100
        db_name: orders
        username: orders_admin
        password: orders-admin-secret
        multi_az: true
        skip_final_snapshot: false
        storage_encrypted: false
        endpoint: "orders-db.cxyz.us-east-1.rds.amazonaws.com:5432"
  evidence:
    - evidence: prevent-destroy-blocked
      command: plan
      contains: "Instance cannot be destroyed"
    - evidence: encryption-forces-replacement
      command: plan
      contains: "storage_encrypted"
    - evidence: provider-unchanged
      command: version
      contains: "provider registry.terraform.io/hashicorp/aws v5.67.0"

hypotheses:
  - id: module-newer-version
    text: "The registry module resolved to a newer 2.x release than the one that built this database, and that release sets storage_encrypted = true by default, which can only be applied by replacing the instance."
    correct: true
  - id: provider-upgrade
    text: "The AWS provider that init -upgrade fetched changed how storage_encrypted behaves."
    feedback: "terraform version still shows the aws provider at v5.67.0 and git status says the lock file is unchanged. The resource arguments that differ come from the module's code, not from a provider change."
  - id: config-changed
    text: "Someone changed the database's settings in the Terraform code."
    feedback: "git status is clean and git log -p -- main.tf shows the module call has not changed since the password variable was added. The root configuration asks for the same thing it always did."
  - id: console-change
    text: "Someone changed the database outside Terraform, and Terraform wants to put it back."
    feedback: "That would show up above the plan as a note that objects changed outside of Terraform, and the arrow would run from the live value back to the configured one. Here the live value, false, is what state records; it is the configuration that now asks for true."

actions:
  - id: pin-the-module
    label: "Pin the module call to the exact release that built the database (2.0.1) and run terraform init so it is installed, then confirm the plan has no changes (an interim hold: the database is still unencrypted)"
    kind: fix
    done_when:
      all:
        - plan_clean: true
        - not: { applied: { op: delete, address: module.db } }
        # the pin is in the reviewed code: an exact version (2.0.x, optionally with =), not a range
        - file_contains: { path: /home/you/infra/main.tf, matches: '^\s*version\s*=\s*"\s*=?\s*2\.0\.\d+\s*"\s*(#.*|//.*)?$' }
        # world-based: whatever the constraint says, 2.0.x is what init installed (manifest layout: Key, Source, Version, Dir)
        - file_contains: { path: /home/you/infra/.terraform/modules/modules.json, matches: '"Key":"db","Source":"[^"]*","Version":"2\.0\.\d+","Dir"' }
    feedback: "The same database, orders-db, is still in place, the installed module is back on a 2.0 release and the plan is empty. The version the stack runs is now decided by an exact pin in the code you review, instead of by whenever someone last ran init. This is an interim hold, not the end: the pin keeps the module's encrypted-by-default behaviour out of production only until you migrate, and this database is unencrypted today. The next job is the snapshot-copy migration."
  - id: override-the-input
    label: "Keep 2.1.0 and set storage_encrypted = false in the module call so the plan goes quiet"
    kind: wrong
    done_when:
      file_contains: { path: /home/you/infra/main.tf, matches: '^\s*storage_encrypted\s*=\s*false\s*$' }
    feedback: "The plan goes quiet, but only because you wrote the unencrypted state of the database into the code and overrode a security default the platform team just turned on. The module's new default (encrypted) is the right target; the database is the thing that is behind. The reviewed code now says production data stays unencrypted, and the override is easy to forget. Pin the exact version that matches what is running to stop the surprise today, then plan the snapshot-copy migration to an encrypted instance."
  - id: edit-the-cached-module
    label: "Add ignore_changes (or change a default) in the downloaded module under .terraform/modules/db so the plan goes quiet"
    kind: wrong
    done_when:
      file_contains: { path: /home/you/infra/.terraform/modules/db/main.tf, matches: 'ignore_changes|default\s*=\s*false' }
    feedback: "The plan goes quiet, but only on this laptop. .terraform/modules is a download cache that terraform init fills and init -upgrade or get -update overwrites, so the edit vanishes the next time anyone refreshes, and CI (which runs init itself) never had it. The module's published code is still 2.1.0, and nothing in the repository says why this checkout differs."
  - id: upgrade-again
    label: "Run terraform init -upgrade (or terraform get -update) again to get back to a working state"
    kind: wrong
    feedback: "-upgrade re-resolves every module to the newest version the constraint allows. ~> 2.0 allows 2.1.0, so you get 2.1.0 again and the same plan. The constraint, not the cache, is what has to change."
  - id: unguard-and-apply
    label: "Remove prevent_destroy from the module's code and apply so the deploy can go ahead"
    kind: destructive
    done_when: { applied: { op: delete, address: module.db.aws_db_instance.main } }
    feedback: "Terraform destroyed orders-db, with its data, and created a new empty one with encryption on. prevent_destroy was the only thing standing between a module release and the production database. Backups may let you recover the data, but this is a restore under pressure instead of a reviewed change."

solution_paths:
  - [pin-the-module]

key_evidence: [encryption-forces-replacement, module-2-1-0-installed, module-sets-encryption, floating-constraint, config-unchanged]

evidence_labels:
  encryption-forces-replacement: "The plan changes storage_encrypted false -> true on module.db's database, which forces replacement"
  module-2-1-0-installed: "modules.json shows acme/database/aws installed at version 2.1.0"
  module-sets-encryption: "The installed module's code sets storage_encrypted from a variable that defaults to true"
  floating-constraint: "The module call only says version = \"~> 2.0\", which allows any 2.x"
  config-unchanged: "The repository has no changes: nothing in your own code moved"

hints:
  nudge: "Nothing in the repository changed, but the plan did. What else feeds a plan besides your own files?"
  direction: "The module call does not name a version, only a range. See which version is installed (.terraform/modules/modules.json) and what its code does differently."
  answer: "init -upgrade installed 2.1.0 of acme/database/aws, which sets storage_encrypted = true by default; ~> 2.0 allows it. Pin the exact version that built the database (version = \"2.0.1\", not a range), run terraform init so that release is installed, and plan until it says No changes. Do not set storage_encrypted = false to quiet the plan: that writes the unencrypted database into the code and switches off the new default. Pinning is only the interim hold: the database is still unencrypted, so the real fix that follows is the snapshot-copy migration, after which you raise the pin."

analogy:
  title: "The supplier changed the recipe"
  text: |
    The kitchen orders "any 2.x bread" from the bakery. Last week's loaf
    was plain; this week the bakery quietly started adding sesame, still
    labelled 2.x. Nothing in the kitchen's own recipe changed, but the
    dish is now different, and the oven that bakes it fresh from scratch
    (the replace) is the one you do not want to light under the
    wedding cake. Naming the exact loaf you want means the recipe only
    changes when the kitchen decides.

debrief:
  root_cause: |
    The module call asked for acme/database/aws "~> 2.0", which accepts any
    2.x release. Terraform does not remember module versions in the lock
    file, which tracks only providers; whenever init installs the module
    it takes the newest release the constraint allows, and init -upgrade
    re-resolves every module that way. This morning's init -upgrade moved
    the installed module from 2.0.1 to 2.1.0. That release sets
    storage_encrypted from a variable that defaults to true, and
    storage_encrypted on an RDS instance cannot change in place, so the
    plan replaced the database. prevent_destroy refused the destroy, and
    the plan stopped.
  ideal_path:
    - "Read the failed plan: module.db.aws_db_instance.main must be replaced because storage_encrypted goes from false to true, and prevent_destroy stops the destroy."
    - "Notice nothing in the repository changed (git status clean, no new commits to main.tf) and the provider is the same version."
    - "Look at .terraform/modules/modules.json (installed Version 2.1.0) and the module's code, which now sets storage_encrypted from a variable that defaults to true."
    - "See that the module call only says version = \"~> 2.0\", which allows 2.1.0."
    - "Pin the exact version that built the database (2.0.1), run terraform init so the pinned release replaces 2.1.0, and plan until it says No changes. Do not set storage_encrypted = false to get a quiet plan: that overrides the module's new secure default and records an unencrypted production database in the code."
    - "The pin is interim: the database is unencrypted today and RDS can only be encrypted at creation, so do the snapshot-copy migration next (snapshot, copy with a KMS key, restore, cut over), rehearsed on a copy, then move the pin to 2.1.0 in a reviewed change."
  real_world: |
    A module's version is an input, just like a variable. A range like
    ~> 2.0 lets that input change underneath you whenever someone runs
    init -upgrade or a fresh checkout runs init, and the lock file does not
    protect you because it only records providers. Terraform's own
    guidance for third-party modules is to require specific versions so
    updates only happen when convenient to you. Read a release's notes
    before raising the pin, try the upgrade in a non-production copy of
    the stack first, and raise the version in a reviewed change. Keep
    prevent_destroy on anything holding data you cannot recreate: here it
    turned a module release into a failed plan instead of a lost
    database. Getting encryption onto an existing RDS instance is a
    migration through an encrypted snapshot copy, not a setting you can
    flip, and it is not something to paper over by setting the module's
    encryption input to false: the pin holds production steady while you
    plan the migration, and the module's secure default stays the goal.

concepts:
  - term: "Module version constraint"
    text: "For a module from a registry, the version argument limits which releases Terraform may install. ~> 2.0 allows any 2.x release but not 3.0; an exact version allows exactly one."
    url: "https://developer.hashicorp.com/terraform/language/expressions/version-constraints"
  - term: "terraform init -upgrade"
    text: "Re-resolves modules and providers to the newest versions the constraints allow, instead of keeping what is already installed."
    url: "https://developer.hashicorp.com/terraform/cli/commands/init"
  - term: "Dependency lock file"
    text: "Records the selected versions of providers only. Terraform does not remember version selections for remote modules."
    url: "https://developer.hashicorp.com/terraform/language/files/dependency-lock"
  - term: "prevent_destroy"
    text: "Makes Terraform reject any plan that would destroy the resource."
    url: "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"

sources:
  - title: "Terraform: Module blocks (the version argument and terraform init)"
    url: "https://developer.hashicorp.com/terraform/language/modules/configuration"
    retrieved: 2026-10-09
  - title: "Terraform: Version constraints"
    url: "https://developer.hashicorp.com/terraform/language/expressions/version-constraints"
    retrieved: 2026-10-09
  - title: "Terraform: Command: init"
    url: "https://developer.hashicorp.com/terraform/cli/commands/init"
    retrieved: 2026-10-09
  - title: "Terraform: Dependency lock file"
    url: "https://developer.hashicorp.com/terraform/language/files/dependency-lock"
    retrieved: 2026-10-09
  - title: "Terraform: The lifecycle meta-argument"
    url: "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"
    retrieved: 2026-10-09
  - title: "Amazon RDS: Encrypting Amazon RDS resources (limitations)"
    url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html"
    retrieved: 2026-10-09

command_notes:
  "aws rds describe-db-snapshots --db-snapshot-identifier orders-db-enc-2-1": "Whether the encrypted copy exists yet, is available and reports Encrypted = true."
  "git status": "Nothing is modified: your own code did not change."
  "git log --oneline": "Three commits. None changes the database settings."
  "git log -p -- main.tf": "The module call was added with version = \"~> 2.0\" and has only gained the password since. The range allows any 2.x release."
  "cat .terraform/modules/modules.json": "init's record of what it installed: acme/database/aws at Version 2.1.0."
  "cat .terraform/modules/db/main.tf": "The installed module's code: storage_encrypted comes from a variable that defaults to true."

stages:
  - id: encrypt-for-real
    update: |
      The pin is merged and the afternoon deploy went out. Security's review
      the next morning: orders-db still reports StorageEncrypted = false, and
      the platform team's module 2.1.0 (encrypted by default) cannot be
      adopted until the database itself is encrypted. The change window is
      Saturday 02:00-04:00. Prepare the migration with the names the runbook
      uses: snapshot orders-db-pre-2-1, encrypted copy orders-db-enc-2-1
      (KMS alias alias/orders-db), new instance orders-db-v2.
    diagram_status: {}
    files:
      - path: "Amazon RDS: encrypting an existing instance (excerpt)"
        evidence: encrypted-copy-route
        content: |
          You can't turn encryption on for an existing unencrypted DB instance.
          To encrypt one: create a snapshot, copy the snapshot with a KMS key
          (the copy is encrypted), then restore a new DB instance from the
          encrypted copy. A snapshot restored without that copy produces an
          unencrypted instance again.
    terminal:
      commands:
        - match_regex: "^aws rds describe-db-snapshots --db-snapshot-identifier orders-db-enc-2-1$"
          example: "aws rds describe-db-snapshots --db-snapshot-identifier orders-db-enc-2-1"
          when_actions: [copy-encrypted]
          output: |
            {
                "DBSnapshots": [
                    {
                        "DBSnapshotIdentifier": "orders-db-enc-2-1",
                        "DBInstanceIdentifier": "orders-db",
                        "Status": "available",
                        "Encrypted": true,
                        "KmsKeyId": "arn:aws:kms:us-east-1:123456789012:key/orders-db"
                    }
                ]
            }
        - match_regex: "^aws rds describe-db-snapshots --db-snapshot-identifier orders-db-enc-2-1$"
          example: "aws rds describe-db-snapshots --db-snapshot-identifier orders-db-enc-2-1"
          output: |
            An error occurred (DBSnapshotNotFound) when calling the DescribeDBSnapshots operation: DBSnapshot not found: orders-db-enc-2-1
    hypotheses:
      - id: needs-encrypted-copy
        text: "An existing RDS instance can't be encrypted in place. The data has to go through a snapshot, an encrypted copy of it, and a restore to a new instance, then a cutover."
        correct: true
      - id: toggle-later
        text: "Encryption can be switched on for orders-db in the console during the window, with a short restart."
        feedback: "There is no such setting: RDS only encrypts at creation, which is why the Terraform plan wanted to replace the instance."
      - id: terraform-only
        text: "Raising the pin to 2.1.0 with prevent_destroy lifted during the window is the migration."
        feedback: "That replaces the instance with a new, empty, encrypted one: Terraform destroys the old database and creates another from nothing. The data has to be restored from an encrypted snapshot copy."
    actions:
      - id: create-snapshot
        label: "aws rds create-db-snapshot --db-instance-identifier orders-db --db-snapshot-identifier orders-db-pre-2-1"
        kind: fix
        match_regex: "^aws rds create-db-snapshot(?=.*--db-instance-identifier orders-db(\\s|$))(?=.*--db-snapshot-identifier orders-db-pre-2-1(\\s|$))(?!.*--region[ =](?!us-east-1(\\s|$)))( --(db-instance-identifier|db-snapshot-identifier|region)[ =][^\\s-]\\S*){2,3}$"
        feedback: "A manual snapshot of the unencrypted instance exists. It is also your rollback point: nothing has changed on orders-db."
      - id: copy-encrypted
        label: "aws rds copy-db-snapshot --source-db-snapshot-identifier orders-db-pre-2-1 --target-db-snapshot-identifier orders-db-enc-2-1 --kms-key-id alias/orders-db"
        kind: fix
        after: [create-snapshot]
        match_regex: "^aws rds copy-db-snapshot(?=.*--source-db-snapshot-identifier orders-db-pre-2-1(\\s|$))(?=.*--target-db-snapshot-identifier orders-db-enc-2-1(\\s|$))(?=.*--kms-key-id[ =][^\\s-][^\\s]*(\\s|$))(?!.*--region[ =](?!us-east-1(\\s|$)))( --(source-db-snapshot-identifier|target-db-snapshot-identifier|kms-key-id|region)[ =][^\\s-]\\S*){3,4}$"
        feedback: "The copy is encrypted with the KMS key. Check it is available before restoring from it."
      - id: restore-encrypted
        label: "aws rds restore-db-instance-from-db-snapshot --db-instance-identifier orders-db-v2 --db-snapshot-identifier orders-db-enc-2-1"
        kind: fix
        after: [copy-encrypted]
        match_regex: "^aws rds restore-db-instance-from-db-snapshot(?=.*--db-instance-identifier orders-db-v2(\\s|$))(?=.*--db-snapshot-identifier orders-db-enc-2-1(\\s|$))(?!.*--region[ =](?!us-east-1(\\s|$)))( --(db-instance-identifier|db-snapshot-identifier|region)[ =][^\\s-]\\S*){2,3}$"
        feedback: "orders-db-v2 is being created encrypted, from the data in the snapshot. orders-db keeps serving. Next, in the window: stop writes, take a last snapshot and restore from its encrypted copy (or replay changes), cut the applications over, import orders-db-v2 into Terraform with storage_encrypted = true and prevent_destroy, and retire the old instance only after the checks pass."
      - id: restore-unencrypted
        label: "aws rds restore-db-instance-from-db-snapshot --db-instance-identifier orders-db-v2 --db-snapshot-identifier orders-db-pre-2-1"
        kind: wrong
        match_regex: "^aws rds restore-db-instance-from-db-snapshot (?=.*--db-instance-identifier orders-db-v2(\\s|$))(?=.*--db-snapshot-identifier orders-db-pre-2-1(\\s|$))"
        feedback: "A restore from the unencrypted snapshot gives an unencrypted instance. Copy the snapshot with a KMS key first and restore from the copy."
      - id: delete-old-first
        label: "aws rds delete-db-instance --db-instance-identifier orders-db --skip-final-snapshot (to clear the way for the encrypted one)"
        kind: destructive
        match_regex: "^aws rds delete-db-instance (?=.*--db-instance-identifier[ =]orders-db(\\s|$))"
        feedback: "That deletes the live production database (with or without a final snapshot) before anything has been restored, verified or cut over. The new instance comes after the checks, and the old one is retired last."
    solution_paths:
      - [create-snapshot, copy-encrypted, restore-encrypted]
    key_evidence: [encrypted-copy-route]
    evidence_labels:
      encrypted-copy-route: "An unencrypted instance is encrypted by copying a snapshot with a KMS key and restoring from the copy"
    hints:
      nudge: "The Terraform plan could not turn encryption on in place. What does AWS offer instead?"
      direction: "Read the RDS excerpt: snapshot, copy with a KMS key, restore from the copy. Verify the copy with describe-db-snapshots."
      answer: "Create the snapshot orders-db-pre-2-1, copy it to orders-db-enc-2-1 with --kms-key-id alias/orders-db, and restore orders-db-v2 from the encrypted copy. Cut over in the window, import the new instance into the module's state, then raise the pin."
    debrief:
      root_cause: |
        The pin in stage 1 only held production steady. An RDS instance can't
        be encrypted in place, so the real fix is a migration: an encrypted
        copy of a snapshot restored as a new instance, a planned cutover, the
        new instance adopted into the module's state with encryption on and
        prevent_destroy kept, and only then the pin raised to 2.1.0.
      ideal_path:
        - "Take a snapshot of orders-db."
        - "Copy it with a KMS key and check the copy is Encrypted and available."
        - "Restore a new instance from the encrypted copy."
        - "In the window: stop writes, catch up, cut over, import the new instance into the module's state (module.db.aws_db_instance.main), keep the old one until the checks pass, retire it, then raise the pin to 2.1.0 in a reviewed change."
