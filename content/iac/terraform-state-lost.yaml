command_notes:
  "aws s3api head-bucket --bucket acme-app-logs --region us-east-1": "Same answer with the region pinned: the bucket is in us-east-1, where the provider is configured."
  "aws iam get-role --role-name acme-task-role": "The task role exists, was created in 2024 and was used this morning. Terraform just has no record of it."
  "aws logs describe-log-groups --log-group-name-prefix /acme": "Both log groups exist with the retention the code sets, and they hold tens of GB of logs. Nothing was deleted."
  "aws s3api head-bucket --bucket acme-app-logs": "head-bucket succeeds only if the bucket exists and you can access it. It does, in this account, even though Terraform has no record of it."
  "aws sts get-caller-identity": "The account is 123456789012, the stack's account, so the CLI is not pointed somewhere else."
