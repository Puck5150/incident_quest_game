command_notes:
  "git log --oneline -3": "The top commit is the refactor. The ones before it are what main last applied."
  "git log --oneline": "The top commit is the refactor. The ones before it are what main last applied."
  "git diff main": "The VPC and both subnets are deleted from network.tf and appear unchanged in modules/network; the root gets a module call and the app's subnet_id now reads a module output. No value changes."
  "aws ec2 describe-subnets --filters Name=vpc-id,Values=vpc-0c5d8a2e6f1b47390": "Both subnets exist, available, with the ids state records. Nothing changed in AWS."
  "aws ec2 describe-subnets": "Both subnets exist, available, with the ids state records. Nothing changed in AWS."
  "aws ec2 describe-instances": "The app server and the Postgres host are running in those subnets, with the ids state records."
