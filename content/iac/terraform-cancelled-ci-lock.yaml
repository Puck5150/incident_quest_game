# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-cancelled-ci-lock
track: iac
difficulty: 2
title: "Nobody can run Terraform on ledger-infra"
par_minutes: 11

ticket:
  from: "Ledger team"
  severity: SEV4
  body: |
    PR #212 was supposed to give us the ledger network and the reconciler
    worker this morning, but there's no reconciler instance in the
    console. Since then the pipeline on ledger-infra has been red and
    nobody can run Terraform on it, not even a plan on a laptop: it
    complains about the state lock. I saved the PR #212 apply job's log
    in the repo as ci-pipeline.log. Dmitri says add -lock=false and push
    it through so we have the worker today. Can you sort it out? Repo is
    checked out in ~/ledger-infra.

environment: |
  ledger-infra builds the ledger team's VPC, a worker subnet and security
  group, and the reconciler worker instance, in account 123456789012,
  us-east-1. Nothing uses any of it yet. State is in S3
  (acme-terraform-state, key ledger/terraform.tfstate) with the DynamoDB
  lock table terraform-locks. The terraform-apply GitHub Actions workflow
  applies main on every merge, on the platform team's self-hosted runners
  (runner-01 to runner-20, service user ci). gh is logged in as you for
  acme/ledger-infra, and your default AWS profile is your own admin role
  in the account. It is 10:45 UTC.

terminal:
  prompt: "you@laptop:~/ledger-infra$"
