terraform:
  dir: "~/ledger-infra"
  files:
    - path: main.tf
      content: |
        terraform {
          backend "s3" {
            bucket         = "acme-terraform-state"
            key            = "ledger/terraform.tfstate"
            region         = "us-east-1"
            dynamodb_table = "terraform-locks"
          }

          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = "~> 5.0"
            }
          }
        }

        provider "aws" {
          region = "us-east-1"
        }
    - path: network.tf
      content: |
        resource "aws_vpc" "ledger" {
          cidr_block = "10.40.0.0/16"

          tags = {
            Name = "ledger"
          }
        }

        resource "aws_subnet" "workers" {
          vpc_id            = aws_vpc.ledger.id
          cidr_block        = "10.40.1.0/24"
          availability_zone = "us-east-1a"

          tags = {
            Name = "ledger-workers"
          }
        }

        resource "aws_security_group" "workers" {
          name        = "ledger-workers"
          description = "ledger worker hosts"
          vpc_id      = aws_vpc.ledger.id

          tags = {
            Name = "ledger-workers"
          }
        }
    - path: compute.tf
      content: |
        # Matches the day's card settlements against the bank files.
        resource "aws_instance" "reconciler" {
          instance_type = "t3.medium"
          ami           = "ami-05c8e2d71f9a3b640"
          subnet_id     = aws_subnet.workers.id

          tags = {
            Name = "ledger-reconciler"
          }
        }
  # What the cancelled run saved when the interrupt arrived: the network, not the instance.
  state:
    - type: aws_vpc
      name: ledger
      attrs:
        id: vpc-0e4b7a19c3d58f260
        arn: "arn:aws:ec2:us-east-1:123456789012:vpc/vpc-0e4b7a19c3d58f260"
        cidr_block: 10.40.0.0/16
        enable_dns_support: true
        enable_dns_hostnames: false
        default_security_group_id: sg-03a7d5e9b1c24f860
        tags: { Name: ledger }
        tags_all: { Name: ledger }
    - type: aws_security_group
      name: workers
      attrs:
        id: sg-0c91e5a7d3f4b8216
        arn: "arn:aws:ec2:us-east-1:123456789012:security-group/sg-0c91e5a7d3f4b8216"
        name: ledger-workers
        name_prefix: ""
        description: ledger worker hosts
        vpc_id: vpc-0e4b7a19c3d58f260
        ingress: []
        egress: []
        tags: { Name: ledger-workers }
        tags_all: { Name: ledger-workers }
    - type: aws_subnet
      name: workers
      attrs:
        id: subnet-0b6d2f8e41a7c9035
        arn: "arn:aws:ec2:us-east-1:123456789012:subnet/subnet-0b6d2f8e41a7c9035"
        vpc_id: vpc-0e4b7a19c3d58f260
        cidr_block: 10.40.1.0/24
        availability_zone: us-east-1a
        map_public_ip_on_launch: false
        tags: { Name: ledger-workers }
        tags_all: { Name: ledger-workers }
  # The S3 backend's DynamoDB lock, as the killed CI run left it (Terraform 1.9).
  lock:
    id: 4c2e8f17-9a3b-d605-7e1c-b28f5a0d93e4
    who: ci@runner-17
    operation: OperationTypeApply
    created: "2026-10-08 07:42:24.613205871 +0000 UTC"
    path: acme-terraform-state/ledger/terraform.tfstate
    info: ""
    message: "operation error DynamoDB: PutItem, https response error StatusCode: 400, RequestID: UJZDE8GXD6NCF10EPF91DHODZDOC9IS0J8HT9LGMXG9EDN581U33, ConditionalCheckFailedException: The conditional request failed"
  evidence:
    - evidence: ci-lock-error
      command: plan
      contains: "Error acquiring the state lock"
    - evidence: ci-lock-holder
      command: plan
      contains: "Who:       ci@runner-17"
    - evidence: ci-network-in-state
      command: state list
      contains: "aws_security_group.workers"
    - evidence: ci-partial-plan
      command: plan
      contains: "Plan: 1 to add, 0 to change, 0 to destroy."

hypotheses:
  - id: stale-lock-cancelled-run
    text: "The PR #212 apply job was cancelled partway through and exited without releasing the state lock; nothing holds it any more."
    correct: true
  - id: someone-applying-now
    text: "Someone is running terraform apply against ledger-infra right now; wait for them to finish."
    feedback: "The lock belongs to ci@runner-17 and was taken at 07:42:24 UTC, three hours ago: that's the PR #212 job, whose log ends with Terraform exiting on a second interrupt and the job cancelled. gh run list shows no run queued or in progress. Nobody is applying; the lock outlived the process that took it."
  - id: corrupt-state
    text: "The state file in S3 is corrupt, so Terraform can't read it."
    feedback: "terraform state list and state show read the state fine: the VPC, subnet and security group are all there. The error is about acquiring the lock, which Terraform does before it writes, not about the state's content."
  - id: backend-credentials
    text: "Your AWS credentials can't reach the state backend."
    feedback: "Terraform read the lock's details (ID, Who, Created) out of DynamoDB to show them to you, and the error is ConditionalCheckFailedException: the write was refused because a lock item already exists, not because you can't reach the table."

actions:
  - id: unlock-and-finish
    label: "Confirm the CI job is dead, terraform force-unlock the lock ID from the error, review the plan, then apply what's left"
    kind: fix
    done_when:
      all:
        - lock_free: true
        - state_has: aws_instance.reconciler
        - plan_clean: true
        - not: { applied: { op: create, address: aws_instance.reconciler, lock_bypassed: true } }
        - not: { applied: { op: delete, address: aws_vpc.ledger } }
        - not: { applied: { op: delete, address: aws_subnet.workers } }
        - not: { applied: { op: delete, address: aws_security_group.workers } }
    feedback: "The stale lock is gone, the plan showed only the reconciler left to create, and the apply took a fresh lock of its own and released it at the end. The network from the cancelled run was kept."
  - id: apply-without-lock
    label: "Push it through: terraform apply -lock=false while the CI lock is still held"
    kind: destructive
    done_when:
      any:
        - applied: { op: create, address: aws_instance.reconciler, lock_bypassed: true }
        - applied: { op: delete, address: aws_vpc.ledger, lock_bypassed: true }
        - applied: { op: delete, address: aws_subnet.workers, lock_bypassed: true }
        - applied: { op: delete, address: aws_security_group.workers, lock_bypassed: true }
    feedback: "That wrote the state with no lock at all, and the stale lock is still there blocking everyone else. It happened to be safe only because the CI job was dead, which you hadn't established: if that run had still been going, two applies would have written the same state and one would have lost the other's changes. -lock=false doesn't remove a lock; it ignores every lock, including a live one."
  - id: wait-for-lock-timeout
    label: "Re-run with -lock-timeout=30m so Terraform waits for the lock to be released"
    kind: wrong
    feedback: "-lock-timeout makes Terraform retry for that long when a live run is about to finish. This lock belongs to a process that no longer exists: nothing will ever release it, so the plan just fails 30 minutes later."
  - id: rebuild-state
    label: "Delete the state file from S3 and import everything again to get a clean state"
    kind: wrong
    feedback: "The state is fine: state list reads it. The lock is a separate item in the DynamoDB table, so deleting the state doesn't touch it, and Terraform would lose track of the VPC, subnet and security group until you imported each one back."

solution_paths:
  - [unlock-and-finish]

key_evidence: [ci-lock-holder, ci-run-dead, ci-partial-plan]

evidence_labels:
  ci-lock-holder: "The lock was taken by ci@runner-17 at 07:42:24 UTC for an apply"
  ci-run-dead: "The PR #212 job was cancelled and Terraform exited; no run is in progress"
  ci-partial-plan: "After the unlock, only the reconciler is left to create"

hints:
  nudge: "The error tells you who holds the lock and since when. Is that someone still working?"
  direction: "Read the Lock Info (Who, Created, Operation), then the PR #212 job: ci-pipeline.log and gh run list. A lock whose process is gone has to be removed by hand; then look at what the run left before applying."
  answer: "The cancelled PR #212 job (ci@runner-17, 07:42 UTC) died without unlocking; gh run list shows nothing running. terraform force-unlock 4c2e8f17-9a3b-d605-7e1c-b28f5a0d93e4, answer yes, terraform plan (1 to add: the reconciler), then terraform apply."

analogy:
  title: "The meeting room booking"
  text: |
    The room screen says "Booked: Finance sync, 07:40 to 08:30" and it's
    nearly eleven. You don't barge in through the door, and you don't
    book it on top of the old booking either. You look through the glass:
    the room is empty, the meeting ended hours ago and the booking was
    never released. You cancel the stale booking, check what was left on
    the whiteboard, and then book the room properly for yourself.

debrief:
  root_cause: |
    The PR #212 job was cancelled while terraform apply was creating the
    reconciler. GitHub Actions sends SIGINT on cancel and SIGTERM 7.5
    seconds later; Terraform treats both as interrupts. On the first it
    saved the state (the VPC, subnet and security group it had finished)
    and started shutting down; on the second it exited immediately, before
    it had released the lock. The S3 backend's lock is an item in the
    DynamoDB table terraform-locks, and Terraform takes it with a
    conditional write (only if no lock item exists), so every later plan
    and apply, in CI and on laptops, got ConditionalCheckFailedException
    and printed the lock's details: ci@runner-17, OperationTypeApply,
    07:42:24 UTC. Nothing would ever release it.
  ideal_path:
    - "terraform plan: Error acquiring the state lock. Read the Lock Info: Who ci@runner-17, Operation OperationTypeApply, Created 07:42:24 UTC, three hours ago."
    - "ci-pipeline.log: the PR #212 job on runner-17 created the network, started the instance, then \"Interrupt received\", \"Two interrupts received. Exiting immediately\" and The operation was canceled."
    - "gh run list (and gh run view 11823046571): the run was cancelled, later runs failed on the lock, and none is queued or in progress. The holder is dead."
    - "terraform force-unlock 4c2e8f17-9a3b-d605-7e1c-b28f5a0d93e4 and answer yes."
    - "terraform plan: 1 to add, the reconciler. The network is in state and needs nothing. Because the run died mid-create, check there's no unrecorded reconciler instance (aws ec2 describe-instances: none)."
    - "terraform apply: Resources: 1 added. The plan is clean and the next pipeline run passes."
  real_world: |
    A lock left by a dead process is normal after a cancelled or killed
    run, and force-unlock exists for it, but only once you know the
    holder is gone: Who and Created tell you which machine and when, and
    the CI system tells you whether that job is still running. Never use
    -lock=false to get past it: it doesn't remove the lock, it skips
    locking entirely, so if the holder were alive two runs would write the
    same state. -lock-timeout is for the other case, a live run about to
    finish. After unlocking, read the plan before applying: Terraform does
    not roll back, and a run killed mid-create can leave an object in the
    cloud that never reached state; applying blind would create a second
    one. In CI, prefer a workflow that isn't cancelled mid-apply (no
    cancel-in-progress on apply jobs) and send a single interrupt if you
    must stop it. Newer Terraform versions (1.10 and later) can lock with
    a lock file in the S3 bucket itself (use_lockfile) instead of
    DynamoDB; the lock error and force-unlock work the same way.

concepts:
  - term: "State locking"
    text: "Terraform locks the state for every operation that could write it, so two runs can't write it at once. Disabling it with -lock=false is not recommended."
    url: "https://developer.hashicorp.com/terraform/language/state/locking"
  - term: "terraform force-unlock"
    text: "Removes a lock that automatic unlocking failed to release, given its ID from the lock error. It changes no infrastructure; -force skips the question."
    url: "https://developer.hashicorp.com/terraform/cli/commands/force-unlock"
  - term: "S3 backend DynamoDB locking"
    text: "With dynamodb_table set, the lock is an item keyed by bucket/key in a table with a LockID string partition key. Newer versions also offer use_lockfile."
    url: "https://developer.hashicorp.com/terraform/language/backend/s3"
  - term: "Workflow cancellation"
    text: "When a GitHub Actions run is cancelled the runner sends SIGINT, then SIGTERM after 7.5 seconds, then kills the process tree."
    url: "https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-cancellation"

