command_notes:
  "cat ci-pipeline.log": "The PR #212 job, saved from GitHub. runner-17 created the VPC, security group and subnet, started the reconciler, then got the cancel: \"Interrupt received\", and 7.5 seconds later \"Two interrupts received. Exiting immediately\". Terraform never got to release its lock."
  "less ci-pipeline.log": "The PR #212 job, saved from GitHub (this terminal prints it whole). The end is what matters: the two interrupts and The operation was canceled."
  "more ci-pipeline.log": "The PR #212 job, saved from GitHub (this terminal prints it whole). The end is what matters: the two interrupts and The operation was canceled."
  "tail ci-pipeline.log": "The end of the job: the interrupts and The operation was canceled. The run is over; nothing is left running on its behalf."
  "grep -i interrupt ci-pipeline.log": "Both interrupts: the first started a graceful shutdown, the second (SIGTERM, 7.5 seconds later) made Terraform exit immediately."
  "gh run list": "No run is queued or in progress (that would show *). The PR #212 run is the one that took the lock; the two after it failed on that lock."
  "gh run list --status in_progress": "Nothing is running the workflow right now."
  "gh run view 11823046571": "The PR #212 run: cancelled by @dmitri-k, not failed. Its only job ran for 48s and finished."
  "gh run view 11823519084": "The next run after the cancel: it failed in the apply step, on the state lock left behind."
  "aws ec2 describe-instances --filters Name=tag:Name,Values=ledger-reconciler": "No reconciler exists, and there are no instances in the account at all: the interrupted create never made one, so the plan's 1 to add is right."
  "aws ec2 describe-instances --filters Name=tag:Name,Values=ledger-reconciler --query 'Reservations[].Instances[].InstanceId'": "No instance IDs: nothing was left behind by the killed run."
