# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-sg-cycle
track: iac
difficulty: 2
title: "The callbacks PR won't even plan"
par_minutes: 10

ticket:
  from: "Checkout team"
  severity: SEV4
  body: |
    PR #318 on checkout-infra opens the firewall for the new order-status
    callbacks (app tier calling back into the web tier on 8443) and, while
    we were at it, tightens the web-to-app API rule. CI's terraform plan
    fails on it before it prints any plan at all; main plans fine. Tomás
    reckons it's a bug in the AWS provider and wants to bump it. The
    callbacks need to be open by Thursday's release. Branch is checked out in ~/checkout-infra.

environment: |
  checkout-infra builds the checkout VPC with a web subnet (10.60.1.0/24)
  and an app subnet (10.60.11.0/24) in us-east-1a, and one security group
  per tier, in account 123456789012, us-east-1. The web and app instances
  run in those subnets and use the groups, but the checkout team's deploy
  tooling launches them, not this repo. State is in S3
  (acme-terraform-state, key checkout/terraform.tfstate). main is what's
  applied today. Your default AWS profile is your own admin role in the
  account.

