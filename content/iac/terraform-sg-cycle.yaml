command_notes:
  "git diff main": "PR #318 against what's applied: web gets a new 8443 rule whose source is aws_security_group.app.id, and app's 8080 rule switches from the web subnet's CIDR to aws_security_group.web.id. Each group now reads the other's id."
  "gh pr diff 318 --name-only": "PR #318 changes one file, security.tf."
  "git diff main --stat": "Only security.tf changed; the network is untouched."
  "git diff main -- network.tf": "Nothing: the PR doesn't touch the network."
  "git diff": "Nothing uncommitted: the PR's changes are already committed on the branch, so compare with main instead."
  "aws ec2 describe-security-groups --group-ids sg-0a4d7e21c9b3f5068": "The web group as AWS has it: 443 from anywhere, nothing on 8443 yet."
  "aws ec2 describe-security-groups --group-ids sg-07c3e9a1d5b2f4e86": "The app group as AWS has it: 8080 from the web subnet's CIDR, main's rule."
  "git status": "You're on the PR's branch, callbacks-8443, with nothing uncommitted."
  "git branch": "The PR's branch, callbacks-8443, and main."
  "git log --oneline -3": "The PR's single commit on top of main's two."
  "aws ec2 describe-security-groups --group-ids sg-0a4d7e21c9b3f5068 sg-07c3e9a1d5b2f4e86": "Both groups exist with main's rules: web allows 443 from anywhere, app allows 8080 from the web subnet's CIDR. Nothing from the PR has reached AWS."
