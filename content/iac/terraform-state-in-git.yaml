# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-state-in-git
track: iac
difficulty: 2
title: "The security scanner found our database password in the repository"
par_minutes: 10

ticket:
  from: "Security team"
  severity: SEV2
  body: |
    Our secret scanner flagged a PostgreSQL master password in the
    analytics-infra repository, in a file called terraform.tfstate. The
    repository is readable by all 300 engineers. Nobody ever typed that
    password into a commit.

environment: |
  analytics-infra was started by one engineer with local state (no backend
  configured), and the state file was committed so others could run
  Terraform. The RDS master password is generated with random_password and
  passed to aws_db_instance. Other infra repos use an S3 backend with
  encryption and restricted access.

terminal:
  prompt: "you@laptop:~/analytics-infra$"
  commands:
    - match: "git ls-files | grep tfstate"
      evidence: state-tracked
      output: |
        terraform.tfstate
        terraform.tfstate.backup
    - match: "git log --oneline -- terraform.tfstate | tail -1"
      output: |
        4e1a0c7 add state so others can run terraform

terraform:
  dir: "~/analytics-infra"
  version: 1.11.0
  state_file: true
  files:
    - path: .gitignore
      content: |
        .terraform/
    - path: main.tf
      content: |
        terraform {
          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = "~> 5.0"
            }
            random = {
              source  = "hashicorp/random"
              version = "~> 3.6"
            }
          }
        }

        provider "aws" {
          region = "us-east-1"
        }
    - path: db.tf
      content: |
        resource "random_password" "db" {
          length = 32
        }

        resource "aws_db_instance" "analytics" {
          identifier     = "analytics-db"
          engine         = "postgres"
          instance_class = "db.t3.medium"
          username       = "analytics"
          password       = random_password.db.result
        }
    - path: .terraform.lock.hcl
      content: |
        # This file is maintained automatically by "terraform init".
        # Manual edits may be lost in future updates.

        provider "registry.terraform.io/hashicorp/aws" {
          version     = "5.67.0"
          constraints = "~> 5.0"
          hashes = [
            "h1:Zq0uB8Zc1nS5eYpR3m7KpTz2W0k6YV3d8J4bN1xQwLs=",
          ]
        }

        provider "registry.terraform.io/hashicorp/random" {
          version     = "3.6.3"
          constraints = "~> 3.6"
          hashes = [
            "h1:PTJACYWeOP2dakMHvuoPf6Ka66czLFi3bxQsNztcFy0=",
          ]
        }
  state:
    - type: random_password
      name: db
      attrs:
        id: none
        length: 32
        special: true
        upper: true
        lower: true
        numeric: true
        result: "Zk3#fB9mWq2$xT7pLd4&Hn8Vc1^Ys6Ae"
    - type: aws_db_instance
      name: analytics
      attrs:
        id: db-ANALYTICS7K2M
        arn: "arn:aws:rds:us-east-1:123456789012:db:analytics-db"
        identifier: analytics-db
        engine: postgres
        engine_version: "16.3"
        instance_class: db.t3.medium
        allocated_storage: 100
        storage_encrypted: true
        kms_key_id: ""
        db_name: ""
        username: analytics
        password: "Zk3#fB9mWq2$xT7pLd4&Hn8Vc1^Ys6Ae"
        multi_az: false
        skip_final_snapshot: false
        endpoint: "analytics-db.cxyz.us-east-1.rds.amazonaws.com:5432"
        tags: {}
        tags_all: {}
  evidence:
    - evidence: password-in-state
      command: state pull
      contains: '"result"'

files:
  - path: "main.tf and db.tf (no backend block)"
    language: hcl
    evidence: no-backend
    content: |
      terraform {
        required_providers { ... }
        # no backend block: state is the local file terraform.tfstate
      }

      resource "random_password" "db" {
        length = 32
      }

      resource "aws_db_instance" "analytics" {
        identifier = "analytics-db"
        password   = random_password.db.result
        # ...
      }

hypotheses:
  - id: state-plaintext
    text: "Terraform state records every resource's attributes, including the generated password, in plain text. The state file is committed to git, so the password is in the repository and its history."
    correct: true
  - id: someone-committed
    text: "Someone pasted the password into a file."
    feedback: "The password was generated by random_password and never typed. It's in terraform.tfstate because state stores resource attributes, including secrets."
  - id: sensitive-flag
    text: "Marking the value sensitive would have kept it out."
    feedback: "sensitive hides values in plan and apply output, but they're still stored in state in plain text."
  - id: scanner-wrong
    text: "It's a false positive."
    feedback: "grep finds the password attribute in the state file, which is tracked in git."

actions:
  - id: remote-backend
    label: "Move state to an S3 backend (encrypt = true, locking, on a bucket with versioning, a bucket policy and public access block limiting it to the pipeline and the engineers who run Terraform): declare it, run terraform init and answer yes to copy the state, delete the leftover terraform.tfstate.backup, add the state files to .gitignore and git rm --cached them"
    kind: fix
    done_when:
      all:
        - backend: { type: s3, require: { bucket: '*', key: '*', encrypt: true }, any_of: [{ use_lockfile: true }, { dynamodb_table: '*' }] }
        - plan_clean: true
        - state_has: random_password.db
        - state_has: aws_db_instance.analytics
        - not: { applied: { op: delete, address: aws_db_instance.analytics } }
        - file_contains: { path: /home/you/analytics-infra/.gitignore, matches: '^[ \t]*/?(\*\.tfstate(\*|\.\*)?|terraform\.tfstate(\*)?)[ \t]*$' }
        - file_contains: { path: /home/you/analytics-infra/.gitignore, matches: '^[ \t]*/?(\*\.tfstate\.\*|\*\.tfstate\*|\*\.tfstate\.backup|terraform\.tfstate\*|terraform\.tfstate\.backup|\*\.backup)[ \t]*$' }
        - not: { file_contains: { path: /home/you/analytics-infra/terraform.tfstate, matches: '"result"' } }
        - not: { file_contains: { path: /home/you/analytics-infra/terraform.tfstate.backup, matches: '"result"' } }
    feedback: "State now lives where only the people and pipelines who run Terraform can read it, encrypted at rest and locked; init copied it, so the plan is clean and the same database is still tracked. The local terraform.tfstate was emptied and you removed the terraform.tfstate.backup the migration leaves behind, which still held every secret in plain text. The files are out of the working tree and ignored; running git rm --cached on them (the lab cannot check git) is what stops the repository tracking them at its tip. The history still has the old password, and so do any laptops that cloned it: that is what rotating is for."
  - id: rotate
    label: "Rotate the database password (replace random_password.db; in a real account, consider manage_master_user_password so the password lives in Secrets Manager and out of state, which this lab does not model), have security purge the file from git history and every clone, and review the database's login logs and the repo's clone history for use of the old password"
    kind: fix
    after: [remote-backend]
    done_when:
      all:
        - applied: { op: create, address: random_password.db }
        - not: { applied: { op: delete, address: aws_db_instance.analytics } }
        - reality_has: { type: aws_db_instance, id: db-ANALYTICS7K2M, attr: identifier, equals: analytics-db }
        - not: { reality_has: { type: aws_db_instance, id: db-ANALYTICS7K2M, attr: password, equals: "Zk3#fB9mWq2$xT7pLd4&Hn8Vc1^Ys6Ae" } }
    feedback: "The leaked password no longer works (apply -replace=random_password.db generated a new one and updated the database in place), the history cleanup limits further copies, and the login and clone review tells you whether it was used. Assume anyone with repo access may have seen it: rewriting history alone would not make the old password safe again. A new random_password would still be written to state, now encrypted and access-controlled; a managed master password keeps it out of state altogether."
  - id: gitignore-only
    label: "Add terraform.tfstate to .gitignore"
    kind: wrong
    feedback: "The file is already tracked, so .gitignore doesn't affect it, the password stays in every past commit and the state is still a local file nobody else can lock. Nothing was migrated and nothing rotated."
  - id: make-private
    label: "Restrict the repository to the data team"
    kind: wrong
    feedback: "Fewer people can read it from now on, but 300 engineers could read it until today, and state still lives in git."

solution_paths:
  - [remote-backend, rotate]

key_evidence: [password-in-state, state-tracked, no-backend]

evidence_labels:
  password-in-state: "terraform.tfstate contains the password attribute"
  state-tracked: "The state file and its backup are committed to git"
  no-backend: "No backend is configured, so state is a local file"

hints:
  nudge: "Nobody typed the password. Which file holds every resource's attributes?"
  direction: "Check what git tracks, whether a backend is configured, and what state stores. Editing a backend block does nothing until terraform init has run, and init leaves a copy behind."
  answer: "State stores the generated password in plain text and was committed. Move to the S3 backend with encryption, locking, versioning and a restrictive bucket policy, run terraform init and answer yes to copy the state (it leaves terraform.tfstate.backup holding every secret: delete it), stop tracking state with .gitignore and git rm --cached, rotate the password (in a real account a managed master password also keeps it out of state), purge the history and check the database logs for use of the old one."

analogy:
  title: "The inventory list that includes the safe's combination"
  text: |
    The team's inventory notebook lists every item in the building with all
    its details, including the safe's combination. Someone photocopied the
    notebook for the whole office so everyone could keep it up to date.
    Keep the notebook in a locked cabinet, and change the combination.

debrief:
  root_cause: |
    Terraform state records every managed resource's attributes, and secrets
    such as a generated password are stored in it in plain text. The repo
    had no backend, so state was a local file, and it had been committed so
    others could run Terraform. That put the database password in git,
    readable by everyone with access to the repository, and in its history.
  ideal_path:
    - "Confirm the password is in terraform.tfstate."
    - "See that state is a tracked file with no backend configured."
    - "Move state to the S3 backend with encryption, locking, versioning and a restrictive bucket policy (terraform init, answer yes to copy), delete the terraform.tfstate.backup the migration leaves behind, and stop tracking state (.gitignore and git rm --cached)."
    - "Rotate the password (a managed master password keeps it out of state), purge the file from history and clones, and check the database logs and clone history for use of the old password."
  real_world: |
    Never commit state. Use a remote backend with encryption and access
    control from the first apply, and treat state as a secret. Where possible,
    keep secrets out of state entirely (for example, managed master
    passwords in Secrets Manager).

concepts:
  - term: "Terraform state"
    text: "Terraform's record of managed resources and their attributes, including sensitive values, stored in plain text."
    url: "https://developer.hashicorp.com/terraform/language/state/sensitive-data"
  - term: "Backend"
    text: "Where Terraform keeps state: a local file by default, or remote storage such as S3, which can be encrypted and access-controlled."
    url: "https://developer.hashicorp.com/terraform/language/backend"

sources:
  - title: "Terraform: Sensitive data in state"
    url: "https://developer.hashicorp.com/terraform/language/state/sensitive-data"
    retrieved: 2026-10-02
  - title: "Terraform: Backend configuration"
    url: "https://developer.hashicorp.com/terraform/language/backend"
    retrieved: 2026-10-02
  - title: "Terraform: S3 backend (encryption, locking)"
    url: "https://developer.hashicorp.com/terraform/language/backend/s3"
    retrieved: 2026-10-02
