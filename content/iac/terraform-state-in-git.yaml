# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-state-in-git
track: iac
difficulty: 2
title: "The security scanner found our database password in the repository"
par_minutes: 10

ticket:
  from: "Security team"
  priority: P1
  body: |
    Our secret scanner flagged a PostgreSQL master password in the
    analytics-infra repository, in a file called terraform.tfstate. The
    repository is readable by all 300 engineers. Nobody ever typed that
    password into a commit.

environment: |
  analytics-infra was started by one engineer with local state (no backend
  configured), and the state file was committed so others could run
  Terraform. The RDS master password is generated with random_password and
  passed to aws_db_instance. Other infra repos use an S3 backend with
  encryption and restricted access.

terminal:
  prompt: "you@laptop:~/analytics-infra$"
  commands:
    - match: "git ls-files | grep tfstate"
      when_actions: [remote-backend]
      output: ""
    - match: "git ls-files | grep tfstate"
      evidence: state-tracked
      output: |
        terraform.tfstate
        terraform.tfstate.backup
    - match: "grep -c '\"password\"' terraform.tfstate"
      evidence: password-in-state
      output: |
        2
    - match: "cat backend.tf"
      when_actions: [remote-backend]
      output: |
        terraform {
          backend "s3" {
            bucket       = "acme-tfstate"
            key          = "analytics-infra/terraform.tfstate"
            region       = "us-east-1"
            encrypt      = true
            use_lockfile = true
          }
        }
    - match: "cat backend.tf"
      evidence: no-backend
      output: |
        cat: backend.tf: No such file or directory
    - match: "git log --oneline -- terraform.tfstate | tail -1"
      output: |
        4e1a0c7 add state so others can run terraform

files:
  - path: "db.tf (excerpt)"
    content: |
      resource "random_password" "db" {
        length  = 32
        special = true
      }

      resource "aws_db_instance" "analytics" {
        identifier = "analytics"
        password   = random_password.db.result
        # ...
      }

hypotheses:
  - id: state-plaintext
    text: "Terraform state records every resource's attributes, including the generated password, in plain text. The state file is committed to git, so the password is in the repository and its history."
    correct: true
  - id: someone-committed
    text: "Someone pasted the password into a file."
    feedback: "The password was generated by random_password and never typed. It's in terraform.tfstate because state stores resource attributes, including secrets."
  - id: sensitive-flag
    text: "Marking the value sensitive would have kept it out."
    feedback: "sensitive hides values in plan and apply output, but they're still stored in state in plain text."
  - id: scanner-wrong
    text: "It's a false positive."
    feedback: "grep finds the password attribute in the state file, which is tracked in git."

actions:
  - id: remote-backend
    label: "Move state to the encrypted, access-controlled S3 backend (terraform init -migrate-state), remove terraform.tfstate* from git and add them to .gitignore"
    kind: fix
    feedback: "State now lives where only the people and pipelines who run Terraform can read it, encrypted at rest. The file is gone from the tip of the repository; its history still has the old password."
  - id: rotate
    label: "Rotate the database password (replace random_password.db) and have security purge the file from git history"
    kind: fix
    feedback: "The leaked password no longer works, and the history cleanup limits further copies. Assume anyone with repo access may have seen it."
  - id: gitignore-only
    label: "Add terraform.tfstate to .gitignore"
    kind: wrong
    feedback: "The file is already tracked, so .gitignore doesn't affect it, and the password stays in every past commit."
  - id: make-private
    label: "Restrict the repository to the data team"
    kind: wrong
    feedback: "Fewer people can read it from now on, but 300 engineers could read it until today, and state still lives in git."

solution_paths:
  - [remote-backend, rotate]

key_evidence: [password-in-state, state-tracked, no-backend]

evidence_labels:
  password-in-state: "terraform.tfstate contains the password attribute"
  state-tracked: "The state file and its backup are committed to git"
  no-backend: "No backend is configured, so state is a local file"

hints:
  nudge: "Nobody typed the password. Which file holds every resource's attributes?"
  direction: "Check what git tracks, whether a backend is configured, and what state stores."
  answer: "State stores the generated password in plain text and was committed. Move to the encrypted S3 backend, stop tracking state, and rotate the password."

analogy:
  title: "The inventory list that includes the safe's combination"
  text: |
    The team's inventory notebook lists every item in the building with all
    its details, including the safe's combination. Someone photocopied the
    notebook for the whole office so everyone could keep it up to date.
    Keep the notebook in a locked cabinet, and change the combination.

debrief:
  root_cause: |
    Terraform state records every managed resource's attributes, and secrets
    such as a generated password are stored in it in plain text. The repo
    had no backend, so state was a local file, and it had been committed so
    others could run Terraform. That put the database password in git,
    readable by everyone with access to the repository, and in its history.
  ideal_path:
    - "Confirm the password is in terraform.tfstate."
    - "See that state is a tracked file with no backend configured."
    - "Move state to the encrypted, restricted S3 backend and stop tracking it."
    - "Rotate the password, and purge the file from history."
  real_world: |
    Never commit state. Use a remote backend with encryption and access
    control from the first apply, and treat state as a secret. Where possible,
    keep secrets out of state entirely (for example, managed master
    passwords in Secrets Manager).

concepts:
  - term: "Terraform state"
    text: "Terraform's record of managed resources and their attributes, including sensitive values, stored in plain text."
    url: "https://developer.hashicorp.com/terraform/language/state/sensitive-data"
  - term: "Backend"
    text: "Where Terraform keeps state: a local file by default, or remote storage such as S3, which can be encrypted and access-controlled."
    url: "https://developer.hashicorp.com/terraform/language/backend"

sources:
  - title: "Terraform: Sensitive data in state"
    url: "https://developer.hashicorp.com/terraform/language/state/sensitive-data"
    retrieved: 2026-10-02
  - title: "Terraform: Backend configuration"
    url: "https://developer.hashicorp.com/terraform/language/backend"
    retrieved: 2026-10-02
  - title: "Terraform: S3 backend (encryption, locking)"
    url: "https://developer.hashicorp.com/terraform/language/backend/s3"
    retrieved: 2026-10-02
