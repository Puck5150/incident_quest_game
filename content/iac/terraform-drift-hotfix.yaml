# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-drift-hotfix
track: iac
difficulty: 2
title: "Tonight's routine apply wants to undo last night's emergency fix"
par_minutes: 10

ticket:
  from: "Platform team"
  severity: SEV3
  body: |
    The plan for tonight's routine change (a new tag) also wants to "update
    in-place" the payments security group, removing a rule. Nobody changed
    that in code. Should we just apply? Someone mentioned an incident last
    night.

environment: |
  All networking for the payments service is managed by Terraform in the
  infra repo. Last night during an outage, on-call opened TCP 8443 from the
  partner's new address range (198.51.100.0/24) directly in the AWS console.

terminal:
  prompt: "you@laptop:~/infra$"
  commands:
    - match: "git log --oneline -3"
      output: |
        c3f81a7 payments: tag the worker with its cost center
        9be40d2 payments: security group and worker
        51d7e08 infra: provider pin

terraform:
  dir: "~/infra"
  files:
    - path: main.tf
      content: |
        terraform {
          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = "~> 5.0"
            }
          }
        }

        provider "aws" {
          region = "us-east-1"
        }

        resource "aws_security_group" "payments" {
          name        = "payments"
          description = "Payments service"
          vpc_id      = "vpc-0payments"

          ingress {
            description = "internal clients"
            from_port   = 443
            to_port     = 443
            protocol    = "tcp"
            cidr_blocks = ["10.20.0.0/16"]
          }
        }

        resource "aws_instance" "payments_worker" {
          ami           = "ami-0abc1234def567890"
          instance_type = "t3.small"

          tags = {
            cost-center = "payments"
          }
        }
  state:
    - type: aws_security_group
      name: payments
      attrs:
        id: sg-0payments
        arn: "arn:aws:ec2:us-east-1:123456789012:security-group/sg-0payments"
        name: payments
        description: "Payments service"
        vpc_id: vpc-0payments
        ingress: [{ cidr_blocks: ["10.20.0.0/16"], description: "internal clients", from_port: 443, protocol: tcp, to_port: 443 }]
        egress: []
        tags_all: {}
    - type: aws_instance
      name: payments_worker
      attrs:
        id: i-0payments
        arn: "arn:aws:ec2:us-east-1:123456789012:instance/i-0payments"
        ami: ami-0abc1234def567890
        instance_type: t3.small
        tags: {}
        tags_all: {}
  cloud:
    patch:
      - type: aws_security_group
        id: sg-0payments
        set:
          ingress: [{ cidr_blocks: ["10.20.0.0/16"], description: "internal clients", from_port: 443, protocol: tcp, to_port: 443 }, { cidr_blocks: ["198.51.100.0/24"], description: "partner hotfix", from_port: 8443, protocol: tcp, to_port: 8443 }]
  evidence:
    - evidence: plan-removes-rule
      command: plan
      contains: "ingress"
    - evidence: drift
      command: plan
      contains: "has changed"

logs:
  - name: "#incidents (last night)"
    evidence: hotfix-note
    lines: |
      23:48 on-call: partner moved to 198.51.100.0/24, their callbacks are failing
      23:52 on-call: opened 8443 from 198.51.100.0/24 on sg-0payments in the console, callbacks OK. Will codify tomorrow.
      23:53 on-call: used the whole /24 because I did not have their exact callback addresses. Needs checking with the partner and narrowing.

files:
  - path: "Partner onboarding ticket SEC-4417 (excerpt)"
    evidence: partner-range
    content: |
      Callbacks to payments (TCP 8443) come only from the partner's two NAT
      gateways: 198.51.100.17 and 198.51.100.18 (198.51.100.16/28). The rest
      of 198.51.100.0/24 belongs to other customers of their hosting provider.
      Any change to the allowed range needs their confirmation and a security
      review of the pull request.

hypotheses:
  - id: drift
    text: "Last night's console change isn't in the code, so Terraform sees it as drift and plans to remove it. Applying as-is would break the partner's callbacks again."
    correct: true
  - id: bug
    text: "Terraform has a bug and is planning a change that isn't needed."
    feedback: "Terraform is doing exactly its job: make the real resource match the code. The code doesn't have the rule; the real security group does."
  - id: tag-side-effect
    text: "Adding the tag forces the security group to be updated."
    feedback: "The tag goes on the instance. The security group change is a separate entry, removing an ingress rule nobody added in code."
  - id: state-corrupt
    text: "The state file is corrupt."
    feedback: "A refresh-only plan shows exactly what changed outside Terraform: one new ingress rule, matching last night's console change."

actions:
  - id: codify
    label: "Put the rule in code through a reviewed PR, narrowed to the partner's verified callback range 198.51.100.16/28 on 8443 and nothing else added, and apply, so the group matches the code and the plan stops removing it"
    kind: fix
    done_when:
      all:
        - state_has: aws_security_group.payments
        - sg_rule: { group_id: sg-0payments, direction: ingress, port: 443, exact: true, cidr: 10.20.0.0/16 }
        - sg_rule: { group_id: sg-0payments, direction: ingress, port: 8443, exact: true, cidr: 198.51.100.16/28 }
        - sg_only: { group_id: sg-0payments, direction: ingress, cidrs: [10.20.0.0/16, 198.51.100.16/28] }
        - not: { config_matches: { dir: /home/you/infra, matches: 'ignore_changes' } }
        - plan_has: { no_change: [aws_security_group.payments] }
    feedback: "The code, the state and the group now agree on the narrowest range the partner's own ticket supports for the callbacks: TCP 8443 from 198.51.100.16/28, not the whole /24 the console fix opened, and the group has no other source on any port. Callbacks keep working, the plan shows only the tag, and the change went through review instead of staying a console one-off."
  - id: codify-nat
    label: "Put the rule in code through a reviewed PR, narrowed to the partner's two NAT gateways 198.51.100.17/32 and 198.51.100.18/32 on 8443 and nothing else added, and apply"
    kind: fix
    done_when:
      all:
        - state_has: aws_security_group.payments
        - sg_rule: { group_id: sg-0payments, direction: ingress, port: 443, exact: true, cidr: 10.20.0.0/16 }
        - sg_rule: { group_id: sg-0payments, direction: ingress, port: 8443, exact: true, cidr: 198.51.100.17/32 }
        - sg_rule: { group_id: sg-0payments, direction: ingress, port: 8443, exact: true, cidr: 198.51.100.18/32 }
        - sg_only: { group_id: sg-0payments, direction: ingress, cidrs: [10.20.0.0/16, 198.51.100.17/32, 198.51.100.18/32] }
        - not: { config_matches: { dir: /home/you/infra, matches: 'ignore_changes' } }
        - plan_has: { no_change: [aws_security_group.payments] }
    feedback: "Even tighter: only the two gateway addresses the partner's ticket names can reach 8443, and nothing else was added to the group. The cost is that a change on their side (a third gateway) needs another reviewed change, which is the point of least privilege."
  - id: codify-wide
    label: "Codify the console rule as it is (198.51.100.0/24 on 8443), or with the /28 plus a wider or extra source, so the plan stops removing it"
    kind: wrong
    done_when:
      all:
        - state_has: aws_security_group.payments
        - sg_rule: { group_id: sg-0payments, direction: ingress, port: 8443 }
        - not: { sg_only: { group_id: sg-0payments, direction: ingress, port: 8443, cidrs: [198.51.100.16/28, 198.51.100.17/32, 198.51.100.18/32] } }
        - not: { config_matches: { dir: /home/you/infra, matches: 'ignore_changes' } }
        - plan_has: { no_change: [aws_security_group.payments] }
    feedback: "The plan goes quiet, but 8443 is now open to more than the partner needs. On-call used the whole /24 as a guess because they did not have the exact addresses; the partner's ticket (SEC-4417) says callbacks come only from 198.51.100.16/28 (the NAT gateways .17 and .18), and the rest of the /24 belongs to other customers of their provider. Codifying drift means verifying it first: confirm the source with the partner, narrow it, add nothing else, and put it through review."
  - id: apply-anyway
    label: "Apply the plan as it is"
    kind: destructive
    done_when:
      all:
        - applied: { op: update, address: aws_security_group.payments }
        - not: { sg_rule: { group_id: sg-0payments, direction: ingress, port: 8443 } }
    feedback: "Terraform removes the rule, and the partner's callbacks fail again, recreating last night's outage."
  - id: target-instance
    label: "Apply with -target=aws_instance.payments_worker to skip the security group"
    kind: wrong
    feedback: "Tonight's change goes out, and the drift is still waiting for the next untargeted apply to undo the fix. -target is for exceptions, not for avoiding drift."
  - id: refresh-apply
    label: "Run terraform apply -refresh-only to accept the drift into state"
    kind: wrong
    feedback: "State would record the rule, but the code still doesn't have it, so the very next plan wants to remove it again."

solution_paths:
  - [codify]
  - [codify-nat]

key_evidence: [plan-removes-rule, drift, hotfix-note, partner-range]

evidence_labels:
  plan-removes-rule: "The plan removes a 198.51.100.0/24 rule on 8443 from the payments security group"
  drift: "A refresh-only plan shows that rule was added outside Terraform"
  hotfix-note: "On-call added it in the console last night to fix partner callbacks, using the whole /24 as a guess"
  partner-range: "The partner's ticket says callbacks come only from 198.51.100.16/28"

hints:
  nudge: "Nobody removed that rule in code. Was it ever in code?"
  direction: "Run a refresh-only plan to see what changed outside Terraform, then check last night's incident notes and the partner's ticket. Is the range on the rule the range the partner actually needs?"
  answer: "The rule was a console hotfix, so it's drift, and the /24 was a guess. Read the partner ticket, put the rule in code narrowed to 198.51.100.16/28 (or just the two NAT gateways, .17/32 and .18/32) on 8443 through a reviewed PR, add no other source, and apply. Copying the /24 as it is would make the guess permanent."

analogy:
  title: "The plan of the house vs the house"
  text: |
    During a storm, someone propped open a back door so deliveries could
    get in. The building's official plan has that door shut, and tonight
    the caretaker will make the building match the plan. Update the plan
    to include the door, or the caretaker closes it again.

debrief:
  root_cause: |
    Terraform makes real infrastructure match the code. Last night's rule was
    added in the console, so it existed in AWS but not in the configuration:
    drift. Every plan from then on would remove it, and tonight's routine
    apply would have broken the partner's callbacks again. Codifying the
    hotfix makes the code the truth again, but only after it is verified:
    on-call opened the whole /24 as a guess, and the partner's ticket says
    only 198.51.100.16/28 sends callbacks. The code should say that, not
    the guess.
  ideal_path:
    - "Read the plan: it removes a rule nobody touched in code."
    - "Run a refresh-only plan: the rule was added outside Terraform."
    - "Match it to last night's console hotfix."
    - "Read the partner ticket: callbacks come only from 198.51.100.16/28, so the console's /24 is wider than needed."
    - "Add the rule to the code narrowed to that range, through review; plan again and see the group narrowed plus the tag, then apply."
  real_world: |
    Console hotfixes are sometimes necessary; the follow-up is to verify
    them, narrow them and codify them through a pull request the next day,
    with the ticket or approver in the rule description. An emergency rule
    is a guess made under pressure: confirm the source with the owner and
    security before it becomes permanent. Scheduled refresh-only plans
    (drift detection) catch the ones that get forgotten, and restricting
    console write access to security groups prevents most of them.

concepts:
  - term: "Drift"
    text: "A difference between real infrastructure and what the Terraform configuration and state describe, usually from changes made outside Terraform."
    url: "https://developer.hashicorp.com/terraform/tutorials/state/resource-drift"
  - term: "Refresh-only mode"
    text: "A plan that only reports how real infrastructure has changed since the last apply, without proposing changes to match the code."
    url: "https://developer.hashicorp.com/terraform/cli/commands/plan"

sources:
  - title: "Terraform: Manage resource drift"
    url: "https://developer.hashicorp.com/terraform/tutorials/state/resource-drift"
    retrieved: 2026-10-02
  - title: "Terraform: terraform plan (-refresh-only, -target)"
    url: "https://developer.hashicorp.com/terraform/cli/commands/plan"
    retrieved: 2026-10-02

command_notes:
  "git log --oneline -3": "The top commit added tonight's tag; the others are what main last applied."
