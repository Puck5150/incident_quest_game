  "git log --oneline -3": "The top commit is the refactor. The ones before it are what main last applied."
  "git log --oneline": "The top commit is the refactor. The ones before it are what main last applied."
  "git diff main -- network.tf db.tf": "count becomes for_each and count.index becomes each.key. Every argument evaluates to the same value as before: same zones, CIDRs, AMI, type and tags."
  "git diff main": "count becomes for_each and count.index becomes each.key. Every argument evaluates to the same value as before: same zones, CIDRs, AMI, type and tags."
  "aws ec2 describe-subnets --filters Name=vpc-id,Values=vpc-0f3e2a9c41b7d5e60": "Both subnets exist, available, with the ids state records under [0] and [1]."
