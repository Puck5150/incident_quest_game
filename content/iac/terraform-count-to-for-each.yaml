# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-count-to-for-each
track: iac
difficulty: 3
title: "A tidy-up PR wants to destroy the database hosts"
par_minutes: 12

ticket:
  from: "Platform team"
  severity: SEV4
  body: |
    My PR (refactor/subnets-by-az) only tidies up how we declare the private
    subnets and the two Postgres hosts. No settings change. CI's terraform
    plan fails with "Instance cannot be destroyed" on the db hosts. Nobody
    asked to destroy anything. Can I drop prevent_destroy so the pipeline
    goes green? Branch is checked out in ~/infra.

environment: |
  The core network for the orders platform lives in account 123456789012,
  us-east-1: one VPC with a private subnet in us-east-1a and one in
  us-east-1b. Each subnet runs a self-managed Postgres host (primary in
  1a, replica in 1b) on EC2 with its data on the instance. The Terraform
  code is in ~/infra; main holds what was last applied.

