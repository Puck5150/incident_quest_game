  prompt: "you@laptop:~/infra$"
  commands:
    - match: "git log --oneline -3"
      output: |
        9c41e7a refactor: key private subnets and db hosts by AZ
        52be0d3 db: bump instance type to r6i.large
        e1a8f40 network: tag private subnets with their AZ
    - match: "git log --oneline"
      output: |
        9c41e7a refactor: key private subnets and db hosts by AZ
        52be0d3 db: bump instance type to r6i.large
        e1a8f40 network: tag private subnets with their AZ
        7d03b92 network: private subnets in two AZs
        2f6a1c5 initial VPC
