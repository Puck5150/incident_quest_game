# yaml-language-server: $schema=../../schemas/incident.json
id: terraform-forces-replacement
track: iac
difficulty: 3
title: "Turning on encryption fails: Terraform says the database can't be destroyed"
par_minutes: 12

ticket:
  from: "Platform team"
  severity: SEV4
  body: |
    Security asked for encryption at rest on every database. Our PR sets
    storage_encrypted = true on the orders database, and the plan in CI fails
    with "Instance cannot be destroyed". We're only turning on a setting. Can
    we remove prevent_destroy for this one PR?

environment: |
  The orders database is an RDS for PostgreSQL instance managed by
  Terraform, created years ago without encryption, with
  lifecycle { prevent_destroy = true }. Applications connect through its
  endpoint. The Terraform for it lives in ~/infra.

terminal:
  prompt: "you@laptop:~/infra$"
  commands:
    - match: "git diff main -- db.tf"
      evidence: encryption-change
      output: |2
         resource "aws_db_instance" "orders" {
           identifier        = "orders-db"
           engine            = "postgres"
        -  storage_encrypted = false
        +  storage_encrypted = true
           lifecycle {
             prevent_destroy = true
    - match: "aws rds describe-db-instances --db-instance-identifier orders-db --query DBInstances[0].StorageEncrypted"
      evidence: unencrypted
      output: |
        false

terraform:
  dir: "~/infra"
  files:
    - path: main.tf
      content: |
        terraform {
          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = "~> 5.0"
            }
          }
        }

        provider "aws" {
          region = "us-east-1"
        }

        variable "db_password" {
          type      = string
          sensitive = true
        }
    - path: db.tf
      content: |
        resource "aws_db_instance" "orders" {
          identifier          = "orders-db"
          engine              = "postgres"
          engine_version      = "15.4"
          instance_class      = "db.r6g.large"
          allocated_storage   = 100
          db_name             = "orders"
          username            = "orders_admin"
          password            = var.db_password
          multi_az            = true
          storage_encrypted   = true
          skip_final_snapshot = false

          lifecycle {
            prevent_destroy = true
          }
        }
  vars:
    db_password: "orders-admin-secret"
  state:
    - type: aws_db_instance
      name: orders
      attrs:
        id: db-ORDERS1234
        arn: "arn:aws:rds:us-east-1:123456789012:db:orders-db"
        identifier: orders-db
        engine: postgres
        engine_version: "15.4"
        instance_class: db.r6g.large
        allocated_storage: 100
        db_name: orders
        username: orders_admin
        password: orders-admin-secret
        multi_az: true
        skip_final_snapshot: false
        storage_encrypted: false
        endpoint: "orders-db.cxyz.us-east-1.rds.amazonaws.com:5432"
  evidence:
    - evidence: prevent-destroy
      command: plan
      contains: "Instance cannot be destroyed"
    - evidence: unencrypted
      command: state show
      contains: "storage_encrypted   = false"

files:
  - path: "AWS provider docs: aws_db_instance (excerpt, from the provider's schema)"
    evidence: force-new
    content: |
      storage_encrypted (Optional, Forces new resource) Whether the DB instance
      is encrypted.

hypotheses:
  - id: replacement
    text: "storage_encrypted can't be changed on an existing instance, so Terraform plans to replace it (destroy and create an empty, encrypted one), and prevent_destroy correctly refuses."
    correct: true
  - id: lifecycle-bug
    text: "prevent_destroy is misfiring on a simple setting change."
    feedback: "For RDS, encryption can't be switched on in place: the change forces a new resource. A replacement destroys the database, which is exactly what prevent_destroy blocks."
  - id: kms
    text: "There's no KMS key for the encryption."
    feedback: "Without kms_key_id, RDS uses the default AWS managed key. The plan fails on a destroy, not on a missing key."
  - id: permissions
    text: "CI isn't allowed to encrypt databases."
    feedback: "The plan fails before any API call: it's Terraform's own lifecycle rule stopping a destroy."

actions:
  - id: revert-and-migrate
    label: "Revert storage_encrypted in this PR so CI can go green (an interim step only: the database is still unencrypted and the security requirement is still open)"
    kind: fix
    done_when:
      all:
        - plan_clean: true
        - not: { applied: { op: delete, address: aws_db_instance.orders } }
        - not: { applied: { op: create, address: aws_db_instance.orders } }
    file:
      path: "/home/you/infra/db.tf"
      matches: "storage_encrypted\\s*=\\s*false"
      after: |
        resource "aws_db_instance" "orders" {
          identifier          = "orders-db"
          engine              = "postgres"
          engine_version      = "15.4"
          instance_class      = "db.r6g.large"
          allocated_storage   = 100
          db_name             = "orders"
          username            = "orders_admin"
          password            = var.db_password
          multi_az            = true
          storage_encrypted   = false
          skip_final_snapshot = false

          lifecycle {
            prevent_destroy = true
          }
        }
    feedback: "The plan is clean again and CI can go green, but this only removes the failing change: orders-db is still unencrypted and the requirement security asked for is not met. The supported route to encryption is an encrypted snapshot copy restored to a new instance, with a planned cutover. That is the next job."
  - id: remove-guard
    label: "Remove prevent_destroy for this PR and apply"
    kind: destructive
    done_when: { applied: { op: delete, address: aws_db_instance.orders } }
    feedback: "Terraform destroys the production orders database and creates a new, empty, encrypted one. The guard exists to stop exactly that."
  - id: ignore-encryption
    label: "Add storage_encrypted to ignore_changes"
    kind: wrong
    done_when:
      file_contains: { path: /home/you/infra/db.tf, matches: 'ignore_changes\s*=\s*\[[^\]]*storage_encrypted' }
    feedback: "The plan goes quiet, the database stays unencrypted, and the code now claims it's encrypted. Security's requirement isn't met."
  - id: modify-console
    label: "Turn on encryption for the instance in the RDS console"
    kind: wrong
    feedback: "There's no such setting for an existing instance: an unencrypted DB instance can't be encrypted in place."

solution_paths:
  - [revert-and-migrate]

key_evidence: [prevent-destroy, encryption-change, force-new, unencrypted]

evidence_labels:
  prevent-destroy: "Plan fails: prevent_destroy blocks destroying aws_db_instance.orders"
  encryption-change: "The PR switches storage_encrypted from false to true"
  force-new: "storage_encrypted forces a new resource"
  unencrypted: "The live instance is unencrypted"

hints:
  nudge: "Why would turning on a setting need anything to be destroyed?"
  direction: "Check whether storage_encrypted can change on an existing instance, and what Terraform does when it can't."
  answer: "storage_encrypted forces replacement, and prevent_destroy rightly refuses. Revert it only to unblock the PR, then do the real migration: snapshot, copy the snapshot with a KMS key to encrypt it, restore a new instance from the encrypted copy, cut over in a window, and bring the new instance into Terraform."

analogy:
  title: "You can't fit a lock to a vault after it's built"
  text: |
    The new rule says every vault must have a combination lock. This vault
    was built without one, and the only way to add it is to build a new
    vault. The rule against demolishing vaults stops you from knocking it
    down with the gold inside. Build the new vault, move the gold, then
    retire the old one.

debrief:
  root_cause: |
    Some arguments can't change on an existing resource; for an RDS
    instance, storage_encrypted is one, since an unencrypted instance can't
    be encrypted in place. Terraform therefore planned to replace the
    database: destroy it and create a new, empty, encrypted one.
    prevent_destroy makes any plan that destroys the resource fail, so the
    plan stopped. The guard did its job; the real route is migrating the data
    through an encrypted snapshot copy.
  ideal_path:
    - "Read the error: prevent_destroy blocked a destroy."
    - "Find why: the failed plan marks storage_encrypted false -> true \"# forces replacement\" on aws_db_instance.orders, and the provider docs excerpt lists storage_encrypted as \"Forces new resource\"."
    - "Confirm the live instance is unencrypted; there's no in-place switch."
    - "Revert in this PR as an interim step (the plan is clean, the database is still unencrypted)."
    - "Migrate: snapshot, encrypted copy, restore to a new instance, cutover, import the new instance."
  real_world: |
    Keep prevent_destroy on stateful resources, and read every "forces
    replacement" in a plan as "this deletes it". Provider docs and the plan
    output say which arguments do that; check before writing the PR.

concepts:
  - term: "prevent_destroy"
    text: "A lifecycle setting that makes Terraform reject any plan that would destroy the resource."
    url: "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"
  - term: "Forces replacement"
    text: "A change to an argument that can't be updated in place, so Terraform destroys and recreates the object."
    url: "https://developer.hashicorp.com/terraform/cli/commands/plan"

sources:
  - title: "Terraform: The lifecycle meta-argument (prevent_destroy)"
    url: "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"
    retrieved: 2026-10-02
  - title: "Amazon RDS: Encrypting Amazon RDS resources (limitations: can't encrypt an existing unencrypted instance; encrypted snapshot copy)"
    url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html"
    retrieved: 2026-10-02
  - title: "Terraform AWS provider source: aws_db_instance schema (storage_encrypted ForceNew)"
    url: "https://github.com/hashicorp/terraform-provider-aws/blob/main/internal/service/rds/instance.go"
    retrieved: 2026-10-02
command_notes:
  "aws rds describe-db-snapshots --db-snapshot-identifier orders-db-encrypted": "Whether the encrypted copy exists yet, is available and reports Encrypted = true."
  "git diff main -- db.tf": "The only change is storage_encrypted, which an existing RDS instance can't change in place, so Terraform plans a replacement."

stages:
  - id: encrypt-for-real
    update: |
      The PR is merged with the revert and CI is green. Security's review the
      next morning: orders-db still reports StorageEncrypted = false, and
      the requirement (encryption at rest on every database) is due by the
      end of the month. The change window is Saturday 02:00-04:00. Prepare
      the migration with the names the runbook uses: snapshot
      orders-db-pre-encrypt, encrypted copy orders-db-encrypted (KMS alias
      alias/orders-db), new instance orders-db-v2.
    diagram_status: {}
    files:
      - path: "Amazon RDS: encrypting an existing instance (excerpt)"
        evidence: encrypted-copy-route
        content: |
          You can't turn encryption on for an existing unencrypted DB instance.
          To encrypt one: create a snapshot, copy the snapshot with a KMS key
          (the copy is encrypted), then restore a new DB instance from the
          encrypted copy. A snapshot restored without that copy produces an
          unencrypted instance again.
    terminal:
      commands:
        - match_regex: "^aws rds describe-db-snapshots --db-snapshot-identifier orders-db-encrypted$"
          example: "aws rds describe-db-snapshots --db-snapshot-identifier orders-db-encrypted"
          when_actions: [copy-encrypted]
          output: |
            {
                "DBSnapshots": [
                    {
                        "DBSnapshotIdentifier": "orders-db-encrypted",
                        "DBInstanceIdentifier": "orders-db",
                        "Status": "available",
                        "Encrypted": true,
                        "KmsKeyId": "arn:aws:kms:us-east-1:123456789012:key/orders-db"
                    }
                ]
            }
        - match_regex: "^aws rds describe-db-snapshots --db-snapshot-identifier orders-db-encrypted$"
          example: "aws rds describe-db-snapshots --db-snapshot-identifier orders-db-encrypted"
          output: |
            An error occurred (DBSnapshotNotFound) when calling the DescribeDBSnapshots operation: DBSnapshot not found: orders-db-encrypted
    hypotheses:
      - id: needs-encrypted-copy
        text: "An existing RDS instance can't be encrypted in place. The data has to go through a snapshot, an encrypted copy of it, and a restore to a new instance, then a cutover."
        correct: true
      - id: toggle-later
        text: "Encryption can be switched on for orders-db in the console during the window, with a short restart."
        feedback: "There is no such setting: RDS only encrypts at creation, which is why the Terraform plan wanted to replace the instance."
      - id: terraform-only
        text: "Re-applying the original PR (storage_encrypted = true) with prevent_destroy lifted during the window is the migration."
        feedback: "That replaces the instance with a new, empty, encrypted one: Terraform destroys the old database and creates another from nothing. The data has to be restored from an encrypted snapshot copy."
    actions:
      - id: create-snapshot
        label: "aws rds create-db-snapshot --db-instance-identifier orders-db --db-snapshot-identifier orders-db-pre-encrypt"
        kind: fix
        match_regex: "^aws rds create-db-snapshot (?=.*--db-instance-identifier orders-db(\\s|$))(?=.*--db-snapshot-identifier orders-db-pre-encrypt(\\s|$))(?!.*--region[ =](?!us-east-1(\\s|$)))"
        feedback: "A manual snapshot of the unencrypted instance exists. It is also your rollback point: nothing has changed on orders-db."
      - id: copy-encrypted
        label: "aws rds copy-db-snapshot --source-db-snapshot-identifier orders-db-pre-encrypt --target-db-snapshot-identifier orders-db-encrypted --kms-key-id alias/orders-db"
        kind: fix
        match_regex: "^aws rds copy-db-snapshot (?=.*--source-db-snapshot-identifier orders-db-pre-encrypt(\\s|$))(?=.*--target-db-snapshot-identifier orders-db-encrypted(\\s|$))(?=.*--kms-key-id [^\\s]+)(?!.*--region[ =](?!us-east-1(\\s|$)))"
        feedback: "The copy is encrypted with the KMS key. Check it is available before restoring from it."
      - id: restore-encrypted
        label: "aws rds restore-db-instance-from-db-snapshot --db-instance-identifier orders-db-v2 --db-snapshot-identifier orders-db-encrypted"
        kind: fix
        match_regex: "^aws rds restore-db-instance-from-db-snapshot (?=.*--db-instance-identifier orders-db-v2(\\s|$))(?=.*--db-snapshot-identifier orders-db-encrypted(\\s|$))(?!.*--region[ =](?!us-east-1(\\s|$)))"
        feedback: "orders-db-v2 is being created encrypted, from the data in the snapshot. orders-db keeps serving. Next, in the window: stop writes, take a last snapshot and restore from its encrypted copy (or replay changes), cut the applications over, import orders-db-v2 into Terraform with storage_encrypted = true and prevent_destroy, and retire the old instance only after the checks pass."
      - id: restore-unencrypted
        label: "aws rds restore-db-instance-from-db-snapshot --db-instance-identifier orders-db-v2 --db-snapshot-identifier orders-db-pre-encrypt"
        kind: wrong
        match_regex: "^aws rds restore-db-instance-from-db-snapshot (?=.*--db-instance-identifier orders-db-v2(\\s|$))(?=.*--db-snapshot-identifier orders-db-pre-encrypt(\\s|$))"
        feedback: "A restore from the unencrypted snapshot gives an unencrypted instance. Copy the snapshot with a KMS key first and restore from the copy."
      - id: delete-old-first
        label: "aws rds delete-db-instance --db-instance-identifier orders-db --skip-final-snapshot (to clear the way for the encrypted one)"
        kind: destructive
        match_regex: "^aws rds delete-db-instance (?=.*--db-instance-identifier orders-db(\\s|$))(?=.*--skip-final-snapshot)"
        feedback: "That deletes the production database with no final snapshot before anything has been restored, verified or cut over. The new instance comes after the checks, and the old one is retired last."
    solution_paths:
      - [create-snapshot, copy-encrypted, restore-encrypted]
    key_evidence: [encrypted-copy-route]
    evidence_labels:
      encrypted-copy-route: "An unencrypted instance is encrypted by copying a snapshot with a KMS key and restoring from the copy"
    hints:
      nudge: "The Terraform plan could not turn encryption on in place. What does AWS offer instead?"
      direction: "Read the RDS excerpt: snapshot, copy with a KMS key, restore from the copy. Verify the copy with describe-db-snapshots."
      answer: "Create the snapshot orders-db-pre-encrypt, copy it to orders-db-encrypted with --kms-key-id alias/orders-db, and restore orders-db-v2 from the encrypted copy. Cut over in the window and import the new instance into Terraform."
    debrief:
      root_cause: |
        The revert in stage 1 only removed the failing change. An RDS
        instance can't be encrypted in place, so the real fix is a migration:
        an encrypted copy of a snapshot restored as a new instance, a planned
        cutover, and the new instance adopted into Terraform with encryption
        on and prevent_destroy kept.
      ideal_path:
        - "Take a snapshot of orders-db."
        - "Copy it with a KMS key and check the copy is Encrypted and available."
        - "Restore a new instance from the encrypted copy."
        - "In the window: stop writes, catch up, cut over, import the new instance into Terraform, keep the old one until the checks pass, then retire it."
