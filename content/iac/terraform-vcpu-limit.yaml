    url: "https://docs.aws.amazon.com/cli/latest/reference/service-quotas/get-service-quota.html"
    retrieved: 2026-10-08
  - title: "AWS CLI: service-quotas request-service-quota-increase"
    url: "https://docs.aws.amazon.com/cli/latest/reference/service-quotas/request-service-quota-increase.html"
    retrieved: 2026-10-08
  - title: "AWS CLI: ec2 describe-instance-types (VCpuInfo)"
    url: "https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-instance-types.html"
    retrieved: 2026-10-08
  - title: "Amazon EC2 instance types: compute optimized specifications (c5 vCPUs)"
    url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/co.html"
    retrieved: 2026-10-08
  - title: "terraform-provider-aws v5.70.0: EC2 instance create (internal/service/ec2/ec2_instance.go)"
    url: "https://github.com/hashicorp/terraform-provider-aws/blob/v5.70.0/internal/service/ec2/ec2_instance.go"
