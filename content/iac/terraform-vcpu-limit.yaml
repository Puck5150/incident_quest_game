    url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-on-demand-instances.html"
    retrieved: 2026-10-08
  - title: "Amazon EC2 instance type quotas (default values, quota codes)"
    url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-instance-quotas.html"
    retrieved: 2026-10-08
  - title: "Amazon EC2 API Reference: Error codes"
    url: "https://docs.aws.amazon.com/AWSEC2/latest/APIReference/errors-overview.html"
    retrieved: 2026-10-08
