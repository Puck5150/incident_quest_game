command_notes:
  "aws service-quotas get-service-quota --service-code ec2 --quota-code L-1216C47A": "The applied value for Running On-Demand Standard instances in us-east-1: 64. The unit says None, but the usage metric's Resource is vCPU: the quota counts vCPUs of running instances, not instances."
  "aws ec2 describe-instance-types --instance-types c5.24xlarge --query \"InstanceTypes[].VCpuInfo.DefaultVCpus\"": "c5.24xlarge has 96 vCPUs: more than the whole quota on its own."
  "aws ec2 describe-instance-types --instance-types c5.18xlarge --query \"InstanceTypes[].VCpuInfo.DefaultVCpus\"": "c5.18xlarge has 72 vCPUs: still over 64."
  "aws ec2 describe-instance-types --instance-types c5.12xlarge --query \"InstanceTypes[].VCpuInfo.DefaultVCpus\"": "c5.12xlarge has 48 vCPUs: with the agent's 2, that's 50 of 64."
  "aws ec2 describe-instance-types --instance-types t3.small --query \"InstanceTypes[].VCpuInfo.DefaultVCpus\"": "The agent's t3.small has 2 vCPUs, and T instances count toward the same standard quota."
