command_notes:
  "git diff main -- web.tf": "The whole PR: one new tag, plus the alignment change around it. Nothing else about the instance."
  "git diff main": "The whole PR: one new tag, plus the alignment change around it. Nothing else about the instance."
  "git log --oneline -3": "The top commit is the PR. Nothing on the branch touches the instance otherwise."
  "aws ec2 describe-instances --instance-ids i-0c3f7a9e5d1b2c846": "The instance is running with the AMI, type, subnet and tags state records: nothing drifted."
  "history | grep taint": "With HISTTIMEFORMAT set (see ~/.bashrc), bash history keeps the time of each command. The taint is from 2026-09-29; the second line is the grep itself."
  "grep taint ~/.bash_history": "The history file on disk. The #-numbers above each line in it are the timestamps bash saves when HISTTIMEFORMAT is set."
