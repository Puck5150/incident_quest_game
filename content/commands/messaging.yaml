# yaml-language-server: $schema=../../schemas/commands.json
# Command library: message brokers. First matching entry wins.

- id: rabbitmqctl-list-queues
  match: "^(sudo )?rabbitmqctl list_queues"
  summary: "Lists RabbitMQ queues with the columns you ask for."
  parts:
    - { token: "list_queues", meaning: "One line per queue." }
    - { token: "name messages consumers", meaning: "Columns: queue name, messages waiting, and connected consumers." }
  why: "Messages piling up with zero consumers means nobody is reading; with consumers, they're reading too slowly or failing."
  alternatives:
    - { command: "rabbitmq-diagnostics list_queues ...", note: "Newer tool name, same output." }
    - { command: "Management UI > Queues", note: "The same, with rates." }
  docs: { title: "rabbitmqctl", url: "https://www.rabbitmq.com/docs/man/rabbitmqctl.8" }

- id: rabbitmqctl-list-policies
  match: "^(sudo )?rabbitmqctl list_policies"
  summary: "Lists RabbitMQ policies: rules applied to matching queues, such as length limits, TTLs and dead-lettering."
  parts:
    - { token: "list_policies", meaning: "Each policy's name, pattern, what it applies to, and its settings." }
  why: "A policy can silently cap a queue (max-length) or expire messages (message-ttl), dropping them unless a dead-letter exchange is set."
  alternatives:
    - { command: "Management UI > Admin > Policies", note: "The same." }
  docs: { title: "RabbitMQ: policies", url: "https://www.rabbitmq.com/docs/policies" }

- id: kafka-consumer-groups-describe
  match: "^kafka-consumer-groups(\\.sh)? .*--describe"
  summary: "Shows a Kafka consumer group's position on each partition: committed offset, end of the log, lag, and which member owns it."
  parts:
    - { token: "--bootstrap-server kafka:9092", meaning: "A broker to connect to." }
    - { token: "--describe", meaning: "Show the group's state per partition." }
    - { token: "--group notification-service", meaning: "The consumer group." }
  why: "Lag that grows while members keep changing (or show \"-\" during a rebalance) means consumers are being kicked out, not just slow."
  alternatives:
    - { command: "kafka-consumer-groups.sh --bootstrap-server B --describe --group G --members --verbose", note: "The members and their assigned partitions." }
  docs: { title: "Kafka: Managing consumer groups", url: "https://kafka.apache.org/documentation/#basic_ops_consumer_group" }

- id: rabbitmqctl-cluster-status
  match: "^(sudo )?rabbitmq(ctl|-diagnostics) cluster_status"
  summary: "Shows which nodes are in the RabbitMQ cluster, which are running, and any network partitions."
  parts:
    - { token: "rabbitmqctl cluster_status", meaning: "Print the cluster's members and their state." }
  why: "A partition is invisible to clients: they just see timeouts. This shows whether the nodes still agree on who is in the cluster, and lists the nodes that cannot reach each other."
  alternatives:
    - { command: "rabbitmq-diagnostics cluster_status", note: "The newer tool name, same output." }
    - { command: "rabbitmqctl list_connections", note: "Which nodes the clients are actually connected to." }
  docs: { title: "RabbitMQ: clustering and network partitions", url: "https://www.rabbitmq.com/docs/partitions" }

- id: rabbitmqctl-eval-partition-handling
  match: "^(sudo )?rabbitmqctl eval "
  summary: "Runs a small Erlang expression on the RabbitMQ node, here reading the partition-handling setting."
  parts:
    - { token: "rabbitmqctl eval", meaning: "Evaluate an Erlang expression on the running node." }
    - { token: "'application:get_env(rabbit, cluster_partition_handling).'", meaning: "Read the rabbit application's cluster_partition_handling setting: ignore, pause_minority, autoheal or pause_if_all_down." }
  why: "The effective setting, not the config file, is what the node is running with. It is the way to confirm what happens next time the network splits."
  alternatives:
    - { command: "grep cluster_partition_handling /etc/rabbitmq/rabbitmq.conf", note: "What the file says, which may not be what is loaded." }
  docs: { title: "RabbitMQ: clustering and network partitions", url: "https://www.rabbitmq.com/docs/partitions" }
