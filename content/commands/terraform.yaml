# yaml-language-server: $schema=../../schemas/commands.json
# Command library: Terraform. First matching entry wins.

- id: terraform-plan-refresh-only
  match: "^terraform plan -refresh-only"
  summary: "Shows how real infrastructure differs from Terraform's state, without proposing changes to the infrastructure."
  parts:
    - { token: "plan", meaning: "Preview, change nothing." }
    - { token: "-refresh-only", meaning: "Only compare state with reality: what changed outside Terraform (drift)." }
  why: "Separates drift (someone changed it by hand) from the changes your configuration would make."
  alternatives:
    - { command: "terraform apply -refresh-only", note: "Accept the real values into state." }
  docs: { title: "terraform plan", url: "https://developer.hashicorp.com/terraform/cli/commands/plan" }

- id: terraform-plan
  match: "^terraform plan"
  summary: "Shows what Terraform would create, change, replace or destroy, without doing it."
  parts:
    - { token: "plan", meaning: "Refresh state, compare it with the configuration, and print the proposed actions." }
  why: "Look for \"must be replaced\" and \"forces replacement\" next to an attribute: that's a destroy and re-create, which for a database means data loss."
  alternatives:
    - { command: "terraform plan -out=tfplan", note: "Save the plan so apply does exactly that." }
    - { command: "terraform show tfplan", note: "Read a saved plan." }
  docs: { title: "terraform plan", url: "https://developer.hashicorp.com/terraform/cli/commands/plan" }

- id: terraform-state-list
  match: "^terraform state list"
  summary: "Lists every resource address in Terraform's state."
  parts:
    - { token: "state list", meaning: "All resources Terraform is tracking." }
    - { token: "| grep NAME", meaning: "(If piped) keep only matching addresses." }
  why: "A resource missing from state gets created again; one present under an old address gets destroyed. The list shows which."
  alternatives:
    - { command: "terraform state show ADDRESS", note: "One resource's recorded attributes." }
  docs: { title: "terraform state list", url: "https://developer.hashicorp.com/terraform/cli/commands/state/list" }

- id: terraform-workspace-show
  match: "^terraform workspace show$"
  summary: "Prints the workspace the current working directory is using."
  parts:
    - { token: "workspace show", meaning: "The selected workspace (stored in .terraform/environment), which decides whose state a plan or apply uses." }
  why: "The tfvars file you pass doesn't choose the environment; the selected workspace does. Check it before every apply."
  alternatives:
    - { command: "terraform workspace list", note: "All workspaces, with * on the current one." }
    - { command: "echo $TF_WORKSPACE", note: "If set, it overrides the selected workspace." }
  docs: { title: "terraform workspace show", url: "https://developer.hashicorp.com/terraform/cli/commands/workspace/show" }

- id: terraform-init-upgrade
  match: "^terraform init -upgrade"
  summary: "Re-selects providers (and modules) at the newest versions the configuration's constraints allow, and rewrites the dependency lock file to match."
  parts:
    - { token: "init", meaning: "Install the providers and modules the configuration needs and record the provider selections in .terraform.lock.hcl." }
    - { token: "-upgrade", meaning: "Ignore the versions already recorded in the lock file and take the newest version each constraint allows." }
  why: "After a provider constraint changes, the lock file no longer matches it; this is the command that regenerates the lock file correctly, with the checksums Terraform computed itself."
  alternatives:
    - { command: "terraform init -lockfile=readonly", note: "Verify against the committed lock without changing it (CI); conflicts with -upgrade." }
  docs: { title: "terraform init", url: "https://developer.hashicorp.com/terraform/cli/commands/init" }

- id: terraform-version
  match: "^terraform version"
  summary: "Prints the Terraform version and the provider versions the lock file selected."
  parts:
    - { token: "version", meaning: "Terraform's own version, then one line per provider recorded in .terraform.lock.hcl." }
  why: "Shows which provider version this working directory will actually use, whatever the configuration's constraint says."
  alternatives:
    - { command: "cat .terraform.lock.hcl", note: "The lock file itself, with constraints and checksums." }
  docs: { title: "terraform version", url: "https://developer.hashicorp.com/terraform/cli/commands/version" }

- id: terraform-providers
  match: "^terraform providers"
  summary: "Prints the providers the configuration (and state) requires, with their version constraints, module by module."
  parts:
    - { token: "providers", meaning: "A tree of each module's provider requirements and the providers recorded in state." }
  why: "Shows the constraint side of a lock-file comparison without running a plan."
  alternatives:
    - { command: "terraform version", note: "The version side: what the lock file selected." }
  docs: { title: "terraform providers", url: "https://developer.hashicorp.com/terraform/cli/commands/providers" }

- id: terraform-state-rm
  match: "^terraform state rm"
  summary: "Removes objects from Terraform's state without destroying them."
  parts:
    - { token: "state rm", meaning: "Forget the named resource, or every object under a module or module instance." }
    - { token: "'module.NAME[\"key\"]'", meaning: "(Quote the address) one instance of a module with for_each." }
  why: "The real objects keep running but nothing manages them any more, and a later plan wants to create them again if the code still declares them. It moves work, it does not do it."
  alternatives:
    - { command: "terraform state rm -dry-run ADDRESS", note: "Show what would be removed first." }
    - { command: "removed block with lifecycle { destroy = false }", note: "Reviewed-in-code way to stop managing an object (Terraform 1.7+)." }
  docs: { title: "terraform state rm", url: "https://developer.hashicorp.com/terraform/cli/commands/state/rm" }
