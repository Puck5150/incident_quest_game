# yaml-language-server: $schema=../../schemas/commands.json
# Command library: Terraform. First matching entry wins.

- id: terraform-plan-refresh-only
  match: "^terraform plan -refresh-only"
  summary: "Shows how real infrastructure differs from Terraform's state, without proposing changes to the infrastructure."
  parts:
    - { token: "plan", meaning: "Preview, change nothing." }
    - { token: "-refresh-only", meaning: "Only compare state with reality: what changed outside Terraform (drift)." }
  why: "Separates drift (someone changed it by hand) from the changes your configuration would make."
  alternatives:
    - { command: "terraform apply -refresh-only", note: "Accept the real values into state." }
  docs: { title: "terraform plan", url: "https://developer.hashicorp.com/terraform/cli/commands/plan" }

- id: terraform-plan
  match: "^terraform plan"
  summary: "Shows what Terraform would create, change, replace or destroy, without doing it."
  parts:
    - { token: "plan", meaning: "Refresh state, compare it with the configuration, and print the proposed actions." }
  why: "Look for \"must be replaced\" and \"forces replacement\" next to an attribute: that's a destroy and re-create, which for a database means data loss."
  alternatives:
    - { command: "terraform plan -out=tfplan", note: "Save the plan so apply does exactly that." }
    - { command: "terraform show tfplan", note: "Read a saved plan." }
  docs: { title: "terraform plan", url: "https://developer.hashicorp.com/terraform/cli/commands/plan" }

- id: terraform-state-list
  match: "^terraform state list"
  summary: "Lists every resource address in Terraform's state."
  parts:
    - { token: "state list", meaning: "All resources Terraform is tracking." }
    - { token: "| grep NAME", meaning: "(If piped) keep only matching addresses." }
  why: "A resource missing from state gets created again; one present under an old address gets destroyed. The list shows which."
  alternatives:
    - { command: "terraform state show ADDRESS", note: "One resource's recorded attributes." }
  docs: { title: "terraform state list", url: "https://developer.hashicorp.com/terraform/cli/commands/state/list" }

- id: terraform-workspace-show
  match: "^terraform workspace show$"
  summary: "Prints the workspace the current working directory is using."
  parts:
    - { token: "workspace show", meaning: "The selected workspace (stored in .terraform/environment), which decides whose state a plan or apply uses." }
  why: "The tfvars file you pass doesn't choose the environment; the selected workspace does. Check it before every apply."
  alternatives:
    - { command: "terraform workspace list", note: "All workspaces, with * on the current one." }
    - { command: "echo $TF_WORKSPACE", note: "If set, it overrides the selected workspace." }
  docs: { title: "terraform workspace show", url: "https://developer.hashicorp.com/terraform/cli/commands/workspace/show" }
