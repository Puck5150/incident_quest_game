# yaml-language-server: $schema=../../schemas/sandbox.json
type: sandbox
id: gcp-sandbox
provider: gcp
title: "Google Cloud design sandbox"
extends: gcp-signup-canvas

layout:
  global: true
  regions:
    - id: usc1
      label: "us-central1"
      zones:
        - { id: usc1-a, label: "us-central1-a" }
        - { id: usc1-b, label: "us-central1-b" }
    - id: use1
      label: "us-east1"
      zones:
        - { id: use1-b, label: "us-east1-b" }
        - { id: use1-c, label: "us-east1-c" }

palette:
  - id: pubsub
    label: "Pub/Sub topic"
    short: "Pub/Sub"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "An asynchronous messaging service that decouples the systems that publish messages from the systems that process them."
      - "Topic and subscription names are global, but each message is stored in one region and is always persisted to multiple zones there, so a single zone outage does not stop delivery."
      - "A subscription keeps unacknowledged messages for 7 days by default (up to 31), and a message can be sent again if it is not acknowledged within the acknowledgment deadline."
  - id: memorystore
    label: "Memorystore for Redis instance"
    short: "cache"
    scope: zonal
    roles: [neutral]
    cost: 2
    facts:
      - "Basic tier is a single node with no cross-zone replication and is meant as an ephemeral cache. Standard tier adds a replica in another zone and fails over automatically."
      - "Replication is asynchronous, so acknowledged writes can be lost during a failover."
      - "Memorystore for Redis does not support cross-region replication, and Google recommends Memorystore for Valkey for cross-region disaster recovery."
  - id: gcs
    label: "Cloud Storage bucket"
    short: "GCS"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "A bucket in a single region keeps its data redundant across multiple zones in that region, so a zone failure does not make it unavailable."
      - "Dual-region and multi-region buckets add redundancy across regions, asynchronously, for higher availability than one region."
      - "You choose the bucket's location when you create it, and it decides how the data is replicated and what it costs."
  - id: cloud-cdn
    label: "Cloud CDN"
    short: "CDN"
    scope: global
    roles: [neutral]
    cost: 2
    facts:
      - "Caches content at Google's edge locations around the world and answers from there when it has a matching cached response, which cuts latency and load on the origin."
      - "It is switched on for a global external Application Load Balancer backend rather than running on its own, and the origin can be an instance group, a backend bucket or a GKE backend."
      - "On a cache miss, the request goes through the load balancer to the origin, and a cacheable response is stored for later requests."

sources:
  - title: "What is Pub/Sub?"
    url: "https://cloud.google.com/pubsub/docs/overview"
    retrieved: 2026-10-27
  - title: "Pub/Sub: Introduction to reliability"
    url: "https://docs.cloud.google.com/pubsub/docs/reliability-intro"
    retrieved: 2026-10-27
  - title: "Subscription properties"
    url: "https://docs.cloud.google.com/pubsub/docs/subscription-properties"
    retrieved: 2026-10-27
  - title: "High availability for Memorystore for Redis"
    url: "https://cloud.google.com/memorystore/docs/redis/high-availability"
    retrieved: 2026-10-27
  - title: "Redis tier capabilities"
    url: "https://docs.cloud.google.com/memorystore/docs/redis/redis-tiers"
    retrieved: 2026-10-27
  - title: "Bucket locations"
    url: "https://cloud.google.com/storage/docs/locations"
    retrieved: 2026-10-27
  - title: "Cloud CDN overview"
    url: "https://cloud.google.com/cdn/docs/overview"
    retrieved: 2026-10-27
