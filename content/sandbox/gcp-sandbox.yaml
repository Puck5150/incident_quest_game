# yaml-language-server: $schema=../../schemas/sandbox.json
type: sandbox
id: gcp-sandbox
provider: gcp
title: "Google Cloud design sandbox"
extends: gcp-signup-canvas

layout:
  global: true
  regions:
    - id: usc1
      label: "us-central1"
      zones:
        - { id: usc1-a, label: "us-central1-a" }
        - { id: usc1-b, label: "us-central1-b" }
    - id: use1
      label: "us-east1"
      zones:
        - { id: use1-b, label: "us-east1-b" }
        - { id: use1-c, label: "us-east1-c" }

palette:
  - id: pubsub
    label: "Pub/Sub topic"
    short: "Pub/Sub"
    scope: global
    roles: [neutral]
    cost: 1
    facts:
      - "An asynchronous messaging service that decouples the systems that publish messages from the systems that process them."
      - "By default Pub/Sub is a global service: topics and subscriptions are not tied to a region. Each message is still stored in the region where it was published, in multiple zones there, so losing one zone does not stop delivery."
      - "Unacknowledged messages are kept for 7 days unless you change it (31 days at most), and an unacknowledged message is delivered again once the acknowledgment deadline passes."
  - id: memorystore
    label: "Memorystore for Redis node"
    short: "cache"
    scope: zonal
    roles: [cache]
    cost: 2
    facts:
      - "On the Basic tier this is one Redis node with no replication, so no cross-zone replication; you choose its region and zone when you create it. Google describes it as an ephemeral cache. The Standard tier adds a replica, cross-zone replication and automatic failover."
      - "Standard-tier replication is asynchronous, so a write that was already acknowledged can still be lost when a failover happens."
      - "This product cannot replicate across regions; Google points to Memorystore for Valkey when you need cross-region disaster recovery."
  - id: gcs
    label: "Cloud Storage bucket"
    short: "GCS"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "A bucket in a single region keeps its data redundant across multiple zones in that region, so a zone failure does not make it unavailable."
      - "Dual-region and multi-region buckets add redundancy across regions, asynchronously, for higher availability than one region."
      - "You choose the bucket's location when you create it, and it decides how the data is replicated and what it costs."
  - id: global-alb
    label: "Global external Application Load Balancer"
    short: "Global LB"
    scope: global
    roles: [route]
    cost: 2
    facts:
      - "This load balancer is not a single proxy: Google runs it on Google Front Ends (GFEs) spread across the globe. With Premium Tier, Google announces its IP address from points of presence worldwide, and each client reaches the GFE closest to it."
      - "With Premium Tier only, a region whose backends are all unhealthy is not necessarily a dead end: the GFE there might spill requests over to a GFE in another region that has backends configured. On Standard Tier, the forwarding rule restricts the backends to instance groups and zonal NEGs located in its own region."
      - "Google's feature comparison marks cross-region failover for the external Application Load Balancer in just two modes, global and classic, and footnotes classic as supported for Premium Tier."
      - "The regional external Application Load Balancer is a different mode: it is a regional load balancer built on Envoy proxies and serves one configured region, so it is not this part."
    caching:
      label: "Cloud CDN"
      default: false
      facts:
        - "You switch Cloud CDN on for a backend service or backend bucket that the URL map points to. The cache check is made by the GFE at Google's network edge, near the user, where the request first arrives; on a hit, that GFE answers without the backends being involved."
        - "Among the external Application Load Balancer modes, Google's feature comparison shows Cloud CDN for global and classic only, and footnotes classic as supported for Premium Tier."
        - "After a miss, the request continues from the GFE through the load balancer to one of your origin servers; when the reply is cacheable, Cloud CDN keeps a copy for later requests."
        - "Cloud CDN only stores replies to GET requests. By default it does not cache successful HTML or JSON responses, and Google notes that its exact caching conditions may change from time to time."

