# yaml-language-server: $schema=../../schemas/sandbox.json
type: sandbox
id: aws-sandbox
provider: aws
title: "AWS design sandbox"
extends: aws-checkout-canvas

layout:
  global: true
  regions:
    - id: use1
      label: "us-east-1"
      zones:
        - { id: use1-az1, label: "us-east-1a" }
        - { id: use1-az2, label: "us-east-1b" }
    - id: usw2
      label: "us-west-2"
      zones:
        - { id: usw2-az1, label: "us-west-2a" }
        - { id: usw2-az2, label: "us-west-2b" }

palette:
  - id: sqs
    label: "Amazon SQS queue"
    short: "SQS"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "A hosted message queue that lets one part of a system hand work to another without calling it directly."
      - "Messages are stored redundantly across multiple SQS servers, and a message stays in the queue until a consumer deletes it or it passes the retention period (4 days by default)."
  - id: elasticache
    label: "ElastiCache cache node"
    short: "cache"
    scope: zonal
    roles: [cache]
    cost: 2
    facts:
      - "Each cache node is placed in one Availability Zone, chosen by you or by ElastiCache. With Multi-AZ enabled, ElastiCache spreads the replicas across different zones."
      - "If the primary fails, the replica with the least replication lag is promoted and writes usually resume within a few seconds. Replication is asynchronous, so the newest writes may not have reached the replica when it is promoted. With no replica to promote, the replacement node begins with an empty cache."
  - id: s3
    label: "Amazon S3 bucket"
    short: "S3"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "In the S3 Standard class, each object is stored redundantly across at least three Availability Zones in the Region, so it survives the loss of a whole zone."
      - "Designed for 99.999999999% durability and 99.99% availability over a year. The One Zone-IA class keeps data in a single zone instead."
  - id: cloudfront
    label: "CloudFront distribution"
    short: "CDN"
    scope: global
    roles: [route]
    cost: 2
    facts:
      - "A global service: it delivers content through a worldwide network of data centers called edge locations."
      - "DNS routes each viewer to the edge location that can best serve the request, typically the nearest one by latency."
      - "Regional edge caches sit between the edge locations and your origin, and each holds more than a single edge location can."
    caching:
      label: "Caching"
      default: true
      facts:
        - "On by default: unless the origin's headers say otherwise, a file stays in an edge location for 24 hours before it expires."
        - "When the requested object is not cached, CloudFront forwards the request to the origin and keeps the returned object for the next viewer."
        - "Only GET and HEAD responses are cached, plus OPTIONS if you opt in. Responses to PUT, POST, PATCH and DELETE are never cached, and those requests go from the edge location straight to the origin."
        - "The CachingDisabled managed cache policy turns caching off. AWS describes it as useful for dynamic content and for requests that are not cacheable."

sources:
  - title: "What is Amazon Simple Queue Service?"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html"
    retrieved: 2026-10-27
  - title: "Minimizing downtime in ElastiCache by using Multi-AZ with Valkey and Redis OSS"
    url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoFailover.html"
    retrieved: 2026-10-28
  - title: "Choosing regions and availability zones for ElastiCache"
    url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/RegionsAndAZs.html"
    retrieved: 2026-10-28
  - title: "Data protection in Amazon S3"
    url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/DataDurability.html"
    retrieved: 2026-10-27
  - title: "What is Amazon CloudFront?"
    url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html"
    retrieved: 2026-10-29
  - title: "How CloudFront delivers content"
    url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html"
    retrieved: 2026-10-29
  - title: "Cache behavior settings"
    url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesCacheBehavior.html"
    retrieved: 2026-10-29
  - title: "Use managed cache policies"
    url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html"
    retrieved: 2026-10-29
  - title: "Resilience in Amazon CloudFront"
