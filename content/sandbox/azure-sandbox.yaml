    retrieved: 2026-10-27
  - title: "High availability for Azure Cache for Redis"
    url: "https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-high-availability"
    retrieved: 2026-10-28
  - title: "Reliability in Azure Managed Redis"
    url: "https://learn.microsoft.com/en-us/azure/reliability/reliability-managed-redis"
    retrieved: 2026-10-28
  - title: "Data redundancy - Azure Storage"
