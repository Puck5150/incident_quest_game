# yaml-language-server: $schema=../../schemas/sandbox.json
type: sandbox
id: azure-sandbox
provider: azure
title: "Azure design sandbox"
extends: azure-portal-canvas

layout:
  global: true
  regions:
    - id: eus2
      label: "East US 2"
      zones:
        - { id: eus2-z1, label: "Zone 1" }
        - { id: eus2-z2, label: "Zone 2" }
    - id: wus2
      label: "West US 2"
      zones:
        - { id: wus2-z1, label: "Zone 1 (West US 2)" }
        - { id: wus2-z2, label: "Zone 2 (West US 2)" }

palette:
  - id: service-bus
    label: "Azure Service Bus namespace"
    short: "Service Bus"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "A managed message broker with queues and publish-subscribe topics, so one part of a system can hand work to another without both being online at once."
      - "In a region with availability zones, a namespace is zone-redundant automatically at no extra cost: messages are copied synchronously across zones before they are acknowledged, so losing one zone loses no data."
      - "The built-in way to keep working through a region outage is Geo-Replication, which is a Premium-tier feature; you decide when to promote the secondary region."
  - id: managed-redis
    label: "Azure Managed Redis cache"
    short: "cache"
    scope: regional
    roles: [cache]
    cost: 2
    facts:
      - "Azure Cache for Redis now has a published retirement timeline, and Microsoft points existing users to Azure Managed Redis, so this part models the newer service."
      - "With high availability on, the cache has at least two nodes, and in a region with availability zones they sit in different zones."
      - "Replication between the nodes is asynchronous, so writes not yet copied to another zone can be lost in a zone failure. Failover to a healthy zone typically takes 10 to 15 seconds."
      - "Microsoft's documented option for surviving a region outage is active geo-replication, which links caches across regions; you point the client application at another instance yourself."
  - id: blob
    label: "Azure Blob Storage account"
    short: "Blob"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "With zone-redundant storage (ZRS), data is written synchronously to three or more availability zones in the region, so it stays readable and writable if one zone is lost."
      - "Locally redundant storage (LRS) keeps every copy inside a single datacenter in the region. It covers drive, server and rack failures, but a disaster such as fire or flooding there could take all the copies."
      - "Geo-redundant options (GRS and GZRS) add an asynchronous copy in a second, distant region. Because that copy lags, a regional disaster can lose the most recent writes."
  - id: traffic-manager
    label: "Azure Traffic Manager profile"
    short: "Traffic Manager"
    scope: global
    roles: [route]
    cost: 1
    facts:
      - "Its whole job is the name lookup: it returns the address of an endpoint, and the client then talks to that endpoint directly, with Traffic Manager out of the path. It is not a proxy or a gateway."
      - "It is not tied to any one region: Microsoft runs it in many regions, with its infrastructure spread across zones, so a zone or region outage leaves other copies still answering lookups."
      - "Front Door is documented as a potential single point of failure. Microsoft says most workloads do not need to guard against that, and offers Traffic Manager in front of Front Door plus a second ingress path, such as Application Gateway, only for mission-critical ones."
      - "Traffic that moves to that second path stops getting Front Door's cache, and Application Gateway has no caching, so the origins carry load a cache would otherwise have absorbed."
      - "Routing Traffic Manager straight to app services, with no Application Gateway between, can leave you unable to protect them with a WAF, and the services must terminate TLS themselves."
      - "Moving users off a failed path takes time. Resolvers may hold the old DNS answer up to its TTL, some upstream caches hold it longer, and the health-check frequency and failure threshold add to the delay."

overlays:
  - id: front-door
    caching:
      label: "Enable caching"
      default: false
      facts:
        - "Front Door is itself a content delivery network, and caching is a setting on each route. With it on, a request the edge site that took it can answer from its cache is served right there, and anything else is fetched from the origin."
        - "Each edge site manages its own cache and requests can land on different sites, so some traffic may still reach the origin even with caching on."
        - "Only GET responses are cached; a request using any other method is never answered from the cache."
        - "Keep static files on their own route with caching on, and send dynamic responses down a different route that does not cache. That split is Microsoft's recommendation."
        - "Caching a response that was meant for one signed-in user lets Front Door serve it to others, leaking personal information. Microsoft names authenticated API endpoints as content not to cache."

