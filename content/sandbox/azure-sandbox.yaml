# yaml-language-server: $schema=../../schemas/sandbox.json
type: sandbox
id: azure-sandbox
provider: azure
title: "Azure design sandbox"
extends: azure-portal-canvas

layout:
  global: true
  regions:
    - id: eus2
      label: "East US 2"
      zones:
        - { id: eus2-z1, label: "Zone 1" }
        - { id: eus2-z2, label: "Zone 2" }
    - id: wus2
      label: "West US 2"
      zones:
        - { id: wus2-z1, label: "Zone 1 (West US 2)" }
        - { id: wus2-z2, label: "Zone 2 (West US 2)" }

palette:
  - id: service-bus
    label: "Azure Service Bus namespace"
    short: "Service Bus"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "A managed message broker with queues and publish-subscribe topics, so one part of a system can hand work to another without both being online at once."
      - "In a region with availability zones, a namespace is zone-redundant automatically at no extra cost: messages are copied synchronously across zones before they are acknowledged, so losing one zone loses no data."
      - "The built-in way to keep working through a region outage is Geo-Replication, which is a Premium-tier feature; you decide when to promote the secondary region."
  - id: managed-redis
    label: "Azure Managed Redis cache"
    short: "cache"
    scope: regional
    roles: [cache]
    cost: 2
    facts:
      - "Microsoft has announced a retirement timeline for Azure Cache for Redis and recommends moving to Azure Managed Redis, so this part models the newer service."
      - "With high availability on, the cache has at least two nodes, and in a region with availability zones they sit in different zones."
      - "Replication between the nodes is asynchronous, so writes not yet copied to another zone can be lost in a zone failure. Failover to a healthy zone typically takes 10 to 15 seconds."
      - "Surviving a whole-region outage takes active geo-replication, which links cache instances in different regions; you are responsible for redirecting your application to a healthy instance."
  - id: blob
    label: "Azure Blob Storage account"
    short: "Blob"
    scope: regional
    roles: [neutral]
    cost: 1
    facts:
      - "With zone-redundant storage (ZRS), data is written synchronously to three or more availability zones in the region, so it stays readable and writable if one zone is lost."
      - "Locally redundant storage (LRS) keeps every copy inside a single datacenter in the region. It covers drive, server and rack failures, but a disaster such as fire or flooding there could take all the copies."
      - "Geo-redundant options (GRS and GZRS) add an asynchronous copy in a second, distant region. Because that copy lags, a regional disaster can lose the most recent writes."

sources:
  - title: "Introduction to Azure Service Bus Messaging"
    url: "https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-messaging-overview"
    retrieved: 2026-10-27
