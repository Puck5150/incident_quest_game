# yaml-language-server: $schema=../../schemas/incident.json
id: release-pipeline-major
track: cicd
difficulty: 5
title: "v2.4.0 was announced this morning, and nobody can install it"
par_minutes: 30

ticket:
  from: "Developer relations"
  severity: SEV1
  body: |
    We announced acmectl v2.4.0 at 09:00 (blog, newsletter, conference
    keynote at 14:00). The GitHub release page exists, but the install
    script fails and the binaries aren't there. Also, every workflow run is
    covered in yellow warnings since this week; is something broken in
    Actions?

environment: |
  acme/acmectl on GitHub. release.yml (run by hand) bumps the version,
  commits, and pushes a tag vX.Y.Z using actions/checkout's default
  credentials. publish.yml runs on: push: tags: ['v*'] (and on
  workflow_dispatch with a tag input): it builds acmectl on a matrix of
  ubuntu, macOS and Windows, then a publish job creates the GitHub release
  and attaches the binaries and SHA256SUMS. The install script downloads
  from releases/latest/download/. Until this release only Linux was built.

diagram:
  nodes:
    - { id: release, label: "release.yml (tag v2.4.0)", col: 0, row: 0, status: ok }
    - { id: publish, label: "publish.yml (on tag push)", col: 1, row: 0, status: down }
    - { id: matrix, label: "build matrix x3", col: 2, row: 0, status: ok }
    - { id: gh, label: "GitHub release v2.4.0", col: 3, row: 0, status: degraded }
  edges:
    - { from: release, to: publish }
    - { from: publish, to: matrix }
    - { from: matrix, to: gh }

terminal:
  prompt: "you@laptop:~/acmectl$"
  commands:
    - match: "gh run list --workflow publish.yml --limit 3"
      when_actions: [dispatch-tag]
      output: |
        STATUS  TITLE                 WORKFLOW     BRANCH  EVENT              ID    ELAPSED  AGE
        ✓       publish v2.4.0        publish.yml  v2.4.0  workflow_dispatch  8812  6m12s    3m
        ✓       v2.3.0                publish.yml  v2.3.0  push               8519  2m40s    16d
        ✓       v2.2.1                publish.yml  v2.2.1  push               8204  2m31s    29d
    - match: "gh run list --workflow publish.yml --limit 3"
      evidence: no-publish-run
      output: |
        STATUS  TITLE   WORKFLOW     BRANCH  EVENT  ID    ELAPSED  AGE
        ✓       v2.3.0  publish.yml  v2.3.0  push   8519  2m40s    16d
        ✓       v2.2.1  publish.yml  v2.2.1  push   8204  2m31s    29d
        ✓       v2.2.0  publish.yml  v2.2.0  push   8077  2m29s    36d
    - match: "gh run list --workflow release.yml --limit 2"
      output: |
        STATUS  TITLE            WORKFLOW     BRANCH  EVENT              ID    ELAPSED  AGE
        ✓       Release v2.4.0   release.yml  main    workflow_dispatch  8790  48s      2h
        ✓       Release v2.3.0   release.yml  main    workflow_dispatch  8517  51s      16d
    - match: "git ls-remote --tags origin 'v2.4*'"
      evidence: tag-exists
      output: |
        9c41e7a2b8f0d3c6e5a1b4f7d2c8e9a0b3f6d1c4	refs/tags/v2.4.0
    - match: "git log --oneline -3 -- .github/workflows"
      output: |
        b7d1e04 ci: build macOS and Windows binaries too (matrix)
        a2c93f8 ci: release.yml pushes the tag itself instead of a maintainer
        5e8f1aa ci: upgrade to upload-artifact@v4

files:
  - path: ".github/workflows/release.yml (excerpt)"
    evidence: tag-by-token
    language: yaml
    content: |
      permissions:
        contents: write
      jobs:
        release:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4          # default credentials: GITHUB_TOKEN
            - run: ./scripts/bump-version.sh "${{ inputs.version }}"
            - run: |
                git commit -am "release v${{ inputs.version }}"
                git tag "v${{ inputs.version }}"
                git push origin main "v${{ inputs.version }}"
  - path: ".github/workflows/publish.yml (excerpt)"
    evidence: checkout-default
    language: yaml
    content: |
      on:
        push:
          tags: ['v*']
        workflow_dispatch:
          inputs:
            tag: { required: true }
      jobs:
        build:
          steps:
            - uses: actions/checkout@v4     # no ref: builds github.sha
              # tag push:          github.sha is the tagged commit
              # workflow_dispatch: github.sha is the head of the branch or tag you dispatch on
  - path: "Annotations on recent runs"
    evidence: node-warnings
    content: |
      Warning: Node.js 20 actions are deprecated. The following actions are running on Node.js 20 and may not work as expected: ... (every run since 09-29, all workflows, all green)

hypotheses:
  - id: github-token
    text: "Since this release, release.yml pushes the tag itself with the GITHUB_TOKEN, and events made with the GITHUB_TOKEN don't start new workflow runs, so the tag push never triggered publish.yml."
    correct: true
  - id: node-warning
    text: "The Node.js deprecation warnings mean actions are failing."
    feedback: "They're warnings on every run since 09-29, and those runs are green, including release.yml today. publish.yml didn't fail: it never started."
  - id: tag-filter
    text: "publish.yml's tag filter doesn't match v2.4.0."
    feedback: "v* has matched every release so far, and the tag is on the remote. What changed is who pushed it: a maintainer used to, now the workflow does."
  - id: actions-outage
    text: "GitHub Actions had an outage this morning."
    feedback: "release.yml ran fine 2 hours ago. The publish run is missing, not failed or queued."

actions:
  - id: dispatch-main
    label: "gh workflow run publish.yml -f tag=v2.4.0 (dispatched on main, no --ref)"
    kind: wrong
    match_regex: "^gh workflow run publish\\.yml (?:-f|-F|--field|--raw-field)[ =][\"']?tag=v2\\.4\\.0[\"']?$"
    feedback: "A dispatch runs on main unless you give --ref, and publish.yml's checkout has no ref, so it builds whatever main is now, not the commit that was signed off and tagged. A release must be built from its tag: dispatch with --ref v2.4.0."
  - id: dispatch-tag
    label: "Start publish.yml from the tag itself: gh workflow run publish.yml --ref v2.4.0 -f tag=v2.4.0"
    kind: fix
    match_regex: "^gh workflow run publish\\.yml (?:(?:-r|--ref)[ =][\"']?(?:refs/tags/)?v2\\.4\\.0[\"']? (?:-f|-F|--field|--raw-field)[ =][\"']?tag=v2\\.4\\.0[\"']?|(?:-f|-F|--field|--raw-field)[ =][\"']?tag=v2\\.4\\.0[\"']? (?:-r|--ref)[ =][\"']?(?:refs/tags/)?v2\\.4\\.0[\"']?)$"
    feedback: "workflow_dispatch always creates a run, and dispatching on the tag ref means the build checks out the tagged commit, the one that was signed off. That publishes v2.4.0; it does not stop v2.5.0 breaking the same way (the durable fix is still to do)."
  - id: app-token
    label: "Change release.yml to push the tag with a short-lived GitHub App installation token (contents: write only, minted per run with actions/create-github-app-token), and pass inputs.version through an env var instead of interpolating it into the script"
    kind: fix
    feedback: "A tag pushed with an App installation token is not the GITHUB_TOKEN, so it starts publish.yml like a maintainer's push. The token is scoped to this repo with contents: write, expires in an hour, and isn't tied to a person. Passing the input through env: closes the script-injection hole in run: \"${{ inputs.version }}\"."
  - id: workflow-call
    label: "Change release.yml to call publish.yml directly (workflow_call, passing the tag), so no tag-push event is needed and no extra credential exists"
    kind: fix
    feedback: "The release workflow calls the publish workflow itself, so nothing depends on a tag-push event. No App, key or PAT to manage, and the called workflow runs with permissions you grant it. Check that publish.yml checks out the tag (ref: inputs.tag)."
  - id: release-pat
    label: "Store a personal access token (repo scope) as a secret and push the tag with it"
    kind: wrong
    feedback: "It triggers publish, but a PAT is long-lived, broader than needed (every repo the person can write to), and tied to one person's account: when they leave or rotate it, releases break again. Use a scoped, short-lived App token or workflow_call."
  - id: retag-laptop
    label: "Delete the tag and push it again from your laptop"
    kind: wrong
    feedback: "It would trigger publish this once (your push isn't the GITHUB_TOKEN), but release.yml still pushes with the token, so v2.5.0 breaks the same way. And deleting a published tag is something to avoid."
  - id: actions-write
    label: "Add actions: write to release.yml's permissions"
    kind: wrong
    feedback: "Permissions change what the token may do, not the rule that its events don't start workflow runs."

solution_paths:
  - [dispatch-tag, app-token]
  - [dispatch-tag, workflow-call]

key_evidence: [no-publish-run, tag-exists, tag-by-token, checkout-default]

evidence_labels:
  no-publish-run: "publish.yml has no run for v2.4.0"
  tag-exists: "The v2.4.0 tag is on the remote"
  tag-by-token: "release.yml now pushes the tag with the default GITHUB_TOKEN"
  checkout-default: "publish.yml checks out github.sha, so a dispatch must run on the tag ref to build the tag"

red_herrings:
  - evidence: node-warnings
    label: "Yellow warnings on every run"
    why: "A Node.js runtime deprecation notice for actions, on every workflow since 09-29, including green ones. publish.yml didn't fail with a warning; it never ran."

hints:
  nudge: "Did publish.yml fail, or never start?"
  direction: "It never started for v2.4.0. Who pushed that tag, and what does GitHub do with events made by the GITHUB_TOKEN?"
  answer: "Tags pushed with the GITHUB_TOKEN don't trigger workflows. Dispatch publish.yml on the v2.4.0 ref (--ref v2.4.0) now so it builds the tag, then change release.yml to push with a scoped App token or call publish.yml via workflow_call."

analogy:
  title: "The robot rang its own doorbell"
  text: |
    The release robot now rings the doorbell itself, and the house is set
    to ignore the robot's own rings, so the packer never comes. Call the
    packer directly and the boxes get packed, but each packer puts their
    box on the same shelf spot, pushing the last one off, so only one box
    ships. Then someone has to finish the half-filled delivery that's
    already on customers' doorsteps.

debrief:
  root_cause: |
    Until v2.3.0 a maintainer pushed release tags. Commit a2c93f8 had
    release.yml push the tag itself with actions/checkout's default
    credentials, the GITHUB_TOKEN, and events made with the GITHUB_TOKEN
    don't create new workflow runs (to stop workflows triggering each
    other in loops). So the v2.4.0 tag push never started publish.yml.
  ideal_path:
    - "Look for publish.yml's run for v2.4.0: there isn't one."
    - "Confirm the tag exists on the remote."
    - "See who pushed it: release.yml, with the GITHUB_TOKEN, since this release."
    - "Dispatch publish.yml on the tag ref (--ref v2.4.0), so the build is the tagged commit."
    - "Move release.yml to a scoped, short-lived App token, or call publish.yml with workflow_call; pass inputs through env."
  real_world: |
    workflow_dispatch and repository_dispatch are the exceptions: they
    always create runs. Many release setups call the publish workflow
    directly (workflow_call) from the release workflow instead of relying
    on a tag-push event, which needs no extra credential at all. If you do
    use an App token, give the App only contents: write on this repo and
    mint a token per run (actions/create-github-app-token); never a PAT.
    Dispatch on the tag ref, not main, so a release is always built from
    the commit that was tagged. And never interpolate ${{ inputs.* }} into
    a run: script; pass it through env: to avoid script injection. The
    Node 20 deprecation warnings are not the cause, but plan the action
    version bumps before the runner default changes.

concepts:
  - term: "GITHUB_TOKEN and triggering workflows"
    text: "Events caused by the GITHUB_TOKEN don't create new workflow runs, except workflow_dispatch and repository_dispatch; use a GitHub App token or PAT when they must."
    url: "https://docs.github.com/en/actions/concepts/security/github_token"
  - term: "Artifacts in v4"
    text: "upload-artifact@v4 artifacts are immutable: uploading the same name twice fails, and overwrite: true deletes the previous artifact. Matrix jobs need unique names."
    url: "https://github.com/actions/upload-artifact"
  - term: "Downloading many artifacts"
    text: "download-artifact's pattern selects artifacts by glob, and merge-multiple: true puts their files in one directory."
    url: "https://github.com/actions/download-artifact"
  - term: "Release assets"
    text: "gh release upload attaches files to an existing release; --clobber replaces assets of the same name."
    url: "https://cli.github.com/manual/gh_release_upload"

sources:
  - title: "GitHub Docs: GITHUB_TOKEN (events don't trigger new workflow runs)"
    url: "https://docs.github.com/en/actions/concepts/security/github_token"
    retrieved: 2026-10-02
  - title: "actions/upload-artifact: v4 immutability, overwrite, matrix naming"
    url: "https://github.com/actions/upload-artifact"
    retrieved: 2026-10-02
  - title: "actions/download-artifact: pattern and merge-multiple"
    url: "https://github.com/actions/download-artifact"
    retrieved: 2026-10-02
  - title: "GitHub CLI: gh release upload (--clobber)"
    url: "https://cli.github.com/manual/gh_release_upload"
    retrieved: 2026-10-02

stages:
  - id: one-binary
    update: |
      11:20: publish.yml ran for v2.4.0 and went green in 6 minutes. Linux
      installs work. macOS and Windows installs still 404.
    diagram_status: { publish: ok, gh: degraded }
    terminal:
      commands:
        - match: "gh release view v2.4.0 --json assets --jq '.assets[].name'"
          when_actions: [upload-binaries, upload-sums]
          output: |
            SHA256SUMS
            acmectl-darwin-arm64.tar.gz
            acmectl-linux-amd64.tar.gz
            acmectl-windows-amd64.zip
        - match: "gh release view v2.4.0 --json assets --jq '.assets[].name'"
          when_actions: [upload-darwin, upload-windows, upload-sums]
          output: |
            SHA256SUMS
            acmectl-darwin-arm64.tar.gz
            acmectl-linux-amd64.tar.gz
            acmectl-windows-amd64.zip
        - match: "gh release view v2.4.0 --json assets --jq '.assets[].name'"
          evidence: linux-only
          output: |
            SHA256SUMS
            acmectl-linux-amd64.tar.gz
        - match: "gh run view --log | grep -i 'artifact'"
          when_actions: [unique-names]
          output: |
            build (macos-14)        Upload dist      Uploaded artifact 'dist-macos-14' (acmectl-darwin-arm64.tar.gz)
            build (windows-2022)    Upload dist      Uploaded artifact 'dist-windows-2022' (acmectl-windows-amd64.zip)
            build (ubuntu-24.04)    Upload dist      Uploaded artifact 'dist-ubuntu-24.04' (acmectl-linux-amd64.tar.gz)
            publish (dry run)       Download dist    pattern dist-*, merge-multiple: 3 artifacts, 3 files in dist/
        - match: "gh run view --log | grep -i 'artifact'"
          evidence: overwrite-log
          output: |
            build (macos-14)        Upload dist      Uploaded artifact 'dist' (acmectl-darwin-arm64.tar.gz) at 11:15:58
            build (windows-2022)    Upload dist      overwrite: true, deleted existing artifact 'dist'; uploaded 'dist' (acmectl-windows-amd64.zip) at 11:16:40
            build (ubuntu-24.04)    Upload dist      overwrite: true, deleted existing artifact 'dist'; uploaded 'dist' (acmectl-linux-amd64.tar.gz) at 11:17:02
            publish                 Download dist    Downloaded artifact 'dist': 1 file
    files:
      - path: ".github/workflows/publish.yml (excerpt)"
        evidence: same-name
        language: yaml
        content: |
          build:
            strategy:
              matrix:
                os: [ubuntu-24.04, macos-14, windows-2022]
            runs-on: ${{ matrix.os }}
            steps:
              - run: make dist
              - uses: actions/upload-artifact@v4
                with:
                  name: dist
                  path: dist/
                  overwrite: true   # added in b7d1e04: "fix 409 Conflict on matrix upload"
          publish:
            needs: build
            steps:
              - uses: actions/download-artifact@v4
                with: { name: dist, path: dist/ }
              - run: gh release create "$TAG" dist/* --generate-notes
    hypotheses:
      - id: overwrite
        text: "All three matrix jobs upload an artifact called dist with overwrite: true, so each deletes the previous one and only the last to finish (Linux) reaches the publish job."
        correct: true
      - id: macos-build
        text: "The macOS and Windows builds failed."
        feedback: "All three build jobs succeeded and uploaded. Their artifacts were deleted by the next job's upload."
      - id: release-limit
        text: "GitHub limits how many assets a release can have."
        feedback: "Two assets is nowhere near any limit. Only one binary ever reached the publish job: \"Downloaded artifact 'dist': 1 file\"."
    actions:
      - id: unique-names
        label: "Name each matrix upload dist-${{ matrix.os }} without overwrite, and download with pattern: dist-* and merge-multiple: true; check out ref: ${{ inputs.tag }} so any dispatch builds the tag"
        kind: fix
        feedback: "Each job's binary is its own immutable artifact, and the publish job collects all three into dist/."
      - id: max-parallel
        label: "Set max-parallel: 1 on the matrix so uploads don't collide"
        kind: wrong
        feedback: "They'd run one after another, and overwrite: true would still delete each previous dist: you'd still publish only the last one."
      - id: drop-overwrite
        label: "Remove overwrite: true and keep the name dist"
        kind: wrong
        feedback: "Then the second job's upload fails with a 409 Conflict: v4 artifacts are immutable. That's what overwrite was added to silence. The names need to differ."
    solution_paths:
      - [unique-names]
    key_evidence: [linux-only, overwrite-log, same-name]
    evidence_labels:
      linux-only: "The release has only the Linux binary"
      overwrite-log: "Each matrix job deleted the previous dist; publish downloaded 1 file"
      same-name: "All three jobs upload to the name dist with overwrite: true"
    hints:
      nudge: "Three builds succeeded. How many files reached the publish job?"
      direction: "Read the upload steps in the run log and the artifact names in publish.yml."
      answer: "They all upload dist with overwrite: true. Use unique names per OS and download with pattern + merge-multiple."
    debrief:
      root_cause: |
        Commit b7d1e04 turned the single Linux build into a three-OS matrix.
        upload-artifact@v4 artifacts are immutable, so the second upload to
        dist failed with a 409 Conflict; the fix chosen was overwrite: true,
        which deletes the existing artifact and uploads a new one. Each job
        replaced the last, and the publish job downloaded only the final
        one: Linux.
      ideal_path:
        - "List the release's assets: Linux only."
        - "Read the run log: each upload deleted the previous dist; publish got 1 file."
        - "Read publish.yml: same name, overwrite: true."
        - "Name per OS, download with pattern + merge-multiple."

  - id: patch-release
    update: |
      11:40: the workflow is fixed for the next release. But v2.4.0 is the
      Latest release, the install script points every macOS and Windows
      user at it, and the keynote is at 14:00.
    diagram_status: { matrix: ok }
    terminal:
      commands:
        - match: "curl -s -o /dev/null -w '%{http_code}\\n' -L https://github.com/acme/acmectl/releases/latest/download/acmectl-darwin-arm64.tar.gz"
          when_actions: [upload-binaries]
          output: |
            200
        - match: "curl -s -o /dev/null -w '%{http_code}\\n' -L https://github.com/acme/acmectl/releases/latest/download/acmectl-darwin-arm64.tar.gz"
          when_actions: [upload-darwin]
          output: |
            200
        - match: "curl -s -o /dev/null -w '%{http_code}\\n' -L https://github.com/acme/acmectl/releases/latest/download/acmectl-darwin-arm64.tar.gz"
          evidence: latest-404
          output: |
            404
        - match: "gh release download v2.4.0 -p SHA256SUMS -O -"
          when_actions: [upload-sums]
          output: |
            1b9e...c04a  acmectl-darwin-arm64.tar.gz
            7f3a...9e21  acmectl-linux-amd64.tar.gz
            d4c8...51b7  acmectl-windows-amd64.zip
        - match: "gh release download v2.4.0 -p SHA256SUMS -O -"
          evidence: sums-one
          output: |
            7f3a...9e21  acmectl-linux-amd64.tar.gz
    hypotheses:
      - id: upload
        text: "Build the three binaries from the v2.4.0 tag with the fixed workflow and attach the missing ones, plus a complete SHA256SUMS, to the existing release."
        correct: true
      - id: retag
        text: "Delete the v2.4.0 release and tag and publish it again."
        feedback: "Linux users have already installed v2.4.0 and checked it against SHA256SUMS; tags and releases are meant to stay put once published. Add the missing assets to the release that exists."
      - id: previous-latest
        text: "Mark v2.3.0 as Latest until next week."
        feedback: "macOS and Windows users would get the old version on announcement day, and v2.4.0 stays broken."
    actions:
      - id: clobber-linux
        label: "gh release upload v2.4.0 ... acmectl-linux-amd64.tar.gz ... --clobber (replace the Linux binary too)"
        kind: destructive
        match_regex: "^gh release upload (?=.*\\bv2\\.4\\.0\\b)(?=.*acmectl-linux-amd64)(?=.*--clobber)"
        feedback: "Linux users already installed that binary and checked it against the SHA256SUMS you published. A rebuild is not byte-identical, so replacing it breaks their checksums and your provenance. Leave published binaries alone; the new SHA256SUMS must keep the original Linux hash."
      - id: clobber-binaries
        label: "gh release upload v2.4.0 <binaries> SHA256SUMS --clobber (one command for everything)"
        kind: wrong
        match_regex: "^gh release upload (?=.*\\bv2\\.4\\.0\\b)(?=.*--clobber)(?=.*acmectl-)"
        feedback: "--clobber replaces assets of the same name, so a typo or a stray file silently overwrites something users have verified. The binaries are new names: upload them without --clobber. Only SHA256SUMS, which exists and must change, gets --clobber, in its own command."
      - id: upload-binaries
        label: "Build the three binaries from the v2.4.0 tag with the fixed publish.yml (run it from main with tag=v2.4.0; its checkout uses ref: inputs.tag), then attach only the new ones, without --clobber: gh release upload v2.4.0 acmectl-darwin-arm64.tar.gz acmectl-windows-amd64.zip (or one command per file)"
        kind: fix
        match_regex: "^gh release upload (?:(?:-R|--repo)[ =]acme/acmectl )?(?:v2\\.4\\.0|refs/tags/v2\\.4\\.0) (?:(?:-R|--repo)[ =]acme/acmectl )?(?:[\\\"']?(?:\\./)?(?:dist/)?acmectl-darwin-arm64\\.tar\\.gz[\\\"']? [\\\"']?(?:\\./)?(?:dist/)?acmectl-windows-amd64\\.zip[\\\"']?|[\\\"']?(?:\\./)?(?:dist/)?acmectl-windows-amd64\\.zip[\\\"']? [\\\"']?(?:\\./)?(?:dist/)?acmectl-darwin-arm64\\.tar\\.gz[\\\"']?)(?: (?:-R|--repo)[ =]acme/acmectl)?$"
        feedback: "The two missing binaries, built from the tag, are attached as new assets. Without --clobber, the command would refuse to replace anything that already exists, so the Linux binary and the tag are untouched."
      - id: upload-darwin
        label: "Attach the macOS binary on its own, without --clobber: gh release upload v2.4.0 acmectl-darwin-arm64.tar.gz"
        kind: fix
        match_regex: "^gh release upload (?:(?:-R|--repo)[ =]acme/acmectl )?(?:v2\\.4\\.0|refs/tags/v2\\.4\\.0) (?:(?:-R|--repo)[ =]acme/acmectl )?[\\\"']?(?:\\./)?(?:dist/)?acmectl-darwin-arm64\\.tar\\.gz[\\\"']?(?: (?:-R|--repo)[ =]acme/acmectl)?$"
        feedback: "The macOS binary, built from the tag, is attached as a new asset. Nothing existing is replaced. Windows still needs attaching."
      - id: upload-windows
        label: "Attach the Windows binary on its own, without --clobber: gh release upload v2.4.0 acmectl-windows-amd64.zip"
        kind: fix
        match_regex: "^gh release upload (?:(?:-R|--repo)[ =]acme/acmectl )?(?:v2\\.4\\.0|refs/tags/v2\\.4\\.0) (?:(?:-R|--repo)[ =]acme/acmectl )?[\\\"']?(?:\\./)?(?:dist/)?acmectl-windows-amd64\\.zip[\\\"']?(?: (?:-R|--repo)[ =]acme/acmectl)?$"
        feedback: "The Windows binary, built from the tag, is attached as a new asset. Nothing existing is replaced. macOS still needs attaching."
      - id: upload-sums
        label: "Write a SHA256SUMS that keeps the existing Linux hash and adds the two new binaries, then replace only that file: gh release upload v2.4.0 SHA256SUMS --clobber"
        kind: fix
        match_regex: "^gh release upload (?:(?:-R|--repo)[ =]acme/acmectl )?(?:v2\\.4\\.0|refs/tags/v2\\.4\\.0) (?:(?:-R|--repo)[ =]acme/acmectl )?(?:[\\\"']?(?:\\./)?(?:dist/)?SHA256SUMS[\\\"']? --clobber|--clobber [\\\"']?(?:\\./)?(?:dist/)?SHA256SUMS[\\\"']?)(?: (?:-R|--repo)[ =]acme/acmectl)?$"
