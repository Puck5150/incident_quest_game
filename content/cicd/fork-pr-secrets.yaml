# yaml-language-server: $schema=../../schemas/incident.json
id: fork-pr-secrets
track: cicd
difficulty: 2
title: "Contributors' pull requests always fail; ours always pass"
par_minutes: 10

ticket:
  from: "Open source maintainers"
  priority: P3
  body: |
    Our SDK is open source. Every pull request from an outside contributor
    fails CI at the "integration tests" job, even one-line typo fixes, while
    our own branches pass. A contributor asked if we're doing it on purpose.

environment: |
  shop-sdk is a public GitHub repository. Contributors open pull requests from
  their own forks; maintainers push branches to the main repository. The CI
  workflow runs on pull_request. Its integration-test job calls the staging
  API with an API key stored as the repository secret STAGING_API_KEY.

terminal:
  prompt: "you@laptop:~/shop-sdk$"
  commands:
    - match: "gh run list --workflow ci.yml --limit 4"
      when_actions: [skip-for-forks]
      output: |
        STATUS  TITLE                    WORKFLOW  BRANCH             EVENT         ID    ELAPSED
        ✓       Fix typo in README       CI        patch-1            pull_request  5541  1m02s
        ✓       Add retry to client      CI        feat/retry         pull_request  5539  3m48s
        ✓       Support Node 22          CI        node22             pull_request  5536  1m05s
        ✓       Bump version             CI        release/1.9        pull_request  5530  3m51s
    - match: "gh run list --workflow ci.yml --limit 4"
      evidence: fork-pattern
      output: |
        STATUS  TITLE                    WORKFLOW  BRANCH             EVENT         ID    ELAPSED
        X       Fix typo in README       CI        patch-1            pull_request  5520  1m31s
        ✓       Add retry to client      CI        feat/retry         pull_request  5518  3m47s
        X       Support Node 22          CI        node22             pull_request  5516  1m29s
        ✓       Bump version             CI        release/1.9        pull_request  5512  3m50s
    - match: "gh pr list --state all --limit 4 --json number,title,headRepositoryOwner --jq '.[] | \"\\(.number) \\(.headRepositoryOwner.login) \\(.title)\"'"
      evidence: from-forks
      output: |
        402 jpark-dev Fix typo in README
        401 example-shop Add retry to client
        400 m-osei Support Node 22
        399 example-shop Bump version
    - match: "gh run view 5520 --log-failed"
      evidence: empty-key
      output: |
        integration	Run integration tests	Error: STAGING_API_KEY is empty
        integration	Run integration tests	401 Unauthorized from https://staging-api.example.com/v1/catalog

files:
  - path: ".github/workflows/ci.yml (excerpt)"
    evidence: uses-secret
    content: |
      on:
        pull_request:

      jobs:
        unit:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6
            - run: npm ci && npm test
        integration:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6
            - run: npm ci && npm run test:integration
              env:
                STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}

hypotheses:
  - id: no-secrets-forks
    text: "GitHub doesn't pass secrets to workflows triggered from forks, so for contributors STAGING_API_KEY is empty and the integration tests fail."
    correct: true
  - id: contributor-code
    text: "Contributors' changes break the integration tests."
    feedback: "A README typo fix fails the same way, with \"STAGING_API_KEY is empty\" and a 401. It's the key, not the code."
  - id: expired-key
    text: "The staging API key expired."
    feedback: "Maintainers' runs pass with the same key on the same day. Only fork runs fail, and there the key is empty, not rejected."
  - id: runner
    text: "Fork pull requests run on different, broken runners."
    feedback: "They use the same ubuntu-latest runners; the unit tests pass. Only the job needing the secret fails."

actions:
  - id: skip-for-forks
    label: "Run the integration job only when the pull request comes from this repository (if: github.event.pull_request.head.repo.full_name == github.repository); maintainers run it for contributors' PRs after review"
    kind: fix
    feedback: "Contributors get the unit tests on every push, the job that needs the key is skipped for forks, and nothing secret is exposed to code from outside."
  - id: pull-request-target
    label: "Switch the workflow to pull_request_target so fork runs get secrets, and check out the contributor's code"
    kind: destructive
    feedback: "That runs untrusted code from any fork with your secrets available: a well-known way to have keys stolen. GitHub warns against exactly this combination."
  - id: hardcode-key
    label: "Put the staging API key directly in the workflow file"
    kind: destructive
    feedback: "The repository is public: the key is now published to everyone, forever, in the git history."
  - id: rerun
    label: "Re-run the failed jobs"
    kind: wrong
    feedback: "The re-run is still triggered from the fork, so the secret is still withheld."

solution_paths:
  - [skip-for-forks]

key_evidence: [fork-pattern, from-forks, empty-key, uses-secret]

evidence_labels:
  fork-pattern: "Contributors' runs fail; maintainers' pass"
  from-forks: "The failing pull requests come from forks"
  empty-key: "In those runs STAGING_API_KEY is empty, and the API answers 401"
  uses-secret: "The integration job reads the key from a repository secret"

hints:
  nudge: "What do the failing pull requests have in common that the passing ones don't?"
  direction: "Check where each pull request comes from, then what the failing job needs that a fork might not get."
  answer: "Secrets aren't passed to workflows from forks. Skip the secret-dependent job for forks and run it for contributors after review."

analogy:
  title: "Visitors don't get the office keys"
  text: |
    Staff can test the new lock with their own keys. Visitors bringing in a
    replacement lock aren't given office keys, quite rightly, so their test
    always fails. Let visitors run the tests that don't need keys, and have
    staff run the rest once they've looked at the lock.

debrief:
  root_cause: |
    With the exception of GITHUB_TOKEN, GitHub doesn't pass secrets to a
    workflow triggered from a forked repository, because the fork's code is
    untrusted. Maintainers' branches live in the repository, so their runs
    get STAGING_API_KEY; contributors' pull requests come from forks, so the
    key was empty, the staging API answered 401, and the integration job
    failed every time.
  ideal_path:
    - "Spot the pattern: contributors fail, maintainers pass."
    - "Confirm the failing PRs come from forks."
    - "Read the failed log: STAGING_API_KEY is empty."
    - "Skip the secret-dependent job for forks; run it for contributors after review."
  real_world: |
    Public repositories should split CI into jobs that need no secrets
    (run for everyone) and jobs that do (run only for trusted code). Avoid
    pull_request_target with checkout of contributor code; if you need it,
    follow GitHub's secure-use guidance closely.

concepts:
  - term: "Repository secrets"
    text: "Encrypted values a workflow can read as secrets.NAME, available to workflows triggered within the repository."
    url: "https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions"
  - term: "Forked repository"
    text: "A contributor's copy of the repository. Pull requests from it run your workflow against code you haven't reviewed yet."
    url: "https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows"

sources:
  - title: "GitHub Actions: Events that trigger workflows (pull_request from forks: no secrets, read-only GITHUB_TOKEN)"
    url: "https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows"
    retrieved: 2026-10-02
  - title: "GitHub Actions: Using secrets in GitHub Actions"
    url: "https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions"
    retrieved: 2026-10-02
  - title: "GitHub Actions: Security hardening (pull_request_target risks)"
    url: "https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions"
    retrieved: 2026-10-02
