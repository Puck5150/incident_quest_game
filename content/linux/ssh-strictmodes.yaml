# yaml-language-server: $schema=../../schemas/incident.json
id: ssh-strictmodes
track: linux
difficulty: 2
title: "Deploys stopped: the deploy key is suddenly refused"
par_minutes: 10

ticket:
  from: "Release engineering"
  severity: SEV3
  body: |
    Since lunchtime every deploy to app-03 fails at the SSH step with
    "Permission denied (publickey)". Same key, same user (deploy) as
    yesterday, and the other app servers accept it fine. Someone was
    "fixing permissions" on app-03 this morning.

environment: |
  app-03 runs Ubuntu with OpenSSH's sshd at its default settings. The
  deploy pipeline signs in as deploy with an SSH key listed in
  /home/deploy/.ssh/authorized_keys. Password sign-in is disabled. The
  deploy-agent service on app-03 also runs as deploy and needs somewhere
  writable for its upload scratch files (it used to point at /home/deploy).

terminal:
  prompt: "admin@app-03:~$"
  files:
    - path: /home/deploy/.ssh/authorized_keys
      content: |
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK3vY1pQe8m2R0aJxW9tL4nBcD7fH6sQ2uV5wZ8yX1rE deploy@pipeline
  commands:
    - match: "ls -ld /home/deploy /home/deploy/.ssh /home/deploy/.ssh/authorized_keys"
      when_actions: [fix-home]
      output: |
        drwxr-xr-x 6 deploy deploy 4096 Oct  2 12:41 /home/deploy
        drwx------ 2 deploy deploy 4096 Sep  1 08:10 /home/deploy/.ssh
        -rw------- 1 deploy deploy  398 Sep  1 08:10 /home/deploy/.ssh/authorized_keys
    - match: "ls -ld /home/deploy /home/deploy/.ssh /home/deploy/.ssh/authorized_keys"
      evidence: home-777
      output: |
        drwxrwxrwx 6 deploy deploy 4096 Oct  2 11:58 /home/deploy
        drwx------ 2 deploy deploy 4096 Sep  1 08:10 /home/deploy/.ssh
        -rw------- 1 deploy deploy  398 Sep  1 08:10 /home/deploy/.ssh/authorized_keys
    - match: "ls -ld /var/lib/deploy-agent/tmp"
      when_actions: [app-tempdir]
      output: |
        drwx------ 2 deploy deploy 4096 Oct  2 12:55 /var/lib/deploy-agent/tmp
    - match: "ls -ld /var/lib/deploy-agent/tmp"
      output: |
        ls: cannot access '/var/lib/deploy-agent/tmp': No such file or directory
    - match: "sudo sshd -T | grep -i strictmodes"
      evidence: strictmodes-yes
      output: |
        strictmodes yes
    - match: "sudo grep -c deploy@pipeline /home/deploy/.ssh/authorized_keys"
      output: |
        1


    - match: "sudo tail -n 2 /var/log/auth.log"
      when_actions: [fix-home]
      output: |
        Oct  2 12:52:40 app-03 sshd[48960]: Accepted publickey for deploy from 198.51.100.40 port 50611 ssh2: ED25519 SHA256:r4Wq...
        Oct  2 12:52:40 app-03 sshd[48960]: pam_unix(sshd:session): session opened for user deploy(uid=1002) by deploy(uid=0)
    - match: "sudo tail -n 2 /var/log/auth.log"
      output: |
        Oct  2 12:03:17 app-03 sshd[48211]: Authentication refused: bad ownership or modes for directory /home/deploy
        Oct  2 12:03:17 app-03 sshd[48211]: Connection closed by authenticating user deploy 198.51.100.40 port 50532 [preauth]
logs:
  - name: "/var/log/auth.log (sshd)"
    evidence: bad-modes
    lines: |
      Oct  2 12:03:17 app-03 sshd[48211]: Authentication refused: bad ownership or modes for directory /home/deploy
      Oct  2 12:03:17 app-03 sshd[48211]: Connection closed by authenticating user deploy 198.51.100.40 port 50532 [preauth]
  - name: "admin shell history (this morning)"
    lines: |
      sudo chmod 777 /home/deploy   # app couldn't write its upload temp dir

hypotheses:
  - id: home-writable
    text: "/home/deploy was made world-writable, so sshd refuses to trust the authorized_keys under it."
    correct: true
  - id: key-removed
    text: "The deploy key was removed from authorized_keys."
    feedback: "The key's still in the file. sshd refused to use the file at all: \"bad ownership or modes for directory /home/deploy\"."
  - id: key-perms
    text: "authorized_keys has the wrong permissions."
    feedback: "authorized_keys is -rw------- and .ssh is drwx------, both fine. The log names the home directory itself."
  - id: password-off
    text: "Password sign-in being disabled is blocking the deploy."
    feedback: "The pipeline uses a key, not a password, and password sign-in was disabled yesterday too."

actions:
  - id: fix-home
    label: "sudo chmod 755 /home/deploy"
    kind: fix
    match_regex: "^(sudo )?chmod (755|750|700|go-w|g-w,o-w|o-w,g-w) /home/deploy/?$"
    feedback: "Only deploy can write to its home directory again, so sshd trusts the keys file and the deploy key works. That alone leaves the reason it was opened unsolved: the app still has no scratch directory, and the next admin will chmod 777 again."
  - id: app-tempdir
    label: "sudo install -d -o deploy -g deploy -m 700 /var/lib/deploy-agent/tmp"
    kind: fix
    # install -d with -o deploy, -m 700|750 (optionally -g deploy), each flag once in any order, exactly this path.
    match_regex: "^(sudo )?install -d (?=.*-o deploy )(?=.*-m )(?!.*(-o .*-o |-m .*-m |-g .*-g ))((-o deploy|-g deploy|-m 0?7[05]0) ){2,3}/var/lib/deploy-agent/tmp/?$"
    feedback: "A dedicated directory owned by deploy, mode 700, outside the home directory: the app gets the write access it needed, nobody else does, and sshd's home-directory check is never involved."
  - id: point-app
    label: "Point deploy-agent at /var/lib/deploy-agent/tmp (systemd StateDirectory=deploy-agent or TMPDIR in its unit), restart it, and check an upload works"
    kind: fix
    feedback: "The directory only helps once the service uses it. systemd's StateDirectory= creates and owns /var/lib/deploy-agent for the service, and PrivateTmp= gives it its own /tmp, so no one has to touch the home directory's mode again."
  - id: tempdir-777
    label: "sudo chmod 777 /var/lib/deploy-agent/tmp"
    kind: wrong
    match_regex: "^(sudo )?chmod (-R )?(777|a\\+rwx|o\\+w|ugo\\+rwx) /var/lib/deploy-agent(/tmp)?/?$"
    feedback: "The same shortcut moved one directory down. The app runs as deploy, so it never needed world-write: owner deploy with mode 700 is enough."
  - id: strictmodes-no
    label: "Set StrictModes no in sshd_config and reload sshd"
    kind: destructive
    feedback: "Keys work again, for every account, even where anyone on the server could have swapped in their own key. The check exists for exactly this situation."
  - id: new-key
    label: "Generate a new key pair for the pipeline and add it to authorized_keys"
    kind: wrong
    feedback: "The new key sits in the same file sshd refuses to use, so it fails the same way."
  - id: enable-passwords
    label: "Turn on password sign-in for deploy"
    kind: wrong
    feedback: "That weakens sign-in for the server, and the pipeline has no password to use anyway."

solution_paths:
  - [fix-home, app-tempdir, point-app]

key_evidence: [bad-modes, home-777, strictmodes-yes]

evidence_labels:
  bad-modes: "sshd: Authentication refused: bad ownership or modes for directory /home/deploy"
  home-777: "/home/deploy is drwxrwxrwx: anyone can write to it"
  strictmodes-yes: "sshd checks file modes (StrictModes yes, the default)"

hints:
  nudge: "The key didn't change. Read sshd's own reason in the auth log."
  direction: "sshd checks who can write to the keys file and every folder above it. Look at the home directory's mode."
  answer: "/home/deploy was chmod 777. Make it 755 (no group or world write) and sshd will use authorized_keys again. Then fix why it was opened: create a dedicated directory the app owns (sudo install -d -o deploy -g deploy -m 700 /var/lib/deploy-agent/tmp) and point the service at it."

analogy:
  title: "A guest list on a public noticeboard"
  text: |
    The doorman lets in anyone whose name is on the guest list. This
    morning someone moved the list to a noticeboard anyone can write on.
    The doorman, quite rightly, stops trusting it. Put the list back
    somewhere only the host can change it.

debrief:
  root_cause: |
    This morning /home/deploy was made world-writable (chmod 777). With
    StrictModes on, the default, sshd refuses to use an authorized_keys file
    if the file, ~/.ssh or the home directory is writable by other users,
    because anyone could have replaced the keys. It logged "bad ownership or
    modes for directory /home/deploy" and the key was rejected.
  ideal_path:
    - "Read sshd's reason in the auth log: bad modes for /home/deploy."
    - "Check the modes along the path: the home directory is drwxrwxrwx."
    - "Remove group and world write from /home/deploy."
    - "Solve the original need: create /var/lib/deploy-agent/tmp owned by deploy, mode 700 (install -d), and point the service at it (StateDirectory=/TMPDIR), so nobody reaches for chmod 777 again."
    - "Run a deploy to confirm the key works."
  real_world: |
    "Permission denied (publickey)" from the client rarely says why; the
    server's auth log does. chmod 777 is almost never the right fix: give
    the app its own writable directory (systemd StateDirectory=, PrivateTmp=
    or an install -d owned by the service user) and keep home directories
    at 755 or 700. Config management that enforces the home mode stops the
    drift from coming back.

concepts:
  - term: "authorized_keys"
    text: "The list of public keys allowed to sign in as a user, in that user's ~/.ssh folder."
    url: "https://man.openbsd.org/sshd.8"
  - term: "StrictModes"
    text: "An sshd setting that checks the ownership and modes of a user's files and home directory before accepting a login."
    url: "https://man.openbsd.org/sshd_config.5"

sources:
  - title: "OpenSSH: sshd(8) (authorized_keys and writable home directories)"
    url: "https://man.openbsd.org/sshd.8"
    retrieved: 2026-10-02
  - title: "OpenSSH: sshd_config(5) (StrictModes)"
    url: "https://man.openbsd.org/sshd_config.5"
    retrieved: 2026-10-02
  - title: "Linux man-pages: chmod(1)"
    url: "https://man7.org/linux/man-pages/man1/chmod.1.html"
    retrieved: 2026-10-02
