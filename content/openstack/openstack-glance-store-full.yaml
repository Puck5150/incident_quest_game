# yaml-language-server: $schema=../../schemas/incident.json
id: openstack-glance-store-full
track: openstack
difficulty: 2
title: "Uploading the new hardened Ubuntu image fails, and the image is stuck"
par_minutes: 12

ticket:
  from: "Security engineering"
  severity: SEV3
  body: |
    We need the hardened Ubuntu 24.04 image in the cloud today for the audit.
    openstack image create fails with an HTTP 413 partway through, and the
    new image sits in the list as "killed". Retrying just does the same
    thing. Somebody suggested deleting files by hand to make room. The CI
    team says any ci-snap-* image older than 30 days is disposable.

environment: |
  Glance uses the file store on image-01: the images live under
  /var/lib/glance/images/ on a dedicated 100 GB volume, which is also the
  filesystem's only content. The CI project saves a snapshot image every
  night, named ci-snap-YYYYMMDD. The hardened image is a 6 GB qcow2.

diagram:
  nodes:
    - { id: client, label: "openstack image create", col: 0, row: 0, status: ok }
    - { id: glance, label: "glance-api", col: 1, row: 0, status: degraded }
    - { id: store, label: "/var/lib/glance/images (100 GB)", col: 2, row: 0, status: down }
  edges:
    - { from: client, to: glance }
    - { from: glance, to: store }

