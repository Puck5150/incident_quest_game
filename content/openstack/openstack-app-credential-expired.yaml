# yaml-language-server: $schema=../../schemas/incident.json
id: openstack-app-credential-expired
track: openstack
difficulty: 3
title: "The CI deploy job fails with HTTP 401 and nobody changed anything"
par_minutes: 20

ticket:
  from: "CI team lead"
  severity: SEV3
  body: |
    The deploy pipeline for the shop project started failing this morning
    with "The request you have made requires authentication. (HTTP 401)".
    Nobody changed the pipeline or the secret. It authenticates with an
    application credential called ci-deploy, which Bob created for it
    about three months ago. Please don't put a personal password or an
    admin account in the pipeline, security reviewed this setup.

environment: |
  You are the cloud operator with admin access. Bob is a team lead and holds
  two roles on the project shop: member and admin. The ci-deploy credential
  was created with only the member role, and the pipeline needs only to
  create and delete servers and volumes in shop. The secret is stored in the
  CI system's vault.

terminal:
  prompt: "ops@controller-01:~$"
  commands:
    - match: "openstack application credential list --user bob"
      when_actions: [rotate-credential]
      output: |
        +----------+--------------+------------+---------------------+
        | ID       | Name         | Project ID | Expires At          |
        +----------+--------------+------------+---------------------+
        | 6d9e...  | ci-deploy-2  | 3a7c...    | 2027-01-24T00:00:00 |
        +----------+--------------+------------+---------------------+
    - match: "openstack application credential list --user bob"
      evidence: expired
      output: |
        +----------+-----------+------------+---------------------+
        | ID       | Name      | Project ID | Expires At          |
        +----------+-----------+------------+---------------------+
        | 1b4f...  | ci-deploy | 3a7c...    | 2026-10-25T00:00:00 |
        +----------+-----------+------------+---------------------+

logs:
  - name: "CI pipeline, deploy job (today 07:02)"
    evidence: auth-401
    lines: |
      07:02:11 + openstack --os-auth-type v3applicationcredential token issue
      The request you have made requires authentication. (HTTP 401)
      07:02:11 ERROR: deploy failed (exit 1)

hypotheses:
  - id: credential-expired
    text: "ci-deploy was created with an expiry date of 25 October, and today is the 26th. Keystone rejects an expired application credential with a 401."
    correct: true
  - id: wrong-secret
    text: "The secret in the CI vault is wrong or was rotated."
    feedback: "Nobody changed it, and an expired credential fits the timing exactly: it worked until yesterday and stopped on the date in Expires At."
  - id: keystone-down
    text: "Keystone is down."
    feedback: "Keystone answered with a structured 401. Other users are logging in normally. A down service would time out or return a 5xx."
  - id: role-removed
    text: "Bob's role on the project was removed."
    feedback: "That does invalidate his application credentials, but Bob still holds member and admin on shop. The expiry date is the thing that has passed."

actions:
  - id: rotate-credential
    label: "openstack application credential create ci-deploy-2 --role member --expiration 2027-01-24T00:00:00 as Bob, put the new secret in the CI vault, then delete the expired ci-deploy"
    kind: fix
    feedback: "The new credential carries only the member role the pipeline needs, is restricted (it can't create more credentials), has a new expiry, and replaces the old one. The secret is shown once, so it goes straight into the vault."
  - id: omit-role
    label: "Create the new credential without --role"
    kind: wrong
    feedback: "With no --role, the credential gets all of Bob's roles on the project, including admin. A leaked pipeline secret would then be an admin credential."
  - id: unrestricted
    label: "Create the new credential with --unrestricted"
    kind: wrong
    feedback: "The docs warn that unrestricted credentials add risk: a compromised credential could create new ones and regenerate itself, outliving a revocation."
  - id: bobs-password
    label: "Put Bob's password in the pipeline"
    kind: wrong
    feedback: "That is the case the team lead ruled out. A personal password in CI has all of Bob's access, can't be limited to a role, and changing it later causes immediate downtime."
  - id: no-expiry
    label: "Create the credential with no expiration so this never happens again"
    kind: wrong
    feedback: "The docs recommend rotating credentials regularly. A credential that never expires turns a leak into a permanent hole."

solution_paths:
  - [rotate-credential]

key_evidence: [auth-401, expired]

evidence_labels:
  auth-401: "The pipeline gets HTTP 401 when authenticating"
  expired: "ci-deploy expired on 2026-10-25"

hints:
  nudge: "It worked until yesterday. What can stop working on a date?"
  direction: "List Bob's application credentials and read the Expires At column."
  answer: "ci-deploy expired on 25 October. Create a replacement with --role member and a new expiry, update the vault, and delete the old one."

analogy:
  title: "The visitor badge that expires at midnight"
  text: |
    The contractor's badge worked all quarter and the door reader rejects it
    this morning because it lapsed overnight. Nobody changed the door. The
    fix is a new badge with the same limited access, not the building
    manager's master key.

debrief:
  root_cause: |
    The ci-deploy application credential had an expiration date, which
    passed on 25 October. After that Keystone refuses it with a 401, even
    though the secret and the roles are unchanged.
  ideal_path:
    - "Read the 401 and note nothing else changed."
    - "List the credential: Expires At is yesterday."
    - "Create a replacement with only the member role and a new expiry."
    - "Update the vault, test, and delete the old credential."
  real_world: |
    Put credential expiry dates in the team calendar and rotate a few days
    ahead, creating the new credential and updating the app before deleting
    the old one so nothing goes down.

concepts:
  - term: "Application credential"
    text: "A secret for automation that belongs to a user, is scoped to a project, and can carry a subset of the user's roles and an expiry date."
    url: "https://docs.openstack.org/keystone/latest/user/application_credentials.html"
  - term: "Unrestricted credential"
    text: "An application credential that is allowed to create or delete other application credentials. By default they are restricted from doing so."
    url: "https://docs.openstack.org/keystone/latest/user/application_credentials.html"

sources:
  - title: "Keystone: application credentials (expiration, roles subset, unrestricted, rotation)"
    url: "https://docs.openstack.org/keystone/latest/user/application_credentials.html"
    retrieved: 2026-10-26
  - title: "OpenStack client: application credential create"
    url: "https://docs.openstack.org/python-openstackclient/latest/cli/command-objects/application-credentials.html"
    retrieved: 2026-10-26

stages:
  - id: owner-left
    update: |
      Nov 16 Reopened: ci-deploy-2 worked for three weeks and now returns
      the same 401. Bob moved to another team on Friday and the offboarding
      script removed his role assignments on the shop project. The expiry
      date on ci-deploy-2 is in January. The pipeline must not depend on one
      person's access again.
    terminal:
      commands:
        - match: "openstack application credential show ci-deploy-3 -c user_id -c roles -c expires_at"
          when_actions: [service-user-credential]
          output: |
            +------------+---------------------+
            | Field      | Value               |
            +------------+---------------------+
            | expires_at | 2027-02-15T00:00:00 |
            | roles      | member              |
            | user_id    | svc-ci (3f9a...)    |
            +------------+---------------------+
        - match: "openstack application credential show ci-deploy-2 -c user_id -c roles -c expires_at"
          evidence: owned-by-bob
          output: |
            +------------+---------------------+
            | Field      | Value               |
            +------------+---------------------+
            | expires_at | 2027-01-24T00:00:00 |
            | roles      | member              |
            | user_id    | bob (8e21...)       |
            +------------+---------------------+
        - match: "openstack role assignment list --user bob --project shop --names"
          evidence: bob-no-roles
          output: |
            +------+------+-------+---------+--------+--------+-----------+
            | Role | User | Group | Project | Domain | System | Inherited |
            +------+------+-------+---------+--------+--------+-----------+
            +------+------+-------+---------+--------+--------+-----------+
        - match: "openstack role assignment list --user svc-ci --project shop --names"
          when_actions: [service-user-credential]
          output: |
            +--------+--------------+-------+--------------+--------+--------+-----------+
            | Role   | User         | Group | Project      | Domain | System | Inherited |
            +--------+--------------+-------+--------------+--------+--------+-----------+
            | member | svc-ci@Default |     | shop@Default |        |        | False     |
            +--------+--------------+-------+--------------+--------+--------+-----------+
    logs:
      - name: "Keystone audit log (controller-01)"
        evidence: roles-removed
        lines: |
          2026-11-13 18:04:22 INFO keystone.identity: offboarding-script removed role assignment member for user bob on project shop
          2026-11-13 18:04:22 INFO keystone.identity: offboarding-script removed role assignment admin for user bob on project shop
    hypotheses:
      - id: owner-roles-gone
        text: "ci-deploy-2 is owned by Bob. Removing a user's role assignments on a project invalidates their application credentials for that project, so the offboarding script silently killed the pipeline's credential."
        correct: true
      - id: expired-again
        text: "The credential expired again."
        feedback: "ci-deploy-2 expires on 24 January, two months away. The date isn't the issue this time."
      - id: vault
        text: "The CI vault lost the secret."
        feedback: "The secret is intact, the same one that worked for three weeks. What changed is the user behind it."
    actions:
      - id: service-user-credential
        label: "Create a dedicated service user svc-ci with only member on shop, create the credential ci-deploy-3 as svc-ci (--role member, with an expiry), update the vault and delete ci-deploy-2"
        kind: fix
        feedback: "The credential now belongs to an account that exists for the pipeline, with exactly the role it needs. Nobody's job change can invalidate it, and rotating it later is a planned task."
      - id: regrant-bob
        label: "Give Bob back his member role on shop"
        kind: wrong
        feedback: "It works until the next change in Bob's job. It also gives access to someone who left the team, which is what the offboarding script was removing."
      - id: use-admin
        label: "Create the credential as the cloud admin user"
        kind: wrong
        feedback: "An admin application credential in CI carries far more access than a deploy pipeline needs, and ties it to another person's account."
    solution_paths:
      - [service-user-credential]
    key_evidence: [owned-by-bob, bob-no-roles, roles-removed]
    evidence_labels:
      owned-by-bob: "ci-deploy-2 belongs to Bob"
      bob-no-roles: "Bob has no role assignments on shop"
      roles-removed: "The offboarding script removed Bob's roles on shop on 13 November"
    hints:
      nudge: "The credential and secret are fine. Whose credential is it?"
      direction: "Look at who owns ci-deploy-2 and what that user holds on the project today."
      answer: "A credential dies when its owner loses their roles on the project. Create it under a dedicated service user instead."
    debrief:
      root_cause: |
        Application credentials are tied to the user who created them. When
        the offboarding script removed Bob's roles on shop, every credential
        he owned for that project became invalid, including the pipeline's.
        Rotating onto a dedicated service user removes the dependency on any
        person.
      ideal_path:
        - "Rule out expiry: ci-deploy-2 expires in January."
        - "Show whose credential it is: Bob's."
        - "Check Bob's roles: none, removed by the offboarding script."
        - "Create a service user with member only and a new credential under it."
        - "Update the vault, delete the old credential."
