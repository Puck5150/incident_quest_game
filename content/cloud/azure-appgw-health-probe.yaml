    url: "https://learn.microsoft.com/en-us/troubleshoot/azure/application-gateway/application-gateway-troubleshooting-502"
    retrieved: 2026-09-30
  - title: "Azure Application Gateway: Health monitoring overview"
    url: "https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-probe-overview"
    retrieved: 2026-09-30
  - title: "Azure Application Gateway: Troubleshoot backend health issues"
    url: "https://learn.microsoft.com/en-us/troubleshoot/azure/application-gateway/application-gateway-backend-health-troubleshooting"
    retrieved: 2026-09-30
  - title: "Azure CLI: az network application-gateway probe"
    url: "https://learn.microsoft.com/en-us/cli/azure/network/application-gateway/probe?view=azure-cli-latest"
    retrieved: 2026-09-30
  - title: "Azure CLI: az network application-gateway (show-backend-health)"
    url: "https://learn.microsoft.com/en-us/cli/azure/network/application-gateway?view=azure-cli-latest"
    retrieved: 2026-09-30
