# Learning tracks. `requires` lists tracks that must have at least one
# completed incident before this track unlocks (used by the skill tree).
# Only tracks with at least one scenario are shown in the game.
- { id: networking,    name: "Networking",             requires: [] }
- { id: linux,         name: "Linux Admin",            requires: [] }
- { id: containers,    name: "Containers & Kubernetes", requires: [linux] }
- { id: iac,           name: "Infrastructure as Code", requires: [] }
- { id: cicd,          name: "CI/CD",                  requires: [] }
- { id: microservices, name: "Microservices",          requires: [networking, containers] }
- { id: aws,           name: "AWS",                    requires: [networking] }
- { id: azure,         name: "Azure",                  requires: [networking] }
- { id: gcp,           name: "Google Cloud",           requires: [networking] }
- { id: cloud-design,  name: "Cloud System Design",    requires: [aws, azure, gcp], requires_any: true }
